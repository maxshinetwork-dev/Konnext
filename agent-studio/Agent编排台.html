<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230A0E15%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2222%22%20r%3D%227%22%20fill%3D%22%232DD4BF%22%2F%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2222%22%20r%3D%227%22%20fill%3D%22%23FBBF24%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2244%22%20r%3D%227%22%20fill%3D%22%237C8CFF%22%2F%3E%3Cpath%20d%3D%22M20%2022%2032%2044%2044%2022%22%20stroke%3D%22%233A4B66%22%20stroke-width%3D%223%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
<title>Agent 编排台</title>
<style>
/* ══════════════════════════════════════════════════════════════
   Agent 编排台 · 交互原型 v1
   单一深色视觉（节点编辑器是仪器，不跟随宿主主题）
   所有颜色显式声明，不依赖宿主底色
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 中性色偏冷蓝，不用纯灰 */
  --void:#0A0E15;      /* 画布虚空 */
  --panel:#111823;     /* 面板 */
  --raise:#18212F;     /* 节点本体 / 抬起面 */
  --raise2:#1F2A3B;    /* 更高一层 */
  --line:#233043;      /* 发丝线 */
  --line-soft:#1A2434;
  --text:#D9E2EF;
  --dim:#76879F;
  --dimmer:#4E5D73;

  /* 唯一的 chrome 强调色，只用于选中/焦点 */
  --pick:#7C8CFF;

  /* 语义色：权限 */
  --p-read:#4FB6E8;    /* 只读 */
  --p-write:#F0A93B;   /* 只写 */
  --p-rw:#46C98B;      /* 读写 */
  --danger:#F0616D;

  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Consolas","Menlo",monospace;

  --fs-9:9px; --fs-10:10px; --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-15:15px; --fs-20:20px;
  --r:6px;
  --rail:224px;   /* 表象面板窄态宽度 */

  /* 下拉框、滚动条这些浏览器自带控件也跟着走深色 */
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--text);
  font:var(--fs-13)/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ══════════ 登录 ══════════ */
#login{
  position:fixed;inset:0;z-index:200;
  display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(900px 600px at 30% 20%, #14203100, #0A0E15 70%),
    var(--void);
}
.login-card{
  width:100%;max-width:392px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:28px;
}
.wordmark{font-size:var(--fs-20);font-weight:600;letter-spacing:.08em;line-height:1.1}
.wordmark b{font-weight:600;color:var(--pick)}
.login-sub{color:var(--dim);font-size:var(--fs-12);margin:6px 0 26px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:var(--fs-10);color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.inp{
  background:var(--void);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;font-size:var(--fs-13);width:100%;
}
.inp:focus{outline:none;border-color:var(--pick)}
.code-row{display:flex;gap:8px}
.code-row .inp{flex:1;font-family:var(--mono);letter-spacing:.3em}
.btn{
  border:1px solid var(--line);background:var(--raise);border-radius:var(--r);
  padding:8px 13px;font-size:var(--fs-12);color:var(--text);
  transition:border-color .12s, background .12s;
}
.btn:hover:not(:disabled){border-color:var(--pick)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-primary{background:var(--pick);border-color:var(--pick);color:#0A0E15;font-weight:600}
.btn-primary:hover:not(:disabled){filter:brightness(1.12)}
.btn-block{width:100%;padding:11px;margin-top:8px}
.hint{
  margin-top:20px;padding:10px 12px;background:var(--void);
  border-left:2px solid var(--pick);border-radius:0 var(--r) var(--r) 0;
  font-size:var(--fs-11);color:var(--dim);line-height:1.65;
}
.demo-accounts{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.demo-accounts button{
  display:flex;justify-content:space-between;gap:10px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;
  font-size:var(--fs-11);color:var(--text);
}
.demo-accounts button:hover{border-color:var(--pick);background:var(--raise)}
.demo-accounts small{color:var(--dim);font-family:var(--mono)}

/* ══════════ 应用骨架 ══════════ */
#app{display:none;height:100%;grid-template-rows:auto 1fr auto}
#app.on{display:grid}

.topbar{
  display:flex;align-items:center;gap:16px;height:48px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.topbar .wordmark{font-size:var(--fs-15);letter-spacing:.06em}
.wf-name{
  display:flex;align-items:center;gap:8px;padding-left:16px;
  border-left:1px solid var(--line);height:24px;
}
.wf-name strong{font-weight:500;font-size:var(--fs-13)}
.chip{
  font-size:var(--fs-10);padding:2px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;
}
.spacer{flex:1}
.tool-group{display:flex;gap:5px}
.tool-group .btn{padding:5px 10px}
.saved-tip{
  font-size:var(--fs-10);color:var(--dimmer);white-space:nowrap;
  opacity:0;transition:opacity .25s;
}
.saved-tip.show{opacity:1}
.who{display:flex;align-items:center;gap:9px;font-size:var(--fs-12)}
.avatar{
  width:26px;height:26px;border-radius:99px;display:grid;place-items:center;
  background:var(--raise2);border:1px solid var(--line);
  font-family:var(--mono);font-size:var(--fs-11);font-weight:600;
}

/* ══════════ 主体三分 ══════════ */
.body{display:flex;min-height:0;position:relative}

/* ── 画布 ── */
.stage{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--void);cursor:grab}
.stage.panning{cursor:grabbing}
.grid-bg{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 1px 1px, #1C283A 1px, transparent 0);
}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

/* 节点 */
.node{
  position:absolute;border-radius:9px;background:var(--raise);
  border:1px solid var(--line);cursor:grab;user-select:none;
  transition:border-color .12s, box-shadow .12s;
}
.node:hover{border-color:#33445E}
.node.sel{border-color:var(--pick);box-shadow:0 0 0 1px var(--pick), 0 8px 28px -12px #7C8CFF88}
.node.locked{opacity:.5;filter:saturate(.12)}
.node.locked .n-letter{background:var(--raise2) !important;color:var(--dimmer) !important;border-color:var(--line) !important}
.node.dragging{cursor:grabbing;z-index:20}

.n-head{display:flex;align-items:center;gap:9px;padding:10px 11px 8px}
.n-letter{
  width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--mono);font-size:var(--fs-13);font-weight:700;color:#0A0E15;
}
.n-ico{
  width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;
  background:var(--raise2);border:1px solid var(--line);
}
.n-ico svg{width:14px;height:14px;display:block}
.n-title{min-width:0;display:flex;flex-direction:column;gap:1px}
.n-name{font-size:var(--fs-12);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-kind{font-size:var(--fs-9);color:var(--dim);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.n-foot{
  display:flex;align-items:center;gap:10px;padding:6px 11px;
  border-top:1px solid var(--line-soft);font-size:var(--fs-10);color:var(--dim);
}
.n-foot span{display:flex;align-items:center;gap:4px}
.n-foot b{font-family:var(--mono);font-weight:600;color:#9DB0C9;font-size:var(--fs-11)}
.n-lock{margin-left:auto;font-size:var(--fs-9);color:var(--dimmer)}

/* 端口 */
.port{
  position:absolute;width:11px;height:11px;border-radius:99px;
  background:var(--panel);border:1.5px solid #3A4B66;top:50%;margin-top:-5.5px;
  cursor:crosshair;transition:transform .1s, border-color .1s, background .1s;
}
.port:hover{transform:scale(1.45);border-color:var(--pick);background:var(--pick)}
.port.pin{left:-6px}
.port.pout{right:-6px}
.node.linkable .port.pin{border-color:var(--pick);background:var(--pick);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}

/* 连线 */
.wire{fill:none;stroke:#2E3D55;stroke-width:1.6;transition:stroke .12s}
.wire.hot{stroke:#5A6E8E}
.wire.on{stroke:var(--pick);stroke-width:2.2}
.wire-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.wire-dash{fill:none;stroke:var(--pick);stroke-width:2;stroke-dasharray:5 4}
.wire-cap{fill:#2E3D55}
.wire-cap.on{fill:var(--pick)}

/* 画布浮层控件 */
.stage-tools{
  position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;
  background:#111823E6;border:1px solid var(--line);border-radius:8px;padding:5px 7px;
  backdrop-filter:blur(6px);
}
.stage-tools button{
  width:26px;height:24px;border-radius:5px;color:var(--dim);font-size:var(--fs-13);
  display:grid;place-items:center;
}
.stage-tools button:hover{background:var(--raise2);color:var(--text)}
.zoom-val{font-family:var(--mono);font-size:var(--fs-11);color:var(--dim);min-width:42px;text-align:center}
.stage-tools .sep{width:1px;height:16px;background:var(--line)}
.stage-tools .lbl{font-size:var(--fs-11);color:var(--dim);padding:0 6px}

.stage-hint{
  position:absolute;left:12px;top:12px;font-size:var(--fs-10);color:var(--dimmer);
  line-height:1.8;pointer-events:none;
}
.stage-hint kbd{
  font-family:var(--mono);background:var(--raise);border:1px solid var(--line);
  border-radius:3px;padding:0 4px;color:var(--dim);
}

/* ── 分界线 + 扩展按钮 ── */
.divider{
  position:relative;width:1px;background:var(--line);flex:0 0 1px;
}
.expander{
  position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:22px;height:64px;border-radius:6px;
  background:var(--raise2);border:1px solid var(--line);
  display:grid;place-items:center;z-index:12;color:var(--dim);
  transition:border-color .12s, color .12s, background .12s;
}
.expander:hover{border-color:var(--pick);color:var(--pick);background:var(--raise)}
.expander svg{width:11px;height:11px}

/* ── 表象面板 ── */
.schema{
  flex:0 0 var(--rail);width:var(--rail);background:var(--panel);
  display:flex;flex-direction:column;min-width:0;
  transition:flex-basis .22s cubic-bezier(.4,0,.2,1), width .22s cubic-bezier(.4,0,.2,1);
}
.schema.wide{flex-basis:50%;width:50%}
.sec-head{
  display:flex;align-items:center;gap:8px;padding:11px 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.sec-head h2{font-size:var(--fs-11);font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#A8B8CE}
.sec-head .count{
  font-family:var(--mono);font-size:var(--fs-10);color:var(--dim);
  border:1px solid var(--line);border-radius:99px;padding:1px 6px;
}
.schema-scroll{overflow:auto;flex:1;min-height:0}

/* 窄态：图标 + 名称 */
.sch-item{
  display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;
  border-left:2px solid transparent;transition:background .12s;
}
.sch-item:hover{background:var(--raise)}
.sch-item.on{background:var(--raise);border-left-color:var(--pick)}
.sch-item.tied{border-left-color:#3A4B66}
.sch-ico{width:22px;height:26px;flex:0 0 22px;display:grid;place-items:center}
.sch-ico svg{width:20px;height:24px;display:block}
.sch-meta{min-width:0;display:flex;flex-direction:column;gap:1px}
.sch-name{font-size:var(--fs-12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-sub{font-size:var(--fs-9);color:var(--dim);font-family:var(--mono);letter-spacing:.04em}
.sch-badge{
  margin-left:auto;font-family:var(--mono);font-size:var(--fs-9);color:var(--dim);
  border:1px solid var(--line);border-radius:99px;padding:0 5px;flex:0 0 auto;
}

/* 半屏态：关联矩阵 */
.schema .wide-only{display:none}
.schema.wide .wide-only{display:block}
.schema.wide .narrow-only{display:none}

.sch-block{border-bottom:1px solid var(--line-soft)}
.sch-block-head{
  display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
  border-left:2px solid transparent;
}
.sch-block-head:hover{background:var(--raise)}
.sch-block.on .sch-block-head{background:var(--raise);border-left-color:var(--pick)}
.sch-fields{
  font-size:var(--fs-10);color:var(--dimmer);font-family:var(--mono);
  padding:0 14px 8px 45px;line-height:1.7;
}
.link-table{width:100%;border-collapse:collapse;font-size:var(--fs-11)}
.link-table th{
  text-align:left;font-weight:500;font-size:var(--fs-9);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);padding:5px 10px;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  background:#0E1520;
}
.link-table td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.link-table tr:last-child td{border-bottom:none}
.link-table tr.clickable{cursor:pointer}
.link-table tr.clickable:hover td{background:var(--raise)}
.agent-cell{display:flex;align-items:center;gap:8px}
.mini-letter{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;display:grid;place-items:center;
  font-family:var(--mono);font-size:var(--fs-10);font-weight:700;color:#0A0E15;
}
.mini-letter.off{background:var(--raise2);color:var(--dimmer)}
.perm{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-10);
  padding:2px 7px;border-radius:99px;border:1px solid;white-space:nowrap;
}
.perm i{width:5px;height:5px;border-radius:99px;background:currentColor;flex:0 0 5px}
.perm.r{color:var(--p-read);border-color:#4FB6E840;background:#4FB6E812}
.perm.w{color:var(--p-write);border-color:#F0A93B40;background:#F0A93B12}
.perm.rw{color:var(--p-rw);border-color:#46C98B40;background:#46C98B12}
.io-tag{
  font-family:var(--mono);font-size:var(--fs-9);letter-spacing:.06em;
  color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 5px;
}
.io-tag.in{color:#8FA8C4}
.io-tag.out{color:#C4A98F}

.empty{padding:22px 14px;font-size:var(--fs-11);color:var(--dimmer);text-align:center;line-height:1.8}

/* ══════════ 底部三框 ══════════ */
.dock{
  border-top:1px solid var(--line);background:var(--panel);
  display:grid;grid-template-columns:1.15fr 1fr 1fr;height:236px;
  transition:height .2s cubic-bezier(.4,0,.2,1);
}
.dock.min{height:34px}
.dock.min .box-body{display:none}
.box{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.box:last-child{border-right:none}
.box-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;flex:0 0 auto;
  border-bottom:1px solid var(--line-soft);
}
.box-head h3{font-size:var(--fs-10);font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#A8B8CE}
.box-head .sub{font-size:var(--fs-10);color:var(--dimmer)}
.box-body{overflow:auto;flex:1;min-height:0;padding:11px 12px}
.dock-toggle{margin-left:auto;color:var(--dim);font-size:var(--fs-11);padding:0 4px}
.dock-toggle:hover{color:var(--text)}

/* 框1 Prompt */
.prompt-area{
  width:100%;height:100%;min-height:110px;resize:none;background:var(--void);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;
  font-size:var(--fs-12);line-height:1.75;color:var(--text);
}
.prompt-area:focus{outline:none;border-color:var(--pick)}
.prompt-area:disabled{color:var(--dim);cursor:not-allowed;background:#0D131C}
.prompt-foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex:0 0 auto}
.prompt-foot .dim{font-size:var(--fs-10)}

/* 框2 关联 */
.kv{display:flex;gap:10px;font-size:var(--fs-11);padding:4px 0}
.kv .k{color:var(--dim);flex:0 0 68px}
.kv .v{min-width:0}
.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat{
  flex:1;background:var(--void);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 9px;
}
.stat .num{font-family:var(--mono);font-size:var(--fs-15);font-weight:600;line-height:1.2}
.stat .cap{font-size:var(--fs-9);color:var(--dim);letter-spacing:.08em;margin-top:1px}
.flow-list{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.flow-item{
  display:flex;align-items:center;gap:7px;font-size:var(--fs-11);
  padding:5px 8px;background:var(--void);border:1px solid var(--line-soft);border-radius:5px;
  cursor:pointer;
}
.flow-item:hover{border-color:var(--pick)}
.flow-arrow{font-family:var(--mono);color:var(--dimmer);flex:0 0 auto}
.flow-src{font-size:var(--fs-9);color:var(--dim);margin-left:auto;white-space:nowrap}
.sub-h{
  font-size:var(--fs-9);letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);
  margin:12px 0 5px;display:flex;align-items:center;gap:7px;
}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.sub-h:first-child{margin-top:0}
.tie-row{
  display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:var(--fs-11);
  background:var(--void);border:1px solid var(--line-soft);border-radius:5px;margin-bottom:5px;
  cursor:pointer;
}
.tie-row:hover{border-color:var(--pick)}
.tie-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tie-row .perm{margin-left:auto}

/* 框3 身份与配置 */
.cfg-grid{display:flex;flex-direction:column;gap:10px}
.cfg-row{display:flex;align-items:center;gap:9px}
.cfg-row label{font-size:var(--fs-10);color:var(--dim);flex:0 0 52px;letter-spacing:.06em}
.cfg-row .inp{padding:6px 9px;font-size:var(--fs-12)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{
  width:20px;height:20px;border-radius:5px;border:2px solid transparent;
  transition:transform .1s;
}
.sw:hover{transform:scale(1.14)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 1px var(--void) inset}
.letter-inp{
  width:44px;text-align:center;font-family:var(--mono);font-weight:700;
  font-size:var(--fs-13);text-transform:uppercase;
}
.auth-banner{
  display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:var(--r);
  font-size:var(--fs-11);line-height:1.6;margin-bottom:11px;border:1px solid;
}

<script>
/* ══════════════════════════════════════════════════════════════

/* ── 工作流 ───────────────────────────────────────── */
let nodes = [
  { id:'n1', kind:'social_bot', name:'微信客服机器人', x:40,   y:110, cfg:{ channel:'企业微信', qa:[
      { q:'请问是要装新房还是旧房改造？', a:'新房 / 旧房改造 / 只是问价' },

  { id:'n2', kind:'sms_in',     name:'客户短信回复',   x:40,   y:420, cfg:{ number:'+61 4XX XXX XXX', qa:[
      { q:'回复 1 确认预约上门，回复 2 改期', a:'1 / 2' }
    ]}},

  { id:'n3', kind:'agent', name:'意图识别',     letter:'I', color:'#2DD4BF', x:300,  y:250,
    prompt:'你负责读客户从微信或短信发来的第一句话，判断这条咨询属于哪一类：\n① 新房布线咨询  ② 旧房改造  ③ 只是问价  ④ 售后报修\n\n输出必须包含：意图类别、项目地址（若提到）、客户称呼、紧急程度。\n地址抓不到时不要猜，标记为「待人工确认」。' },

  { id:'n4', kind:'agent', name:'自动报价',     letter:'Q', color:'#FBBF24', x:570,  y:115,
    prompt:'根据意图识别给出的房型与点位需求，从产品知识库取型号与单价，生成报价单草稿。\n\n规则：\n· 布线点位按 $110/点 计\n· 型号必须来自知识库，不允许自己编\n· 缺少信息时留空并列在「待确认清单」，不要用默认值填充' },

  { id:'n5', kind:'human', name:'售前负责人 · 人工复核', x:840, y:395,
    cfg:{ note:'报价单发出前必须人工过一遍，确认点位数与型号。' } },

  { id:'n6', kind:'agent', name:'项目建档',     letter:'P', color:'#A78BFA', x:1110,  y:245,
    prompt:'客户确认报价后，建立项目档案。\n\n写入项目主表：项目编号、地址、业主联系方式、合同金额、签约日期。\n项目编号规则：KX-{年份}-{四位流水}。\n地址为空时不得建档，直接退回人工。' },

  { id:'n7', kind:'agent', name:'采购需求生成', letter:'C', color:'#38BDF8', x:1380, y:130,
    prompt:'读项目主表里已签约的项目，比对物料主表当前库存，生成需要下单采购的物料清单。\n\n只生成需求，不直接下单。库存够的物料不要出现在清单里。' },

  { id:'n8', kind:'sms_out',  name:'客户进度短信', x:1380, y:400,
    cfg:{ number:'+61 4XX XXX XXX', body:'{客户称呼}您好，您位于 {项目地址} 的项目已进入 {当前阶段}。\n如需调整安装时间请直接回复本条短信。\n—— KONNEXT' }},
  { id:'n9', kind:'email',    name:'内部日报邮件', x:1650, y:130,
    cfg:{ to:'ops@konnext.com.au', subject:'【日报】{日期} 新签约与采购需求',
      body:'今日新增签约项目 {签约数} 个，合计 {合同金额}。\n新增采购需求 {采购条数} 条，其中缺货 {缺货条数} 条。\n\n明细见附表。' }},

let edges = [
  { id:'e1', from:'n1', to:'n3' },
  { id:'e2', from:'n2', to:'n3' },
  { id:'e3', from:'n3', to:'n4' },
  { id:'e4', from:'n4', to:'n5' },
  { id:'e5', from:'n5', to:'n6' },
  { id:'e6', from:'n6', to:'n7' },
  { id:'e7', from:'n6', to:'n8' },
  { id:'e8', from:'n7', to:'n9' },
];

/* ── 表象（Agent 运行涉及的数据表 / 表格 / 文档）─────── */
let schemas = [
  { id:'s1', name:'客户咨询记录', type:'table', fields:['咨询ID','来源渠道','客户称呼','原始文本','意图类别','项目地址','紧急程度','建档时间'],
    links:[ {node:'n3',perm:'rw',io:'both'}, {node:'n5',perm:'r',io:'in'} ] },
  { id:'s2', name:'产品知识库',   type:'doc',   fields:['型号','品牌','规格','适用场景','说明书链接'],
    links:[ {node:'n3',perm:'r',io:'in'}, {node:'n4',perm:'r',io:'in'} ] },
  { id:'s3', name:'报价单',       type:'sheet', fields:['报价单号','项目地址','点位明细','单价','小计','版本','状态'],
    links:[ {node:'n4',perm:'rw',io:'out'}, {node:'n5',perm:'rw',io:'both'}, {node:'n6',perm:'r',io:'in'} ] },
  { id:'s4', name:'项目主表',     type:'table', fields:['项目编号','项目地址','业主','合同金额','签约日期','当前阶段'],
    links:[ {node:'n6',perm:'rw',io:'out'}, {node:'n7',perm:'r',io:'in'}, {node:'n8',perm:'r',io:'in'} ] },
  { id:'s5', name:'物料主表',     type:'sheet', fields:['物料编码','名称','规格','当前库存','安全库存','采购单价'],
    links:[ {node:'n7',perm:'rw',io:'both'} ] },
  { id:'s6', name:'通知发送记录', type:'table', fields:['记录ID','渠道','收件人','正文','发送时间','送达状态'],
    links:[ {node:'n8',perm:'w',io:'out'}, {node:'n9',perm:'w',io:'out'} ] },
];

/* 演示数据的原始副本 —— 「重置」用它回滚 */
const DEMO = structuredClone({ nodes, edges, schemas });

/* ══════════════════════════════════════════════════════════════
   运行时状态
   ══════════════════════════════════════════════════════════════ */
let me = null;
let selNode = null;
let selSchema = null;
let panX = 40, panY = 20, zoom = 0.82;
let panelWide = false;
let seq = 100;

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const nodeById   = id => nodes.find(n => n.id === id);
const schemaById = id => schemas.find(s => s.id === id);

function nodeSize(n){
  return n.kind === 'agent' ? { w:216, h:82 } : { w:198, h:64 };
}
function canEdit(n){
  if (!me) return false;
  if (me.agents === '*') return true;
  return me.agents.includes(n.id);
}

/* ══════════════════════════════════════════════════════════════
   本机保存 —— 双击打开的单文件也能留住改动
   存不下时不静默丢数据，明确提示走「导出」
   ══════════════════════════════════════════════════════════════ */
const STORE = 'agent-studio-v1';
let grants = {};              // 手机号 → 可操作节点，跨刷新保留
let persistTimer = null, savedTimer = null, storageOK = true;

function snapshot(){ return { ver:1, nodes, edges, schemas, seq, grants }; }

function persist(){
  if (!storageOK) return;
  try{
    localStorage.setItem(STORE, JSON.stringify(snapshot()));
    flashSaved();
  }catch(e){
    storageOK = false;
    toast('这个浏览器不让本地文件存数据，改动不会保留 —— 请用顶部「导出」自己存一份', true);
  }
}
function touch(){ clearTimeout(persistTimer); persistTimer = setTimeout(persist, 300); }

function restore(){
  try{
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.nodes) || !d.nodes.length) return false;
    nodes = d.nodes; edges = d.edges || []; schemas = d.schemas || schemas;
    seq = d.seq || 100; grants = d.grants || {};
    return true;
  }catch(e){ return false; }
}
function resetDemo(){
  const d = structuredClone(DEMO);
  nodes = d.nodes; edges = d.edges; schemas = d.schemas;
  seq = 100; grants = {}; selNode = null; selSchema = null;
  try{ localStorage.removeItem(STORE); }catch(e){}
  applyGrants(); renderAll(); fitView();
  toast('已回到演示数据');
}

/* 账号的可操作范围也要跟着存，否则刷新后自己新建的节点会变灰 */
function applyGrants(){
  if (!me) return;
  const base = ACCOUNTS.find(a => a.phone === me.phone) || ACCOUNTS[1];
  const g = grants[me.phone];
  const src = g !== undefined ? g : base.agents;
  me.agents = src === '*' ? '*' : [...src];
}
function saveGrants(){
  if (!me) return;
  grants[me.phone] = me.agents === '*' ? '*' : [...me.agents];
  touch();
}
function flashSaved(){
  const t = $('#savedTip'); if (!t) return;
  t.classList.add('show');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const SVG = {
  agent: `<svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5 14 5v6L8 14.5 2 11V5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>`,

   登录

function initLogin(){
  const box = $('#demoAccounts');
  ACCOUNTS.forEach(a => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${a.name} · ${a.role}</span><small>${a.phone}</small>`;
    b.onclick = () => { $('#phone').value = a.phone; $('#code').value = '000000'; };
    box.appendChild(b);
  });
  $('#sendCode').onclick = () => toast('验证码已发送（原型：任意 6 位数字均可）');
  $('#doLogin').onclick = login;
  $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('#logout').onclick = () => { me = null; $('#app').classList.remove('on'); $('#login').style.display = 'grid'; };
}
function login(){
  const phone = $('#phone').value.trim();
  const code  = $('#code').value.trim();
  if (!/^\d{6}$/.test(code)) return toast('验证码是 6 位数字', true);
  const restored = restore();
  const found = ACCOUNTS.find(a => a.phone.replace(/\s/g,'') === phone.replace(/\s/g,'')) || ACCOUNTS[1];
  me = { ...found };
  applyGrants();
  $('#login').style.display = 'none';
  $('#app').classList.add('on');
  $('#meName').textContent  = me.name;
  $('#mePhone').textContent = me.phone;
  $('#meAvatar').textContent = me.name.slice(0,1);
  renderAll();
  fitView();
  if (restored) toast('已读回上次在这台机器上的改动');
}

/* ══════════════════════════════════════════════════════════════
   画布：变换
   ══════════════════════════════════════════════════════════════ */
function applyTransform(){
  $('#world').style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  $('#zVal').textContent = Math.round(zoom * 100) + '%';
  const g = 26 * zoom;
  $('#gridBg').style.backgroundSize = `${g}px ${g}px`;
  $('#gridBg').style.backgroundPosition = `${panX}px ${panY}px`;
}
function setZoom(next, cx, cy){
  const st = $('#stage').getBoundingClientRect();
  const mx = cx == null ? st.width / 2  : cx - st.left;
  const my = cy == null ? st.height / 2 : cy - st.top;
  const k = Math.max(0.28, Math.min(2.2, next));
  panX = mx - (mx - panX) * (k / zoom);
  panY = my - (my - panY) * (k / zoom);
  zoom = k;
  applyTransform();
}
function screenToWorld(cx, cy){
  const st = $('#stage').getBoundingClientRect();
  return { x:(cx - st.left - panX) / zoom, y:(cy - st.top - panY) / zoom };
}
function fitView(){
  if (!nodes.length) return;
  const st = $('#stage').getBoundingClientRect();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n => { const s = nodeSize(n);
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+s.w); y1=Math.max(y1,n.y+s.h); });
  const pad = 70;
  const k = Math.min((st.width - pad*2)/(x1-x0), (st.height - pad*2)/(y1-y0), 1.5);
  zoom = Math.max(0.28, k);
  panX = (st.width  - (x1-x0)*zoom)/2 - x0*zoom;
  panY = (st.height - (y1-y0)*zoom)/2 - y0*zoom;
  applyTransform();
}

/* ══════════════════════════════════════════════════════════════
   渲染：节点 + 连线
   ══════════════════════════════════════════════════════════════ */
function renderNodes(){
  const world = $('#world');
  $$('#world .node').forEach(el => el.remove());

  nodes.forEach(n => {
    const s = nodeSize(n);
    const el = document.createElement('div');
    el.className = 'node' + (selNode === n.id ? ' sel' : '') + (canEdit(n) ? '' : ' locked');
    el.dataset.id = n.id;
    el.style.cssText = `left:${n.x}px;top:${n.y}px;width:${s.w}px;height:${s.h}px`;

    const k = KIND[n.kind];
    const head = n.kind === 'agent'
      ? `<div class="n-letter" style="background:${n.color}">${n.letter || '?'}</div>`
      : `<div class="n-ico" style="color:${channelColor(n.kind)}">${SVG[k.icon]}</div>`;

    const tied = schemas.filter(sc => sc.links.some(l => l.node === n.id)).length;
    const ins  = edges.filter(e => e.to === n.id).length;
    const outs = edges.filter(e => e.from === n.id).length;

    el.innerHTML = `
      <div class="n-head">
        ${head}
        <div class="n-title">
          <div class="n-name">${esc(n.name)}</div>
          <div class="n-kind">${k.label}</div>
        </div>
      </div>
      ${ n.kind === 'agent' ? `
      <div class="n-foot">
        <span>入 <b>${ins}</b></span>
        <span>出 <b>${outs}</b></span>
        <span>表象 <b>${tied}</b></span>
        ${ canEdit(n) ? '' : '<span class="n-lock">仅可见</span>' }
      </div>` : `
      <div class="n-foot" style="border-top:none;padding-top:0">
        <span>${ n.kind === 'human' ? '人工节点' : INPUT_KINDS.has(n.kind) ? '输入端' : '输出端' }</span>
        ${ n.kind === 'human' ? '' : '<span class="dim">点击设置内容</span>' }
        ${ canEdit(n) ? '' : '<span class="n-lock">仅可见</span>' }
      </div>`}
      <div class="port pin"  data-port="in"></div>
      <div class="port pout" data-port="out"></div>
    `;
    world.appendChild(el);
  });
  bindNodeEvents();
}

function channelColor(kind){
  return { sms_in:'#8FA8C4', sms_out:'#C4A98F', email:'#C4A98F', social_bot:'#8FA8C4', human:'#D9E2EF' }[kind] || '#8FA8C4';
}

function portPos(n, side){
  const s = nodeSize(n);
  return { x: side === 'out' ? n.x + s.w : n.x, y: n.y + s.h / 2 };
}
function wirePath(a, b){
  const d = Math.max(46, Math.abs(b.x - a.x) * 0.45);
  return `M ${a.x} ${a.y} C ${a.x + d} ${a.y}, ${b.x - d} ${b.y}, ${b.x} ${b.y}`;
}

function renderWires(){
  const svg = $('#wires');
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';

  edges.forEach(e => {
    const A = nodeById(e.from), B = nodeById(e.to);
    if (!A || !B) return;
    const a = portPos(A, 'out'), b = portPos(B, 'in');
    const d = wirePath(a, b);
    const on = selNode && (e.from === selNode || e.to === selNode);

    const hit = document.createElementNS(NS, 'path');
    hit.setAttribute('d', d); hit.setAttribute('class', 'wire-hit');
    hit.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); edgeMenu(ev, e); });
    svg.appendChild(hit);

    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'wire' + (on ? ' on' : ''));
    svg.appendChild(p);

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', b.x); c.setAttribute('cy', b.y); c.setAttribute('r', 3);
    c.setAttribute('class', 'wire-cap' + (on ? ' on' : ''));
    svg.appendChild(c);
  });
}

/* ══════════════════════════════════════════════════════════════
   交互：拖拽 / 平移 / 连线
   ══════════════════════════════════════════════════════════════ */
let drag = null, link = null, justDragged = false;

function bindNodeEvents(){
  $$('#world .node').forEach(el => {
    const id = el.dataset.id;
    const n  = nodeById(id);

    el.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      if (ev.target.classList.contains('port')) return;
      ev.stopPropagation();
      select(id);
      if (!canEdit(n)) return;
      drag = { id, dx:ev.clientX/zoom - n.x, dy:ev.clientY/zoom - n.y, moved:false, el };
      el.classList.add('dragging');
    });

    el.addEventListener('click', ev => {
      if (ev.target.classList.contains('port')) return;
      if (justDragged) return;
      if (n.kind !== 'agent' && n.kind !== 'human') openIOModal(n);
    });

    el.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); select(id); nodeMenu(ev, n); });

    el.querySelector('.port.pout').addEventListener('mousedown', ev => {
      ev.stopPropagation(); ev.preventDefault();
      if (!canEdit(n)) return toast(`「${n.name}」未授权给当前账号，不能改连线`, true);
      link = { from:id, to:null };
      $$('#world .node').forEach(o => { if (o.dataset.id !== id) o.classList.add('linkable'); });
    });
    el.querySelector('.port.pin').addEventListener('mouseup', ev => {
      if (!link) return;
      ev.stopPropagation();
      if (link.from !== id) addEdge(link.from, id);
      endLink();
    });
  });
}

function initStage(){
  const stage = $('#stage');

  stage.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    drag = { pan:true, sx:ev.clientX - panX, sy:ev.clientY - panY, moved:false };
    stage.classList.add('panning');
    select(null);
  });

  window.addEventListener('mousemove', ev => {
    if (link){ drawTempWire(ev); return; }
    if (!drag) return;
    drag.moved = true;
    if (drag.pan){
      panX = ev.clientX - drag.sx; panY = ev.clientY - drag.sy;
      applyTransform();
    } else {
      const n = nodeById(drag.id);
      n.x = Math.round(ev.clientX/zoom - drag.dx);
      n.y = Math.round(ev.clientY/zoom - drag.dy);
      drag.el.style.left = n.x + 'px';
      drag.el.style.top  = n.y + 'px';
      renderWires();
    }
  });

  window.addEventListener('mouseup', () => {
    if (drag && drag.el) drag.el.classList.remove('dragging');
    /* 拖完立刻会冒出一个 click，别让它误开弹窗 */
    justDragged = !!(drag && drag.moved);
    if (justDragged){ setTimeout(() => justDragged = false, 0); if (!drag.pan) touch(); }
    stage.classList.remove('panning');
    drag = null;
    if (link) endLink();
  });

  stage.addEventListener('wheel', ev => {
    ev.preventDefault();
    setZoom(zoom * (ev.deltaY < 0 ? 1.12 : 1/1.12), ev.clientX, ev.clientY);
  }, { passive:false });

  stage.addEventListener('contextmenu', ev => { ev.preventDefault(); canvasMenu(ev); });

  $('#zIn').onclick  = () => setZoom(zoom * 1.2);
  $('#zOut').onclick = () => setZoom(zoom / 1.2);
  $('#zFit').onclick = fitView;
  window.addEventListener('keydown', ev => {
    if (ev.key === 'Escape'){ closeCtx(); closeModal(); endLink(); }
    if ((ev.key === 'Delete' || ev.key === 'Backspace') && selNode && document.activeElement === document.body){
      const n = nodeById(selNode);
      if (n && canEdit(n)) deleteNode(n);
    }
  });
}

function drawTempWire(ev){
  const A = nodeById(link.from);
  const a = portPos(A, 'out');
  const b = screenToWorld(ev.clientX, ev.clientY);
  let t = $('#tempWire');
  if (!t){
    t = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    t.id = 'tempWire'; t.setAttribute('class','wire-dash');
    $('#wires').appendChild(t);
  }
  t.setAttribute('d', wirePath(a, b));
}
function endLink(){
  link = null;
  const t = $('#tempWire'); if (t) t.remove();
  $$('#world .node').forEach(o => o.classList.remove('linkable'));
}
function addEdge(from, to){
  if (edges.some(e => e.from === from && e.to === to)) return toast('这两个节点已经连过了');
  edges.push({ id:'e'+(++seq), from, to });
  renderAll();
  toast(`已连线：${nodeById(from).name} → ${nodeById(to).name}`);
}

/* ══════════════════════════════════════════════════════════════
   选中
   ══════════════════════════════════════════════════════════════ */
/* 选中不重建节点 DOM —— 重建会让正在拖拽的元素被卸载 */
function select(id){
  if (selNode === id){ refreshSelection(); return; }
  selNode = id;
  if (id) selSchema = null;
  refreshSelection();
  renderWires(); renderSchema(); renderDock();
}
function refreshSelection(){
  $$('#world .node').forEach(el => el.classList.toggle('sel', el.dataset.id === selNode));
}
function selectSchema(id){
  selSchema = selSchema === id ? null : id;
  renderSchema();
}

/* ══════════════════════════════════════════════════════════════
   右键菜单
   ══════════════════════════════════════════════════════════════ */
function closeCtx(){
  const c = $('.ctx');
  if (!c) return;
  if (c._dismiss) document.removeEventListener('mousedown', c._dismiss);
  c.remove();
}
function openCtx(ev, html){
  closeCtx();
  const c = document.createElement('div');
  c.className = 'ctx';
  c.innerHTML = html;
  document.body.appendChild(c);
  const r = c.getBoundingClientRect();
  c.style.left = Math.min(ev.clientX, innerWidth  - r.width  - 10) + 'px';
  c.style.top  = Math.min(ev.clientY, innerHeight - r.height - 10) + 'px';
  /* 点菜单外面才关；点在菜单里要让按钮的 click 正常发生 */
  const dismiss = e => {
    if (c.contains(e.target)) return;
    document.removeEventListener('mousedown', dismiss);
    closeCtx();
  };
  c._dismiss = dismiss;
  setTimeout(() => document.addEventListener('mousedown', dismiss), 0);
  return c;
}
function canvasMenu(ev){
  const pt = screenToWorld(ev.clientX, ev.clientY);
  const items = [
    ['agent',      'AI Agent',            '有 Prompt'],
    ['human',      '人',                  '人工节点'],
    ['sms_in',     '短信平台（输入）',     '接收'],
    ['sms_out',    '短信平台（输出）',     '发送'],
    ['email',      '邮件',                '发送'],
    ['social_bot', '社交媒体机器人',       '接收'],
  ];
  const c = openCtx(ev, `<div class="ctx-label">在此处添加</div>` + items.map(([k,label,tag]) =>
    `<button data-k="${k}">
       <span class="ci" style="color:${k==='agent'?'#7C8CFF':channelColor(k)}">${SVG[KIND[k].icon]}</span>
       ${label}<small>${tag}</small>
     </button>`).join(''));
  c.querySelectorAll('button').forEach(b => b.onclick = () => { addNode(b.dataset.k, pt.x, pt.y); closeCtx(); });
}
function nodeMenu(ev, n){
  const c = openCtx(ev, `
    <div class="ctx-label">${esc(n.name)}</div>
    <button data-a="io">设置内容 / 配置</button>
    <button data-a="dup">复制一份</button>
    <hr>
    <button class="danger" data-a="del">删除节点</button>`);
  c.querySelectorAll('button').forEach(b => b.onclick = () => {
    closeCtx();
    if (!canEdit(n) && b.dataset.a !== 'io') return toast(`「${n.name}」未授权给当前账号，只能查看`, true);
    if (b.dataset.a === 'io')  n.kind === 'agent' || n.kind === 'human' ? select(n.id) : openIOModal(n);
    if (b.dataset.a === 'dup') {
      const cp = structuredClone(n);
      cp.id = 'n'+(++seq); cp.x += 40; cp.y += 40; cp.name += ' 副本';
      nodes.push(cp);
      if (me.agents !== '*') me.agents.push(cp.id);
      saveGrants(); selNode = cp.id; renderAll();
    }
    if (b.dataset.a === 'del') deleteNode(n);
  });
}
function edgeMenu(ev, e){
  const c = openCtx(ev, `
    <div class="ctx-label">${esc(nodeById(e.from).name)} → ${esc(nodeById(e.to).name)}</div>
    <button class="danger" data-a="del">删除这条连线</button>`);
  c.querySelector('button').onclick = () => {
    closeCtx();
    edges = edges.filter(x => x.id !== e.id);
    renderAll(); toast('连线已删除');
  };
}
function addNode(kind, x, y){
  const id = 'n' + (++seq);
  const used = nodes.filter(n => n.kind === 'agent').length;
  const n = { id, kind, name:KIND[kind].cn, x:Math.round(x - 100), y:Math.round(y - 34) };
  if (kind === 'agent'){
    n.letter = String.fromCharCode(65 + (used % 26));
    n.color  = PALETTE[used % PALETTE.length];
    n.prompt = '';
    n.name   = '新 Agent';
  } else {
    n.cfg = INPUT_KINDS.has(kind) && !OUTPUT_KINDS.has(kind) ? { qa:[] } : { body:'' };
  }
  nodes.push(n);
  if (me.agents !== '*') me.agents.push(id);   // 自己新建的自然有权限
  saveGrants();
  selNode = id; selSchema = null;
  renderAll();                                  // 新节点要先画出来，不能只 select
  toast(`已添加「${n.name}」`);
}
function deleteNode(n){
  if (!canEdit(n)) return toast(`「${n.name}」未授权给当前账号，不能删`, true);
  nodes = nodes.filter(x => x.id !== n.id);
  edges = edges.filter(e => e.from !== n.id && e.to !== n.id);
  schemas.forEach(s => s.links = s.links.filter(l => l.node !== n.id));
  if (me.agents !== '*') me.agents = me.agents.filter(id => id !== n.id);
  saveGrants();
  if (selNode === n.id) selNode = null;
  renderAll();
  toast(`已删除「${n.name}」`);
}

/* ══════════════════════════════════════════════════════════════
   表象面板
   ══════════════════════════════════════════════════════════════ */
function renderSchema(){
  const wrap = $('#schemaList');
  $('#schCount').textContent = schemas.length;

  if (panelWide){
    wrap.innerHTML = schemas.map(s => {
      const rows = s.links.map(l => {
        const n = nodeById(l.node); if (!n) return '';
        const ok = canEdit(n);
        const letter = n.kind === 'agent'
          ? `<span class="mini-letter${ok?'':' off'}" style="${ok?`background:${n.color}`:''}">${n.letter||'?'}</span>`
          : `<span class="mini-letter off">${n.kind==='human'?'人':'∿'}</span>`;
        const p = PERM[l.perm];
        const ioTxt = { in:'输入', out:'输出', both:'输入 / 输出' }[l.io];
        return `<tr class="clickable" data-node="${n.id}">
          <td><div class="agent-cell">${letter}<span>${esc(n.name)}</span></div></td>
          <td><span class="perm ${p.cls}"><i></i>${p.cn}</span></td>
          <td><span class="io-tag ${l.io==='both'?'':l.io}">${ioTxt}</span></td>
          <td class="dim" style="font-size:var(--fs-10)">${ok?'可修改':'仅可见'}</td>
        </tr>`;
      }).join('');
      const tied = selNode && s.links.some(l => l.node === selNode);
      return `<div class="sch-block${(selSchema===s.id||tied)?' on':''}" data-s="${s.id}">
        <div class="sch-block-head">
          <span class="sch-ico">${schemaIcon(s.type)}</span>
          <div class="sch-meta">
            <span class="sch-name">${esc(s.name)}</span>
            <span class="sch-sub">${s.type.toUpperCase()} · ${s.fields.length} 字段 · ${s.links.length} 个节点关联</span>
          </div>
        </div>
        <div class="sch-fields">${s.fields.join(' · ')}</div>
        <table class="link-table">
          <thead><tr><th>关联节点</th><th>权限</th><th>输入 / 输出</th><th>当前账号</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="dim">还没有节点关联这张表</td></tr>'}</tbody>
        </table>
      </div>`;
    }).join('');

    wrap.querySelectorAll('.sch-block-head').forEach(h =>
      h.onclick = () => selectSchema(h.parentElement.dataset.s));
    wrap.querySelectorAll('tr.clickable').forEach(tr =>
      tr.onclick = () => select(tr.dataset.node));

  } else {
    wrap.innerHTML = schemas.map(s => {
      const tied = selNode && s.links.some(l => l.node === selNode);
      const perms = [...new Set(s.links.map(l => l.perm))];
      return `<div class="sch-item${selSchema===s.id?' on':tied?' tied':''}" data-s="${s.id}" title="${esc(s.name)} · ${s.links.length} 个节点关联">
        <span class="sch-ico">${schemaIcon(s.type)}</span>
        <div class="sch-meta">
          <span class="sch-name">${esc(s.name)}</span>
          <span class="sch-sub">${s.links.length} 关联 · ${perms.map(p=>PERM[p].cn).join('/')}</span>
        </div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('.sch-item').forEach(el =>
      el.onclick = () => selectSchema(el.dataset.s));
  }
}

function initExpander(){
  $('#expander').onclick = () => {
    panelWide = !panelWide;
    $('#schemaPanel').classList.toggle('wide', panelWide);

/* ══════════════════════════════════════════════════════════════
   底部三框
   ══════════════════════════════════════════════════════════════ */
function renderDock(){
  const n = selNode ? nodeById(selNode) : null;
  renderBox1(n); renderBox2(n); renderBox3(n);
}

/* 框 1 · Prompt */
function renderBox1(n){
  const ta = $('#promptArea');
  const ok = n && canEdit(n);
  $('#promptWho').textContent = n ? n.name : '未选中';

  if (!n){
    ta.value = ''; ta.disabled = true;
    ta.placeholder = '在画布上选中一个 Agent，这里显示并可续写它的 Prompt';
  } else if (n.kind === 'agent'){
    ta.value = n.prompt || ''; ta.disabled = !ok;
    ta.placeholder = ok ? '写这个 Agent 要做什么、按什么规则做、什么情况下必须退回人工…' : '未授权，只能查看';
  } else {
    ta.value = n.cfg?.note || ''; ta.disabled = !ok;
    ta.placeholder = n.kind === 'human' ? '写这个人在这一步要做什么' : `${KIND[n.kind].cn}节点没有 Prompt，内容在节点上点击设置`;
  }
  $('#promptLen').textContent = (ta.value.length) + ' 字';
  $('#promptSave').disabled = !ok;
}

/* 框 2 · 关联表象 + 输入输出 */
function renderBox2(n){
  const body = $('#linkBody');
  $('#linkWho').textContent = n ? n.name : '未选中';
  if (!n){ body.innerHTML = `<div class="empty">选中节点后<br>这里显示它读写哪些表象、上游是谁、下游给谁</div>`; return; }

  const tied  = schemas.filter(s => s.links.some(l => l.node === n.id));
  const ups   = edges.filter(e => e.to === n.id).map(e => nodeById(e.from)).filter(Boolean);
  const downs = edges.filter(e => e.from === n.id).map(e => nodeById(e.to)).filter(Boolean);

  const srcLabel = x =>
    x.kind === 'human' ? '真人用户' :
    x.kind === 'agent' ? 'Agent' : KIND[x.kind].cn;

  body.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num" style="color:#8FA8C4">${ups.length}</div><div class="cap">输入</div></div>
      <div class="stat"><div class="num" style="color:#C4A98F">${downs.length}</div><div class="cap">输出</div></div>
      <div class="stat"><div class="num" style="color:var(--p-rw)">${tied.length}</div><div class="cap">关联表象</div></div>
    </div>

    <div class="sub-h">关联表象</div>
    ${ tied.length ? tied.map(s => {
        const l = s.links.find(x => x.node === n.id);
        const p = PERM[l.perm];
        return `<div class="tie-row" data-s="${s.id}">
          <span class="sch-ico" style="width:16px;flex:0 0 16px"><svg viewBox="0 0 20 24" style="width:14px;height:17px">${schemaIcon(s.type).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg></span>
          <span class="nm">${esc(s.name)}</span>
          <span class="io-tag ${l.io==='both'?'':l.io}">${{in:'入',out:'出',both:'入出'}[l.io]}</span>
          <span class="perm ${p.cls}"><i></i>${p.cn}</span>
        </div>`;
      }).join('') : '<div class="dim" style="font-size:var(--fs-11);padding:2px 0 6px">未关联任何表象</div>' }

    <div class="sub-h">上游 · 输入来自</div>
    ${ ups.length ? ups.map(u => `
      <div class="flow-item" data-n="${u.id}">
        <span class="flow-arrow">→</span><span>${esc(u.name)}</span>
        <span class="flow-src">${srcLabel(u)}</span>
      </div>`).join('') : '<div class="dim" style="font-size:var(--fs-11)">没有上游，是流程起点</div>' }

    <div class="sub-h">下游 · 输出指向</div>
    ${ downs.length ? downs.map(d => `
      <div class="flow-item" data-n="${d.id}">
        <span class="flow-arrow">→</span><span>${esc(d.name)}</span>
        <span class="flow-src">${srcLabel(d)}</span>
      </div>`).join('') : '<div class="dim" style="font-size:var(--fs-11)">没有下游，是流程终点</div>' }
  `;
  body.querySelectorAll('.flow-item').forEach(el => el.onclick = () => select(el.dataset.n));
  body.querySelectorAll('.tie-row').forEach(el => el.onclick = () => {
    if (!panelWide) $('#expander').click();
    selSchema = el.dataset.s; renderSchema();
  });
}

/* 框 3 · 标识与配置 */
function renderBox3(n){
  const body = $('#idBody');
  $('#idWho').textContent = n ? n.name : '未选中';
  if (!n){ body.innerHTML = `<div class="empty">选中节点后<br>这里设置名称、颜色、标识字母与运行配置</div>`; return; }

  const ok = canEdit(n);
  const dis = ok ? '' : 'disabled';

  const banner = ok
    ? `<div class="auth-banner yes">${SVG.check}<div><b>当前账号已授权</b><span>${me.name} 可以修改这个节点</span></div></div>`
    : `<div class="auth-banner no">${SVG.warn}<div><b>未授权 · 仅可见</b><span>${me.name} 能看到它在工作流里的位置，但不能改名称、Prompt、连线或配置</span></div></div>`;

  const identity = n.kind === 'agent' ? `
    <div class="cfg-row">

      <input class="inp" id="cfgName" value="${esc(n.name)}" ${dis}>

    <div class="cfg-row">
      <label>标识</label>

      <div class="swatches" id="cfgColors">
        ${PALETTE.map(c => `<button class="sw${c===n.color?' on':''}" data-c="${c}" style="background:${c}" ${dis} aria-label="配色 ${c}"></button>`).join('')}
      </div>
    </div>
    <div class="cfg-row">
      <label>模型</label>
      <select class="inp" ${dis}>
        <option>claude-opus-5（默认）</option><option>claude-sonnet-5</option><option>claude-haiku-4.5</option>
      </select>
    </div>
    <div class="cfg-row">
      <label>触发</label>
      <select class="inp" ${dis}>
        <option>上游到达即运行</option><option>定时运行</option><option>人工点击运行</option>
      </select>
    </div>
    <div class="cfg-row">
      <label>失败时</label>
      <select class="inp" ${dis}>
        <option>停下并退回人工（推荐）</option><option>重试 2 次后退回人工</option><option>跳过继续</option>
      </select>
    </div>`
  : `
    <div class="cfg-row">
      <label>名称</label>
      <input class="inp" id="cfgName" value="${esc(n.name)}" ${dis}>
    </div>
    <div class="cfg-row">
      <label>类型</label>
      <input class="inp" value="${KIND[n.kind].cn}" disabled>
    </div>
    ${ n.kind !== 'human' ? `<div class="cfg-row"><label></label>
      <button class="btn" id="openIO" style="width:100%">${INPUT_KINDS.has(n.kind)?'设置问答内容':'设置发送正文'}</button></div>` : '' }`;

  body.innerHTML = banner + `<div class="cfg-grid">${identity}</div>`;

  const nameEl = body.querySelector('#cfgName');
  if (nameEl) nameEl.oninput = () => {
    n.name = nameEl.value; renderNodes(); renderSchema(); touch();
    $('#promptWho').textContent = n.name; $('#linkWho').textContent = n.name; $('#idWho').textContent = n.name;
  };
  const letEl = body.querySelector('#cfgLetter');
  if (letEl) letEl.oninput = () => { n.letter = letEl.value.toUpperCase(); renderNodes(); renderSchema(); touch(); };
  body.querySelectorAll('#cfgColors .sw').forEach(b => b.onclick = () => {
    if (!ok) return; n.color = b.dataset.c; renderNodes(); renderBox3(n); renderSchema(); touch();
  });

/* ══════════════════════════════════════════════════════════════
   输入 / 输出 弹窗

function closeModal(){ const s = $('.scrim'); if (s) s.remove(); }
function openIOModal(n){
  closeModal();
  const isIn = INPUT_KINDS.has(n.kind) && !OUTPUT_KINDS.has(n.kind);
  const ok = canEdit(n);
  n.cfg = n.cfg || {};

  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.addEventListener('mousedown', ev => { if (ev.target === scrim) closeModal(); });

  const bodyHtml = isIn ? `
    <div class="dim" style="font-size:var(--fs-11);line-height:1.7">
      这个节点从${esc(KIND[n.kind].cn)}接收消息。下面定义要问客户什么、期望什么样的回答 ——
      Agent 拿到回答后才往下走。
    </div>
    ${ n.cfg.number ? `<div class="cfg-row"><label style="flex:0 0 52px">号码</label><input class="inp mono" value="${esc(n.cfg.number)}" ${ok?'':'disabled'}></div>` : '' }
    ${ n.cfg.channel ? `<div class="cfg-row"><label style="flex:0 0 52px">渠道</label><input class="inp" value="${esc(n.cfg.channel)}" ${ok?'':'disabled'}></div>` : '' }
    <div id="qaList" style="display:flex;flex-direction:column;gap:9px"></div>
    ${ ok ? `<button class="btn" id="addQa">+ 加一条问答</button>` : '' }
  ` : `
    <div class="dim" style="font-size:var(--fs-11);line-height:1.7">
      这个节点向外发送。下面定义发送时的正文 —— 花括号里的内容运行时由上游 Agent 填。
    </div>
    ${ n.cfg.to ? `<div class="cfg-row"><label style="flex:0 0 52px">收件人</label><input class="inp mono" value="${esc(n.cfg.to)}" ${ok?'':'disabled'}></div>` : '' }
    ${ n.cfg.number ? `<div class="cfg-row"><label style="flex:0 0 52px">发送号</label><input class="inp mono" value="${esc(n.cfg.number)}" ${ok?'':'disabled'}></div>` : '' }
    ${ n.cfg.subject != null ? `<div class="cfg-row"><label style="flex:0 0 52px">标题</label><input class="inp" id="mSubject" value="${esc(n.cfg.subject)}" ${ok?'':'disabled'}></div>` : '' }
    <div>
      <label style="font-size:var(--fs-10);color:var(--dim);letter-spacing:.09em">正文</label>
      <textarea class="ta" id="mBody" ${ok?'':'disabled'} style="margin-top:6px">${esc(n.cfg.body||'')}</textarea>
      <div class="tokens" id="tokens"></div>
    </div>`;

  scrim.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="n-ico" style="color:${channelColor(n.kind)}">${SVG[KIND[n.kind].icon]}</span>
        <div>
          <h3>${esc(n.name)}</h3>
          <div class="sub">${esc(KIND[n.kind].cn)} · ${isIn?'输入内容':'输出正文'}${ok?'':' · 未授权，只读'}</div>
        </div>
        <button class="x-btn" id="mClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">
        <button class="btn" id="mCancel">关闭</button>
        ${ ok ? '<button class="btn btn-primary" id="mSave">保存</button>' : '' }
      </div>
    </div>`;
  document.body.appendChild(scrim);

  if (isIn){
    const list = scrim.querySelector('#qaList');
    n.cfg.qa = n.cfg.qa || [];
    const paint = () => {
      list.innerHTML = n.cfg.qa.map((q,i) => `
        <div class="qa-item">
          <div class="qa-top">
            <span class="qa-n">Q${i+1}</span>
            <span class="dim" style="font-size:var(--fs-10)">问客户</span>
            ${ ok ? `<button class="qa-del" data-i="${i}" aria-label="删除">×</button>` : '' }
          </div>
          <input class="inp" data-q="${i}" value="${esc(q.q)}" ${ok?'':'disabled'} placeholder="要问什么">
          <input class="inp" data-a="${i}" value="${esc(q.a)}" ${ok?'':'disabled'} placeholder="期望的回答形式，例如：1 / 2 / 3">
        </div>`).join('') || '<div class="dim" style="font-size:var(--fs-11)">还没有问答，点下面加一条</div>';
      list.querySelectorAll('[data-q]').forEach(el => el.oninput = () => { n.cfg.qa[+el.dataset.q].q = el.value; touch(); });
      list.querySelectorAll('[data-a]').forEach(el => el.oninput = () => { n.cfg.qa[+el.dataset.a].a = el.value; touch(); });
      list.querySelectorAll('.qa-del').forEach(el => el.onclick = () => { n.cfg.qa.splice(+el.dataset.i,1); paint(); touch(); });
    };
    paint();
    const add = scrim.querySelector('#addQa');
    if (add) add.onclick = () => { n.cfg.qa.push({ q:'', a:'' }); paint(); };
  } else {
    const ta = scrim.querySelector('#mBody');
    const toks = ['{客户称呼}','{项目地址}','{项目编号}','{当前阶段}','{合同金额}','{日期}'];
    scrim.querySelector('#tokens').innerHTML = toks.map(t => `<button class="token">${t}</button>`).join('');
    scrim.querySelectorAll('.token').forEach(b => b.onclick = () => {
      if (!ok) return;
      const p = ta.selectionStart;
      ta.value = ta.value.slice(0,p) + b.textContent + ta.value.slice(ta.selectionEnd);
      ta.focus(); ta.selectionStart = ta.selectionEnd = p + b.textContent.length;
    });
  }

  scrim.querySelector('#mClose').onclick  = closeModal;
  scrim.querySelector('#mCancel').onclick = closeModal;
  const save = scrim.querySelector('#mSave');
  if (save) save.onclick = () => {
    const b = scrim.querySelector('#mBody'); if (b) n.cfg.body = b.value;
    const s = scrim.querySelector('#mSubject'); if (s) n.cfg.subject = s.value;
    closeModal(); renderAll();
    toast(`「${n.name}」内容已保存`);
  };
}

/* ══════════════════════════════════════════════════════════════
   杂项
   ══════════════════════════════════════════════════════════════ */
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let toastTimer;
function toast(msg, bad){
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.innerHTML = (bad ? SVG.warn : SVG.check) + `<span>${esc(msg)}</span>`;
  t.style.color = bad ? 'var(--p-write)' : 'var(--p-rw)';
  t.querySelector('span').style.color = 'var(--text)';
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

function renderAll(){
  renderNodes(); renderWires(); renderSchema(); renderDock();
  $('#wfStat').textContent = `${nodes.length} 节点 · ${edges.length} 连线`;
  const n = me && me.agents !== '*' ? me.agents.filter(id => nodeById(id)).length : nodes.length;
  $('#authChip').textContent = me && me.agents === '*'
    ? '可操作全部节点' : `可操作 ${n} / ${nodes.length} 个节点`;
  applyTransform();
  touch();
}

function initDock(){
  $('#dockToggle').onclick = () => {
    const d = $('#dock');
    d.classList.toggle('min');
    $('#dockToggle').textContent = d.classList.contains('min') ? '▴' : '▾';
  };
  $('#promptArea').addEventListener('input', e => $('#promptLen').textContent = e.target.value.length + ' 字');
  $('#promptSave').onclick = () => {
    if (!selNode) return;
    const n = nodeById(selNode);
    if (!canEdit(n)) return toast('未授权，不能保存', true);
    if (n.kind === 'agent') n.prompt = $('#promptArea').value;
    else { n.cfg = n.cfg || {}; n.cfg.note = $('#promptArea').value; }
    persist();
    toast(`「${n.name}」的说明已保存`);
  };
}

/* ══════════════════════════════════════════════════════════════
   导出 / 导入 / 重置
   ══════════════════════════════════════════════════════════════ */
function openJsonModal(mode){
  closeModal();
  const isOut = mode === 'export';
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.addEventListener('mousedown', ev => { if (ev.target === scrim) closeModal(); });
  scrim.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h3>${isOut ? '导出工作流' : '导入工作流'}</h3>
          <div class="sub">${isOut
            ? '整段复制走存成文件，换台机器粘回「导入」即可'
            : '粘贴之前导出的 JSON，会覆盖当前工作流'}</div>
        </div>
        <button class="x-btn" id="mClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <textarea class="ta mono" id="jsonBox" spellcheck="false"
          style="min-height:320px;font-size:var(--fs-11);line-height:1.55"
          ${isOut ? 'readonly' : 'placeholder="把 JSON 粘在这里"'}>${isOut ? esc(JSON.stringify(snapshot(), null, 2)) : ''}</textarea>
        <div id="jsonMsg" style="font-size:var(--fs-11);color:var(--p-write)"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mCancel">关闭</button>
        <button class="btn btn-primary" id="mGo">${isOut ? '复制全部' : '导入并覆盖'}</button>
      </div>
    </div>`;
  document.body.appendChild(scrim);

  const box = scrim.querySelector('#jsonBox');
  const msg = scrim.querySelector('#jsonMsg');
  scrim.querySelector('#mClose').onclick  = closeModal;
  scrim.querySelector('#mCancel').onclick = closeModal;
  scrim.querySelector('#mGo').onclick = () => {
    if (isOut){
      box.select();
      if (navigator.clipboard?.writeText){
        navigator.clipboard.writeText(box.value)
          .then(() => { closeModal(); toast('已复制到剪贴板'); },
                () => msg.textContent = '浏览器不给自动复制，内容已全选，请按 Ctrl / Cmd + C');
      } else {
        msg.textContent = '内容已全选，请按 Ctrl / Cmd + C';
      }
      return;
    }
    let d;
    try { d = JSON.parse(box.value); }
    catch(e){ msg.textContent = 'JSON 读不通：' + e.message; return; }
    if (!d || !Array.isArray(d.nodes) || !d.nodes.length){
      msg.textContent = '这段 JSON 里没有 nodes，不像是这个平台导出的工作流';
      return;
    }
    nodes = d.nodes; edges = Array.isArray(d.edges) ? d.edges : [];
    schemas = Array.isArray(d.schemas) ? d.schemas : [];
    seq = d.seq || 100; grants = d.grants || {};
    selNode = null; selSchema = null;
    applyGrants(); closeModal(); renderAll(); fitView(); persist();
    toast(`已导入 ${nodes.length} 个节点 · ${edges.length} 条连线`);
  };
  if (isOut) setTimeout(() => box.select(), 30);
}

function initTopbar(){
  $('#btnExport').onclick = () => openJsonModal('export');
  $('#btnImport').onclick = () => openJsonModal('import');

  /* 不用 confirm()，有些浏览器在本地文件里会拦掉 —— 改成点两下 */
  let armed = false, armTimer = null;
  const b = $('#btnReset');
  const disarm = () => { armed = false; b.textContent = '重置'; b.style.borderColor = ''; b.style.color = ''; };
  b.onclick = () => {
    if (!armed){
      armed = true;
      b.textContent = '确认重置？';
      b.style.borderColor = 'var(--danger)';
      b.style.color = 'var(--danger)';
      clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(armTimer); disarm(); resetDemo();
  };
}

initLogin(); initStage(); initExpander(); initDock(); initTopbar(); applyTransform();
</script>
