<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KONNEXT 办公管理平台 · 原型</title>
<style>
:root{
  /* 浅色主题 · 经典办公蓝（用户 2026-07-30 定） */
  --bg:#f5f7fa; --bg-panel:#ffffff; --bg-elevated:#eef2f6; --border:#d8e0e8;
  --text:#1f2933; --text-muted:#5f6b76;
  --healthy:#047857; --warning:#b45309; --breach:#dc2626; --loss:#991b1b;
  --accent:#2563eb; --danger:#dc2626;
  --font:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:22px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --radius:6px; --row-h:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:var(--fs-md)/1.5 var(--font);
  -webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
.muted{color:var(--text-muted)}
button{font:inherit;cursor:pointer}

/* ══ 登录 ══ */
#login{min-height:100vh;display:grid;place-items:center;padding:var(--sp-4)}
.login-card{width:100%;max-width:380px;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:10px;padding:var(--sp-5)}
.logo{font-size:var(--fs-xl);font-weight:600;letter-spacing:.06em;margin-bottom:var(--sp-1)}
.logo span{color:var(--accent)}
.login-sub{color:var(--text-muted);font-size:var(--fs-sm);margin-bottom:var(--sp-5)}
label{display:block;font-size:var(--fs-xs);color:var(--text-muted);
  margin-bottom:var(--sp-1);letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);padding:10px var(--sp-3);border-radius:var(--radius);
  font:var(--fs-md) var(--font)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);
  padding:7px var(--sp-3);border-radius:var(--radius);font-size:var(--fs-sm)}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#ffffff;font-weight:600}
.btn-primary:hover{filter:brightness(1.1)}
.btn-block{width:100%;padding:10px;margin-top:var(--sp-4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{margin-bottom:var(--sp-4)}
.note{background:var(--bg-elevated);border-left:2px solid var(--accent);
  padding:var(--sp-2) var(--sp-3);font-size:var(--fs-xs);color:var(--text-muted);
  margin-top:var(--sp-4);border-radius:0 var(--radius) var(--radius) 0}
.demo-pick{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
.demo-pick button{font-size:var(--fs-xs);padding:5px 9px}

/* ══ 主框架 ══ */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;gap:var(--sp-4);height:48px;padding:0 var(--sp-4);
  background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-size:var(--fs-lg);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tab{background:none;border:none;color:var(--text-muted);padding:6px var(--sp-3);
  border-radius:var(--radius);font-size:var(--fs-md);white-space:nowrap;position:relative}
.tab:hover{color:var(--text);background:var(--bg-elevated)}
.tab.on{color:var(--accent);background:var(--bg-elevated)}
.tab.decision{margin-left:auto;border:1px dashed var(--border)}
.badge{background:var(--breach);color:#fff;font-size:9px;padding:1px 5px;border-radius:9px;
  margin-left:5px;vertical-align:1px;font-family:var(--mono)}
.who{display:flex;align-items:center;gap:var(--sp-2);flex-shrink:0}
.who select{width:auto;padding:5px var(--sp-2);font-size:var(--fs-sm)}
.bell{background:none;border:1px solid var(--border);border-radius:var(--radius);
  padding:5px 9px;color:var(--text);font-size:var(--fs-sm)}
.bell:hover{border-color:var(--accent)}

.body{display:flex;flex:1;min-height:0}
.side{width:190px;background:var(--bg-panel);border-right:1px solid var(--border);
  padding:var(--sp-3) 0;flex-shrink:0;overflow-y:auto}
.side-item{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text-muted);padding:8px var(--sp-4);font-size:var(--fs-md);
  border-left:2px solid transparent}
.side-item:hover{color:var(--text);background:var(--bg-elevated)}
.side-item.on{color:var(--accent);border-left-color:var(--accent);background:var(--bg-elevated)}
.side-sep{height:1px;background:var(--border);margin:var(--sp-3) var(--sp-4)}
.main{flex:1;overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.main-inner{padding:var(--sp-4) var(--sp-5);flex:1}
/* ★项目上下文条：所有流程都跟项目走，随时看得见是哪个项目、在哪儿 */
.pjbar{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);
  background:var(--bg-elevated);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.pjbar select{width:auto;max-width:340px;font-size:var(--fs-md);padding:5px var(--sp-2)}
.pjbar .addr{color:var(--text-muted);font-size:var(--fs-sm);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pjbar .sep{width:1px;height:20px;background:var(--border)}
.pjbar .grow{flex:1}
.coybar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-5);
  background:rgba(139,148,158,.07);border-bottom:1px solid var(--border);
  font-size:var(--fs-xs);color:var(--text-muted);position:sticky;top:0;z-index:10}

/* ══ 通用件 ══ */
h2{font-size:var(--fs-lg);font-weight:600;margin-bottom:var(--sp-1)}
.page-sub{color:var(--text-muted);font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:var(--sp-4);overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.panel-head{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);
  font-size:var(--fs-sm);font-weight:600;display:flex;align-items:center;gap:var(--sp-2)}
.panel-body{padding:var(--sp-4)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th{text-align:left;color:var(--text-muted);font-weight:500;font-size:var(--fs-xs);
  letter-spacing:.04em;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);
  white-space:nowrap}
td{padding:var(--sp-3);border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-elevated)}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.masked{color:var(--text-muted);font-family:var(--mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-4)}
.card-label{font-size:var(--fs-xs);color:var(--text-muted);letter-spacing:.04em;
  margin-bottom:var(--sp-2)}
.card-value{font-size:var(--fs-xl);font-family:var(--mono);font-weight:600}
.card-foot{font-size:var(--fs-xs);color:var(--text-muted);margin-top:var(--sp-1)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:var(--fs-xs);
  font-weight:500;white-space:nowrap}
.p-green{background:rgba(16,185,129,.16);color:var(--healthy)}
.p-amber{background:rgba(245,158,11,.16);color:var(--warning)}
.p-red{background:rgba(239,68,68,.16);color:var(--breach)}
.p-grey{background:rgba(139,148,158,.16);color:var(--text-muted)}
.p-loss{background:rgba(153,27,27,.12);color:#991b1b}
.p-cyan{background:rgba(37,99,235,.10);color:var(--accent)}
.warn-bar{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);
  border-radius:var(--radius);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);
  display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-sm)}
.warn-bar.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35)}
.warn-bar.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}
.warn-bar .grow{flex:1}
.gate{background:rgba(239,68,68,.08);border-left:2px solid var(--breach);
  padding:var(--sp-2) var(--sp-3);font-size:var(--fs-xs);color:#b91c1c;
  border-radius:0 var(--radius) var(--radius) 0;margin-top:var(--sp-2)}
.strike{text-decoration:line-through;color:var(--text-muted)}
.hint{font-size:var(--fs-xs);color:var(--text-muted);margin-top:var(--sp-1)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:900px){.split{grid-template-columns:1fr}.side{width:150px}}

/* 排班 */
.sched{overflow-x:auto}
.sched table{min-width:640px}
.blk{border-radius:4px;padding:5px 7px;font-size:var(--fs-xs);margin-bottom:3px;
  border-left:3px solid}
.b-sm{background:rgba(37,99,235,.10);border-color:var(--accent)}
.b-in{background:rgba(16,185,129,.12);border-color:var(--healthy)}
.b-ho{background:rgba(245,158,11,.12);border-color:var(--warning)}
.b-mt{background:rgba(124,58,237,.10);border-color:#7c3aed}

/* 待办抽屉 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);
  background:var(--bg-panel);border-left:1px solid var(--border);z-index:50;
  transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:var(--sp-4);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--sp-3)}
.drawer-body{flex:1;overflow-y:auto;padding:var(--sp-3)}
.todo{background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--sp-3);margin-bottom:var(--sp-2)}
.todo.over{border-color:rgba(239,68,68,.5)}
.todo-top{display:flex;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-1);flex-wrap:wrap}
.todo-act{font-size:var(--fs-sm);color:var(--text)}
.todo-meta{font-size:var(--fs-xs);color:var(--text-muted);margin-top:var(--sp-2)}
.todo-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:var(--sp-2)}
.todo-btns .btn{padding:4px 10px;font-size:var(--fs-xs)}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none}
.backdrop.open{display:block}

/* 进度条 */
.steps{display:flex;gap:2px;margin:var(--sp-3) 0}
.step{flex:1;text-align:center;font-size:var(--fs-xs);padding:var(--sp-2) 2px;
  background:var(--bg-elevated);color:var(--text-muted);border-top:2px solid var(--border)}
.step.done{color:var(--healthy);border-top-color:var(--healthy)}
.step.now{color:var(--accent);border-top-color:var(--accent);background:rgba(37,99,235,.08)}
.step.bad{color:var(--breach);border-top-color:var(--breach)}

/* 售前大表：一页长表 · 冻结前两列 · 分组表头 */
.bigwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-panel);box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:var(--sp-4)}
.bigtable{border-collapse:separate;border-spacing:0;min-width:2080px;font-size:var(--fs-sm);width:max-content}
.bigtable th,.bigtable td{border-bottom:1px solid var(--border);border-right:1px solid #eef2f6;
  padding:var(--sp-2);vertical-align:middle;background:var(--bg-panel);white-space:nowrap}
.bigtable thead .grp th{background:#e8eef7;color:#33507a;font-weight:600;font-size:var(--fs-xs);
  letter-spacing:.05em;text-align:center;padding:9px 12px;border-bottom:2px solid #c3d2e4}
.bigtable thead .leaf th{background:#f3f6fa;color:var(--text-muted);font-weight:500;
  font-size:var(--fs-xs);padding:8px 12px;letter-spacing:.03em}
.bigtable tbody tr:hover td{background:var(--bg-elevated)}
.bigtable .c1{position:sticky;left:0;z-index:3;min-width:110px}
.bigtable .c1b{position:sticky;left:110px;z-index:3;min-width:90px}
.bigtable .c2{position:sticky;left:200px;z-index:3;min-width:170px;border-right:2px solid var(--border)}
.bigtable thead .c1,.bigtable thead .c1b,.bigtable thead .c2{z-index:4}
.bigtable input,.bigtable select{width:auto;padding:4px 6px;font-size:var(--fs-sm)}
.bigtable input.w80{width:84px}.bigtable input.w60{width:60px}
.mini7{display:flex;gap:5px;align-items:flex-start;height:58px}
.m7{display:flex;flex-direction:column;align-items:center;width:21px}
.m7 .bx{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;
  font-size:10px;background:var(--bg-elevated);color:var(--text-muted);cursor:pointer;flex-shrink:0}
.m7.on .bx{background:rgba(4,120,87,.14);color:var(--healthy)}
.m7.now .bx{background:rgba(37,99,235,.16);color:var(--accent);font-weight:700}
.m7:last-child .bx{border:1px dashed rgba(220,38,38,.45)}   /* 第⑦格常显红框：流失/流标 */
.m7.lost .bx{background:rgba(220,38,38,.16);color:var(--breach);font-weight:700;border-style:solid}
/* 勾下 45° 斜排状态文字（用户定） */
.m7 .lb{margin-top:3px;font-size:9px;color:var(--text-muted);font-style:normal;
  transform:rotate(45deg);transform-origin:top left;white-space:nowrap;
  width:10px;letter-spacing:.02em}
.m7.now .lb{color:var(--accent);font-weight:600}
.m7.lost .lb{color:var(--breach);font-weight:600}
/* 列组分隔线（用户定：分组线清晰） */
.bigtable .gs{border-left:2px solid #c3d2e4}
/* 注释大框（用户定）：多行小字 textarea + 悬浮弹出全文 */
.notewrap{position:relative;min-width:176px}
.notewrap textarea{width:176px;min-height:46px;font-size:11px;line-height:1.55;
  padding:5px 7px;resize:vertical;display:block}
.notepop{display:none;position:absolute;bottom:calc(100% + 6px);left:0;z-index:30;
  width:300px;background:#243447;color:#f5f8fa;font-size:11.5px;line-height:1.8;
  padding:9px 11px;border-radius:6px;white-space:pre-wrap;
  box-shadow:0 8px 24px rgba(16,24,40,.28)}
.notewrap:hover .notepop{display:block}
/* 排班表（四十一轮）：一天一格可放多条任务；悬停出完整浮窗 */
.schgrid{width:100%;border-collapse:collapse;table-layout:fixed}
.schgrid th,.schgrid td{border:1px solid var(--border);vertical-align:top;padding:5px}
.schgrid th{background:var(--bg-elevated);font-size:var(--fs-xs);font-weight:600}
.schgrid td.past{background:repeating-linear-gradient(45deg,#f6f8fa,#f6f8fa 6px,#eef1f5 6px,#eef1f5 12px)}
.schgrid td.lockd{background:#f3f6f9}
.schtask{position:relative;border-radius:4px;padding:3px 6px;margin-bottom:4px;font-size:11px;
  line-height:1.5;cursor:default;border-left:3px solid rgba(0,0,0,.18)}
.schtask .pop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;width:270px;
  background:#243447;color:#f5f8fa;font-size:11.5px;line-height:1.8;padding:9px 11px;border-radius:6px;
  white-space:pre-wrap;box-shadow:0 8px 24px rgba(16,24,40,.3);text-align:left}
.schtask:hover .pop{display:block}
.t-sm{background:#fef3e2;color:#8a5a12}.t-inst{background:#e8f1fe;color:#1b4a91}
.t-deli{background:#e7f6ee;color:#11693f}.t-mt{background:#eae9fb;color:#4b3f9e}
.t-toil{background:#eef1f5;color:#5f6b76}
/* 财务侧只读注释框（二十三轮）：大框小字固定两行，文字截断绝不破格；悬停弹全文；标已读固定在框下右侧 */
.fnote{background:#fff8e6;border:1px solid #f0dfae;border-radius:4px;padding:4px 7px;
  font-size:11px;line-height:1.5;width:216px;height:38px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:default}
.fnote-foot{width:216px;display:flex;justify-content:flex-end;margin-top:2px;font-size:11px}
/* 列表行删除按钮（修改抽屉） */
.delx{cursor:pointer;color:var(--breach);font-size:13px;padding:0 5px;font-weight:600}
.delx:hover{background:rgba(220,38,38,.10);border-radius:4px}

/* 立项引导弹层 */
.wizback{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:60;display:none}
.wizback.open{display:block}
.wizbox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(580px,94vw);
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;z-index:61;
  display:none;box-shadow:0 12px 40px rgba(16,24,40,.18)}
.wizbox.open{display:block}
.wizhead{padding:var(--sp-4);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-3)}
.wizdots{display:flex;gap:6px;margin-left:auto}
.wizdots i{width:26px;height:6px;border-radius:3px;background:var(--bg-elevated)}
.wizdots i.on{background:var(--accent)}
.wizbody{padding:var(--sp-4);max-height:62vh;overflow-y:auto}
.wizfoot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);
  display:flex;justify-content:space-between;gap:var(--sp-2)}
</style>
</head>
<body>

<!-- ═══════════════ 登录 ═══════════════ -->
<div id="login">
  <div class="login-card">
    <div class="logo">KON<span>NEXT</span></div>
    <div class="login-sub">办公管理平台 · 原型演示</div>

    <div id="step-phone">
      <div class="field">
        <label>手机号</label>
        <input id="phone" placeholder="+61 4xx xxx xxx" value="+61 411 000 004">
      </div>
      <button class="btn btn-primary btn-block" onclick="sendCode()">获取验证码</button>
      <div class="note">
        全系统<b>无密码</b>——只用短信验证码登录。管理员另需邮箱二次验证。<br>
        账号找回：仅管理员可自助，其余一律由管理员重置。
      </div>
    </div>

    <div id="step-code" style="display:none">
      <div class="field">
        <label>验证码（已发送至 <span id="sent-to" class="mono"></span>）</label>
        <input id="code" placeholder="6 位数字" value="284917" class="mono">
        <div class="hint">10 分钟内有效，用过即失效</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
      <div class="note">
        <b>原型演示：直接选一个身份进入</b>，看同一套界面在不同权限下的差别
        <div class="demo-pick">
          <button class="btn" onclick="loginAs('admin')">陈总 · 核心管理员</button>
          <button class="btn" onclick="loginAs('presales')">小林 · 售前</button>
          <button class="btn" onclick="loginAs('finance')">王姐 · 财务</button>
          <button class="btn" onclick="loginAs('warehouse')">老张 · 采购＋库管</button>
          <button class="btn" onclick="loginAs('maintenance')">小周 · 运维</button>
          <button class="btn" onclick="loginAs('eng')">陈工 · 工程管理</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ 主界面 ═══════════════ -->
<div id="app">
  <header class="topbar">
    <div class="brand">KON<span>NEXT</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <button class="bell" onclick="toggleDrawer()">🔔 待办 <span id="todo-n" class="mono"></span></button>
      <select id="who-sel" onchange="switchWho(this.value)"></select>
    </div>
  </header>

  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>

     · <b>补货建议来自库管</b> —— 采购更像是<b>库管需求指令的执行者</b>

   所以：本线不做"在线下单"，做的是<b>需求 → 决策 → 指令留痕 → 到货跟踪</b>。 */

     '这里只把<b>指令记下来</b>：什么时候、什么原因、买什么、多少、什么汇率、多少钱，然后<b>跟踪什么时候到</b></div>'+

function pcPoSave(suppId){ const sp=suppOf(suppId);
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const fx=parseFloat(v('pc-fx')), eta=v('pc-eta');
  if(!(fx>0)){ uiAlert('门禁：汇率必须是正数 —— 汇率填错，这单的成本从头错到尾，而且不会报错'); return; }
  if(!eta){ uiAlert('门禁：必须填预计到货日 —— 不填就没法跟踪"什么时候能到"，工地在等的话更要填'); return; }
  const lines=[...document.querySelectorAll('.pc-q')].map(q=>{
    const mat=q.dataset.mat;
    const u=[...document.querySelectorAll('.pc-u')].find(x=>x.dataset.mat===mat);
    return {mat,qty:parseFloat(q.value)||0,unit:parseFloat(u&&u.value)||0,
      want:parseFloat(q.dataset.want)||0};}).filter(l=>l.qty>0);
  if(!lines.length){ uiAlert('门禁：数量都是 0 —— 没有要买的东西'); return; }
  /* 改了库管要的数量 → 必须说明（起订量、整箱规格这些现实约束是有的，但不能悄悄改） */
  const diff=lines.filter(l=>l.qty!==l.want);
  if(diff.length&&!pcDlg.qtyWhy){
    uiPrompt('你把库管要的数量改了（'+diff.map(l=>matOf(l.mat).name+' '+l.want+'→'+l.qty).join('、')+
      '）。为什么？（必填 ≥4 字 · 会告知库管）',w=>{ const why=(w||'').trim();
      if(why.length<4){ uiAlert('门禁：改了库管要的数量必须说明原因 —— 最小起订量、整箱规格都是正当理由，\n'+
        '但悄悄改数量，到货点数时对不上就成了谁也说不清的账'); return; }
      pcDlg.qtyWhy=why; pcPoSave(suppId); });
    return; }
  const id='PO-2026-'+String(30+PCPO.length+1);
  const pj=[...new Set(pcDlg.reqs.map(rid=>(PCREQ.find(r=>r.id===rid)||{}).pj).filter(Boolean))];
  PCPO.unshift({id,supp:suppId,cur:sp.cur,fx,at:nowTs(),by:WHO[me].name,
    reason:v('pc-why'),pj:pj.length===1?pj[0]:'',lines,eta:eta.replace(/-/g,'/'),arrivedAt:null,st:'在途'});
  pcDlg.reqs.forEach(rid=>{const r=PCREQ.find(x=>x.id===rid); if(r){ r.st='已下单'; r.po=id; }});
  pcPick={};
  const p=PCPO[0];
  opLog(p.pj,'生成采购单',id+' · '+sp.name+' · '+v('pc-why')+' · '+poQty(p)+' 件 · '+
    sp.cur+' '+poAmt(p).toLocaleString()+'（汇率 '+fx+' 定格 → '+A$(poAud(p))+'）· 预计 '+p.eta+' 到'+
    (pcDlg.qtyWhy?'　★改了库管要的数量：'+pcDlg.qtyWhy:''),['proc','wh']);
  notifAdd(p.pj,'采购单 '+id+' 已生成（'+sp.name+'）· 预计 '+p.eta+' 到货',
    [{who:'库管 老张',how:'待办',ok:false}]);
  pcClose(); renderAll();
  uiAlert('已生成 '+id+' ✓ 汇率 '+fx+' 已定格\n★ 接下来<b>线下去跟供应商下单</b>；到货由库管入库，这里只跟踪 ETA'); }

   现算的好处：工程一改数量、采购一下单，这张表立刻跟着变，不用谁去维护 */
function pcReqAll(){
  const out=[...PCREQ.filter(r=>r.st==='待下单'),...pcRestock().filter(r=>r.st==='待下单')];
  PROJECTS.filter(p=>['施工中','项目交付'].includes(p.status)).forEach(p=>{
    bomRows(p.code).filter(r=>r.gap>0).forEach(r=>out.push({
      id:'RQ-'+p.code.slice(-4)+'-'+r.mat, src:'项目物料', pj:p.code, mat:r.mat, qty:r.gap,
      why:(r.fromQuote?'报价原始单':'工程 Additional 新增')
        +(r.delta?'，工程变更 '+(r.delta>0?'+':'')+r.delta:'')
        +(r.canCover>0?' · ★仓库有现货 '+r.canCover+' 件，先问库管能不能直接出库':''),
      at:'现算', by:'项目物料账', st:'待下单', canCover:r.canCover}));
  });

     同一件事两个数字，迟早对不上而且不报错（六十三轮刚踩过这个坑）。 */
  MATREQ.filter(r=>r.kind==='mt'&&r.st==='缺货待采购').forEach(r=>
    (r.chk&&r.chk.short||[]).forEach(sh=>out.push({
      id:'MR-'+r.id+'-'+sh.mat, src:'运维提货', pj:r.pj, mat:sh.mat, qty:sh.need-sh.stock,
      why:'运维出货单 '+r.id+(r.mtId?'（维护单 '+r.mtId+'）':'')+' —— 库里差 '+(sh.need-sh.stock)+

      at:(r.chk&&r.chk.at)||'现算', by:'工程 '+r.by, st:'待下单', canCover:0})));
  return out; }

function rmaRecvSave(id){ const r=PCRMA.find(x=>x.id===id); if(!r) return;

  if(less) uiConfirm('收到 '+q+' 件，比寄回去的 '+r.qty+' 件<b>少 '+(r.qty-q)+' 件</b>。\n'+

/* 定期催确认：在等对方的三个状态都能催，短信走公司统一号码 */

/* ══════════ 项目物料账（六十二轮 · 2026-08-05 采购负责人提，用户拍板）══════════

     客户回头问"我付的钱里那 10 个面板呢"，没人答得上来。 */

/* 报价原始单：pending＝Excel 里认不上的物料编码，挂起并卡住工程人员那一步 */
let QBOM=[
 {pj:'KX-2026-0188',ver:1,quoteVer:'V5.8',at:'2026/07/20 09:30',by:'老张',

/* 物料变更单：工程人员在 App 提，工程管理负责人审（只看变量，不看整表） */
let BOMCHG=[
 {id:'CHG-0188-01',pj:'KX-2026-0188',stage:'SM2',by:'阿强（App 现场）',at:'2026/07/29 16:20',

 {id:'CHG-0188-02',pj:'KX-2026-0188',stage:'施工中',by:'小陈（App 现场）',at:'2026/08/03 10:40',
  st:'待审',why:'业主临时加了花园廊架灯控，要补 2 路调光和一段总线',

  reviewBy:'',reviewAt:'',reviewNote:''},

const QSRC=['报价原始单','SM2 变更','施工新增','库管补货'];
const qbomOf=pj=>QBOM.filter(q=>q.pj===pj).sort((a,b)=>b.ver-a.ver)[0]||null;
const chgOf=pj=>BOMCHG.filter(c=>c.pj===pj).sort((a,b)=>a.at<b.at?-1:1);
/* ★某项目某物料的【应采数量】现算：原始 → 按时间顺序套用已批变更 */
function bomQty(pj,mat){
  const q=qbomOf(pj);
  let n=q?((q.lines.find(l=>l.mat===mat)||{}).qty||0):0;
  chgOf(pj).filter(c=>c.st==='已批').forEach(c=>{
    const e=(c.edits||[]).find(x=>x.mat===mat);
    if(e) n=e.to;                                   // 调数量＝改成多少（后一次覆盖前一次）
    (c.adds||[]).filter(a=>a.mat===mat).forEach(a=>n+=a.qty);   // Additional＝加上去
  });
  return n; }
/* ★库管备料（第四段）：工程审批通过后，库管确认从仓库现货里拨给这个项目多少。
   备了的那部分不用再买 —— 所以「还要买」＝应采 − 已下单 − 库管已备。
   ★这是"确认"不是"现算"：库管点了才算数。不然每次刷新库存一变，采购看到的数就跳。 */
let WHRSV=[
 {pj:'KX-2026-0188',mat:'M-CBL-KNX',qty:8,at:'2026/08/01 14:20',by:'老张',
  note:'仓库有整卷现货，直接拨给林宅，不用再买'},
];
const rsvOf=(pj,mat)=>WHRSV.filter(r=>r.pj===pj&&r.mat===mat).reduce((x,r)=>x+r.qty,0);
/* 这个项目这个料已经下过多少单（采购单里） */
const bomOrdered=(pj,mat)=>PCPO.filter(p=>p.pj===pj&&p.st!=='已取消')
  .reduce((x,p)=>x+p.lines.filter(l=>l.mat===mat).reduce((y,l)=>y+l.qty,0),0);
/* 一个项目的完整物料账：三段合成一张，每行现算「应采/已下单/库房现货/还要买」 */
function bomRows(pj){
  const q=qbomOf(pj); if(!q&&!chgOf(pj).length) return [];
  const codes=[...new Set([...(q?q.lines.map(l=>l.mat):[]),
    ...chgOf(pj).flatMap(c=>[...(c.edits||[]).map(e=>e.mat),...(c.adds||[]).map(a=>a.mat)])])];
  return codes.map(mat=>{
    const base=q?((q.lines.find(l=>l.mat===mat)||{}).qty||0):0;
    const need=bomQty(pj,mat), ord=bomOrdered(pj,mat), rsv=rsvOf(pj,mat);
    const stock=stockOf(mat);
    /* 还要买 ＝ 应采 − 已下单 − 库管已备（库管从现货里拨过来的那部分不用再买） */
    const gap=Math.max(0,need-ord-rsv);
    /* ★买多了：已下单 > 应采。多半是工程后来减了量、而采购已经下过单。
       原来这行会显示绿色「齐了」—— 那 18 件的钱就悄悄留在项目成本里，没人会发现。 */
    const over=Math.max(0,ord+rsv-need);
    return {mat,base,need,ord,rsv,stock,gap,
      fromQuote:base>0,
      area:q?((q.lines.find(l=>l.mat===mat)||{}).area||''):'',
      over,
      canCover:Math.min(stock,gap),                  // 库房现货还能顶多少（库管确认后进 rsv）
      delta:need-base};
  }).sort((a,b)=>(b.fromQuote?1:0)-(a.fromQuote?1:0)||a.mat.localeCompare(b.mat)); }
/* 挂起：Excel 里认不上的物料编码 —— 不补齐就卡住工程人员那一步 */
const qbomPending=()=>QBOM.flatMap(q=>(q.pending||[]).map(p=>({...p,pj:q.pj,ver:q.ver,file:q.file})));

/* ══════════ 提货申请 / 出货单（用户 2026-08-10 提：做进排班表）══════════
   谁去提、什么时候提，本来就是<b>排班那一刻</b>才知道的 —— 所以入口放在工程「派工排班」：
     ①【施工首次出库】排安装任务时，如果这个项目<b>还没出过库</b>，勾一下
        「提醒他去仓库办提货」→ 生成一张出货单。项目的施工出库通常<b>一次性</b>出完
     ②【SM2 预提】排 Site Meeting 时勾 → 走 SM2 预提那条窄通道（只我方、只线材）
     ③【运维出库】排维护任务时填「这次要带什么」→ 工程管理向库管下发提货需求
   下发之后统一进<b>库存核对</b>：
     · 库里有货 → 库管安排出货（那一刻才扣库存）
     · 库里缺货 → 库管端提醒采购，<b>工程端同时收到「库里无货、需要采购」</b>，
       工程去问采购要 lead time，填回来给现场一个准信
   ★为什么要"核对"这一步：工程看不到库存（也不该看），库管看不到工地什么时候要人到场。
     不核对就派人去拉，白跑一趟没人会报错。 */
const MREQ_KIND={build:'施工首次出库',sm2:'SM2 预提线材',mt:'运维出库'};
let MATREQ=[
 {id:'PR-0203-01',pj:'KX-2026-0203',kind:'sm2',mtId:'',who:'陈工',by:'陈工',

 {id:'PR-0142-01',pj:'KX-2026-0142',kind:'mt',mtId:'MT-0142-02',who:'Tony',by:'陈工',

const mreqOf=pj=>MATREQ.filter(r=>r.pj===pj);

function poForMat(mat){ const p=PCPO.filter(x=>!x.arrivedAt&&x.st!=='已取消'&&x.lines.some(l=>l.mat===mat))

const mreqShortTxt=r=>((r.chk&&r.chk.short)||[]).map(x=>matOf(x.mat).name+' 差 <b>'+(x.need-x.stock)+

/* ── 库管：核对库存（有货 / 缺货，一次算清）── */
function mreqCheck(id){ const r=MATREQ.find(x=>x.id===id); if(!r) return;

/* ── 工程：问采购要 lead time，填回来 ── */
function mreqLead(id){ const r=MATREQ.find(x=>x.id===id); if(!r) return;
  if(r.st!=='缺货待采购'){ uiAlert('这张出货单现在不缺货（'+r.st+'），不用问交期'); return; }
  const sh=(r.chk&&r.chk.short||[]);

    '\n\n★填了之后库管和现场都能看到 —— 不填，工地就只能天天来问',v=>{

const causeBill=k=>!!(MT_CAUSE.find(x=>x.k===k)||{}).bill;

/* 两套维保钟（★起点/长短/用途都不一样，页面上必须分开显示）
   免责维保：从<交付那天>起算，售前签约时定 3~12 个月 → 决定这单收不收客户钱
   物料保修：从<S2 物料款结清那天>起算，按供应商各自月数 → 决定能不能向供应商退换 */
const MTWAR={
 'KX-2026-0142':{deliv:'2026/01/28',freeM:12, s2:'2025/12/20',partM:24},
 'KX-2026-0121':{deliv:'2025/07/10',freeM:6,  s2:'2025/05/28',partM:24},
 'KX-2026-0180':{deliv:'2026/07/28',freeM:12, s2:'2025/11/02',partM:24},
};
const dOf=x=>x?new Date(x.replace(/-/g,'/')):null;
const addM=(d,m)=>{const x=new Date(d); x.setMonth(x.getMonth()+m); return x;};
const dayLeft=d=>d?Math.round((d-new Date())/864e5):null;
const ymd=d=>d?d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'):'—';
function warOf(code){ const w=MTWAR[code]; if(!w) return null;
  const fEnd=addM(dOf(w.deliv),w.freeM), pEnd=addM(dOf(w.s2),w.partM);
  return {...w, fEnd, pEnd, fLeft:dayLeft(fEnd), pLeft:dayLeft(pEnd)}; }
/* 免责判定（结案时定格）：免责期内 + 非人为 = 全免 */
function freeJudge(code,cause){ const w=warOf(code);
  if(!cause) return {ok:null,why:'现场还没确认归因 —— 定不了免不免'};
  if(causeBill(cause)) return {ok:false,why:causeCn(cause)+' —— 不免，正常计费'};
  if(!w) return {ok:false,why:'查不到交付日期，按不免处理（请人工确认）'};
  return w.fLeft>=0
    ? {ok:true, why:'免责期内（还剩 '+w.fLeft+' 天）+ '+causeCn(cause)+' —— 全免'}
    : {ok:false,why:'免责期已过 '+(-w.fLeft)+' 天 —— '+causeCn(cause)+' 也照常计费'}; }

/* 订阅：五档，第 5 档=不订阅（不许填年费）· 订阅收支不计入项目利润率 */
let SUBS=[
 {code:'KX-2026-0142',tier:2,fee:1200,from:'2026/05/31',to:'2027/05/31',auto:true},
 {code:'KX-2026-0121',tier:3,fee:800, from:'2025/06/01',to:'2026/06/01',auto:true},
 {code:'KX-2026-0180',tier:1,fee:2400,from:'2026/07/28',to:'2027/07/28',auto:true},

function subState(x){ if(x.cancelled) return {k:'已退订',cls:'p-grey',left:null};
  if(x.tier===5) return {k:'不订阅',cls:'p-grey',left:null};
  const L=dayLeft(dOf(x.to));
  return L<0?{k:'已逾期',cls:'p-red',left:L}
    :L<=mtSet.subRemindDays?{k:'即将到期',cls:'p-amber',left:L}:{k:'生效中',cls:'p-green',left:L}; }
const subOf=code=>SUBS.find(x=>x.code===code);

/* ── 维护单：运维视角的状态链（财务只认后三态，前面几步它看不到也不该看到）──
   已受理 → 已派工 → 上门（三样齐才算完）→ 待定价 → 已开票 → 已结案 ｜ 已作废 */
function mtStage(c){
  if(c.st==='已作废') return {k:'已作废',cls:'p-grey',next:'—'};
  if(c.st==='已结案') return {k:'已结案',cls:'p-green',next:'—'};
  if(c.st==='已开票') return {k:'已开票',cls:'p-cyan',next:'等财务收款结案'};
  if(c.st==='待定价') return {k:'待定价',cls:'p-amber',next:'等财务定价开票'};
  if(c.job&&c.job.done) return {k:'上门完 · 三样不齐',cls:'p-red',next:'补齐归因/服务内容/客户签字，财务才定得了价'};
  if(c.job) return {k:'已派工',cls:'p-cyan',next:c.job.d+' '+c.job.st+' · '+c.job.who+' 上门'};
  return {k:'已受理',cls:'p-amber',next:'待派工'}; }
/* 响应时长：★报修时间允许"未知"，空着就显示【未知】，绝不拿建单时间顶替
   （顶替的话响应时长永远是 0，报表好看但是假的 —— 契约里写死的口径） */
function mtResp(c){ if(!c.rep||!c.rep.at) return {h:null,txt:'【未知】客户没说清什么时候报的'};
  const base=c.job?dOf(c.job.d+' '+c.job.st):new Date();
  const h=Math.round((base-dOf(c.rep.at))/36e5*10)/10;
  return {h,txt:h+' 小时',over:h>mtSet.slaH}; }
/* ⚠ c.site 是财务侧的「在场小时数」（数字），现场三样齐记录另存 c.siteRec —— 别混 */
const mtSite=c=>c.siteRec||{};
const mtThree=c=>{const t=mtSite(c); return {cause:!!t.cause,sum:!!t.summary,sign:!!t.signBy,
  ok:!!(t.cause&&t.summary&&t.signBy)};};
const mtList=()=>MCASES.filter(c=>c.st!=='已作废');
const mtOpen=()=>MCASES.filter(c=>!['已结案','已作废'].includes(c.st));
/* 运维卡点（现算派生，不写死）——同工程 engStuckRows 的做法 */
function mtStuckRows(){ const out=[];
  MCASES.filter(c=>mtStage(c).k==='已受理').forEach(c=>{const r=mtResp(c);
    out.push({pj:c.code,what:'维护单 '+c.id+' 已受理未派工',
      why:'响应'+(r.h==null?'时长未知（客户没说何时报的）':'已 '+r.h+' 小时，SLA '+mtSet.slaH+' 小时'),
      h:r.h||0,p:'运维派工状态'});});
  MCASES.filter(c=>mtStage(c).k==='上门完 · 三样不齐').forEach(c=>{const t=mtThree(c);
    out.push({pj:c.code,what:'维护单 '+c.id+' 三样不齐',
      why:'缺'+[!t.cause&&'归因',!t.sum&&'服务内容',!t.sign&&'客户签字'].filter(Boolean).join('、')+
        ' —— 财务定不了价，这单卡在这儿',h:26,p:'运维派工状态'});});
  Object.keys(MTWAR).forEach(code=>{const w=warOf(code);
    if(w.fLeft>=0&&w.fLeft<=mtSet.freeRemindDays)
      out.push({pj:code,what:'免责维保还剩 '+w.fLeft+' 天',
        why:'到期后同类故障就要收客户钱了 —— 提前告知业主，顺势谈订阅',h:0,p:'维保状态'});});
  SUBS.forEach(x=>{const st=subState(x);
    if(st.k==='已逾期') out.push({pj:x.code,what:'订阅已逾期 '+(-st.left)+' 天',
      why:'服务还在给但钱没续 —— 要么催续费，要么停订阅服务',h:-st.left*24,p:'业主订阅'});
    else if(st.k==='即将到期') out.push({pj:x.code,what:'订阅 '+st.left+' 天后到期',
      why:'自动续费'+(x.auto?'开着，到期自动生成待开票':'关着，不续就断')+' —— 先跟业主确认',h:0,p:'业主订阅'});});
  return out.sort((a,b)=>(b.h||0)-(a.h||0)); }

function schRemainFor(type,pj){
  if(type==='倒休') return {show:false};
  if(type==='Site Meeting') return {show:true,txt:'（SM 阶段不存在剩余工作）',muted:true};
  if(!pj) return {show:true,txt:'（先选关联项目，系统自动带出上次剩余）',muted:true,nopj:true};
  const rs=SCH_REPORTS[pj]||[];
  if(type==='维护'){
    const mt=rs.filter(r=>r.kind==='维护');
    if(!mt.length) return {show:true,txt:'无（该项目第一次维护）',muted:true,optional:true};
    const last=mt[0];
    if(!('remain' in last)) return {show:true,txt:'⚠ 上一次维护（'+last.who+' '+last.d+'）没有留下剩余工作记录',
      muted:true,optional:true,gap:true,from:last.who+' '+last.d};
    return {show:true,txt:last.remain||'无（上次已做完）',from:last.who+' '+last.d,optional:true};
  }
  const last=rs.find(r=>r.kind==='安装'||r.kind==='交付');
  if(!last) return {show:true,txt:'无（该项目还没有施工上报——第一次进场）',muted:true};
  return {show:true,txt:last.remain||'无（上次已做完）',from:last.who+' '+last.d};
}

/* 通用环形图：写不下的文字走悬停（SVG <title>），旁边配图例 */
function donut(data,size,centerTop,centerSub){
  const tot=data.reduce((a,d)=>a+d.val,0);
  const cx=size/2, cy=size/2, r=size/2-4, ri=r*0.58;
  if(!tot) return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#e6ebf1"/>
    <circle cx="${cx}" cy="${cy}" r="${ri}" fill="var(--bg-panel)"/>
    <text x="${cx}" y="${cy+4}" font-size="12" text-anchor="middle" fill="#8a97a3">暂无数据</text></svg>`;
  let acc=0;
  const arc=data.filter(d=>d.val>0).map(d=>{
    const a0=acc/tot*2*Math.PI-Math.PI/2; acc+=d.val; const a1=acc/tot*2*Math.PI-Math.PI/2;
    const pct=Math.round(d.val/tot*1000)/10;
    const tip=`${d.label}：${d.txt||d.val}（${pct}%）`;
    if(d.val===tot) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}"><title>${tip}</title></circle>`;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
      fill="${d.color}" stroke="#fff" stroke-width="2"><title>${tip}</title></path>`;}).join('');
  return `<svg width="${size}" height="${size}" style="flex:none">${arc}
    <circle cx="${cx}" cy="${cy}" r="${ri}" fill="var(--bg-panel)"/>
    <text x="${cx}" y="${cy-1}" font-size="20" font-weight="700" text-anchor="middle" fill="#1a2633" font-family="var(--mono)">${centerTop}</text>
    <text x="${cx}" y="${cy+16}" font-size="10.5" text-anchor="middle" fill="#5f6b76">${centerSub}</text></svg>`; }
function donutLegend(data,tot){ return `<table style="flex:1">${data.map(d=>`
  <tr><td style="white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;
      background:${d.color};margin-right:6px;vertical-align:-1px"></span>${d.label}</td>
    <td class="num">${d.txt||d.val}</td>
    <td class="num hint">${tot?Math.round(d.val/tot*1000)/10:0}%</td></tr>`).join('')}</table>`; }
function hourBand(pct){
  const w=engSet.hourWarnPct||90;
  if(pct==null) return {k:'未填预计',cls:'p-grey',c:'#94a3b8'};
  if(pct>100)   return {k:'已超支 · 亏损',cls:'p-red',c:'#dc2626'};
  if(pct>=w)    return {k:'接近超支 · 预警',cls:'p-amber',c:'#b45309'};
  if(pct>=70)   return {k:'正常',cls:'p-cyan',c:'#2563eb'};
  return {k:'充裕',cls:'p-green',c:'#047857'};
}

/* ── 状态勾点选与反选（用户定：支持人为点错回退；改后停留清零重新计时提醒） ── */
function preTick(code,i){
  const p=BIGPD.find(x=>x.code===code); if(!p) return;
  const s0=p.step;
  if(p.lost){ uiAlert('该项目已勾「已流失」（终态）——先点第⑦勾取消流失，才能改前六步'); return; }
  const target=i+1;
  if(target===p.step){                       // 点当前勾 = 反选回退一步
    if(p.step===1){ uiAlert('「接洽中」是立项后的起始状态，不能取消'); return; }
    if(p.step===6) uiAlert('已撤回「已签约」（演示）——正式系统会通知财务并留痕');
    p.step=p.step-1;
  }else{
    p.step=target;                            // 前进，或直接点回更早的勾
    if(target===6) uiAlert('已勾「已签约」→ 自动通知财务开 S1 定金 Invoice（演示）');
  }
  p.d=(p.d||[]).slice(0,p.step);
  for(let k=0;k<p.step;k++) if(!p.d[k]||p.d[k]==='··') p.d[k]='今天';
  p.d[p.step-1]=p.d[p.step-1]||'今天';
  p.stay=(p.step>=6)?'':0;                    // 终态不计停留；其余从 0 重新计时→提醒重算
  todoWake(code);                             // 状态改变：该项目「已知悉/搁置」失效，通知重新启动
  if(p.step!==s0) opLog(code, p.step>s0?'勾状态推进':'勾状态回退',
    STAGES[s0-1]+' → '+STAGES[p.step-1], p.step>=6?['presales','fin']:['presales']);
  renderAll();
}
function preLost(code){
  const p=BIGPD.find(x=>x.code===code); if(!p) return;
  if(!p.lost&&p.step>=6){ uiAlert('已签约项目不走「流失」——如需作废走财务撤销流程（后续版本）'); return; }
  p.lost=!p.lost;
  if(p.lost){ (p.d=p.d||[])[6]='今天'; p.stay='';
    opLog(code,'勾已流失',STAGES[p.step-1]+' → 已流失（终态归档，整行变灰）',['presales']);
    uiAlert('已勾「已流失」（=流标，终态归档）。点错的话再点一次第⑦勾即可取消'); }
  else{ if(p.d) p.d[6]=undefined; p.stay=0;
    opLog(code,'取消已流失','回到第 '+p.step+' 步「'+STAGES[p.step-1]+'」· 停留从今天重新计时',['presales']);
    uiAlert('已取消「已流失」——项目回到第 '+p.step+' 步，停留从今天重新计时'); }
  todoWake(code);                             // 状态改变：该项目「已知悉/搁置」失效，通知重新启动
  renderAll();
}

'eng/交付':()=>{
 schSeed();
 const rows=delivList();
 const ready=rows.filter(p=>delivReady(p));
 const wait=rows.filter(p=>!delivReady(p));
 const doneCnt=Object.keys(DELIV).filter(k=>DELIV[k].delivered).length;
 return `<h2>交付 <span class="pill p-cyan">施工结束 + S4 结清 = 待交付</span></h2>
 <div class="page-sub">约客户 → 排交付班 → 当天工时进成本 → 签运维条款 → 确认交付（利润率定格）· 说明看左下「帮助」</div>
 ${ops([
  ['发交付预约通知','选客户方联系人（售前采集）· 短信 / 邮件 / 两者 · 内容可临时改','留痕并记「已联系」· 客户回不回都不挡进度'],
  ['交付排班','日期 + 起止（15 分钟档）+ 指派谁去交付','写进派工排班表 + App 日程；当天人工自动进项目成本'],
  ['确认运维条款已签署','工程管理勾选置位 · 留痕（谁/何时）','通知运维：接管与订阅可启动'],
  ['确认交付完成','门禁：运维条款未签 / 当天实际工时未回，都不让确认','工程利润率交付当天定格 · 项目转「项目交付」· 通知运维与财务'],
 ])}
 ${helpNote(`<b>这页怎么用</b>：待交付＝<b>两条同时满足</b>——①施工部分已结束（安装项清零/工程确认完工）
   ②<b>S4 尾款已结清</b>（收款线现算，钱没到位只出现在「等 S4 结清」区，不能约交付）。
   一行走完四步：<b>约客户</b>（发通知）→ <b>排交付班</b>（进排班表）→ 交付当天 <b>工时对比</b>（超标标红）→
   <b>签运维条款</b> → <b>确认交付</b>（利润率定格、移交运维）。`)}
 ${helpNote(`<b>工时对比</b>：标准交付工时＝设置里「合理时长参考 · 交付」× 指派人数；
   实际工时来自当天 App 打卡/每日上报。<b>实际 > 标准</b> 就标红——交付超时多半是遗留问题没清干净，
   属于我们的效率问题（不挂客户，吃工程利润率，口径同 §7.3）。`)}
 ${helpNote(`<b>交付好不好，系统不判断</b>（"干得够不够好"没法写成规则）——但<b>谁、何时、看着哪版数据点的确认必须留痕</b>；
   确认那一刻工程利润率<b>定格</b>（此后只读），运维接管与免责维保起算。<b>运维条款没签不让确认交付</b>：
   否则运维接管和订阅收费都没有依据。`)}
 <div class="cards">

    <div class="card-value">${ready.length}</div>
    <div class="card-foot">施工已结束 + S4 已结清</div></div>
  <div class="card"><div class="card-label">等 S4 结清</div>
    <div class="card-value"${wait.length?' style="color:var(--warning)"':''}>${wait.length}</div>
    <div class="card-foot">${wait.length?wait.map(p=>p.nick).join('、')+'：钱没到位不能约交付':'没有卡在钱上的'}</div></div>
  <div class="card"><div class="card-label">已约未交付</div>
    <div class="card-value">${rows.filter(p=>DELIV[p.code].sched).length}</div>
    <div class="card-foot">已排交付班，等当天完成确认</div></div>
  <div class="card"><div class="card-label">本季已交付</div>
    <div class="card-value">${doneCnt}</div>
    <div class="card-foot">已定格利润率 · 已移交运维</div></div>
 </div>
 <div class="panel">
  <div class="panel-head">待交付项目
    <span class="muted" style="font-weight:400">四步：约客户 → 排班 → 工时对比 → 签条款 + 确认交付</span></div>
  <div style="overflow-x:auto"><table id="delivtbl" style="min-width:1240px">
   <thead><tr><th>编号</th><th>立项时间</th><th>项目 · 地址</th><th>前置条件</th>
     <th style="min-width:190px">客户联络</th><th style="min-width:170px">交付排班</th>
     <th style="min-width:150px">工时对比</th><th>运维条款</th><th></th></tr></thead>
   <tbody>${rows.map(p=>{const d=DELIV[p.code]; const f=finOf(p.code); const s4=f?f.ms[3]:null;
     const rdy=delivReady(p); const h=delivHours(p.code); const ppl=delivPeople(p.code);
     const to=ppl[d.contactIdx]||ppl[0];
     const over=h.actual&&h.std&&h.actual>h.std;
     return `<tr${rdy?'':' style="opacity:.62"'}>
      <td class="mono">${p.code}</td><td class="mono" style="font-size:11px">${p.opened}</td>
      <td><b>${p.nick}</b><div class="hint">📍 ${p.street}, ${p.suburb} ${p.state}</div></td>
      <td><div><span class="pill ${d.done?'p-green':'p-grey'}">${d.done?'✓ 施工已结束':'施工未完'}</span></div>
        <div style="margin-top:3px"><span class="pill ${rdy?'p-green':'p-red'}">${
          rdy?'✓ S4 已结清':'S4 未结清 —— 钱没到位不能约交付'}</span></div></td>
      <td>${d.contacted
        ? `<span class="pill p-green">已联系</span><div class="hint">${d.contactCh||'短信'} → ${to.name}<br>${d.contactAt}${d.contactBy?' · '+d.contactBy:''}</div>`
        : `<span class="pill p-amber">未联系</span><div class="hint">联系人：${to.name}${to.phone&&to.phone!=='—'?'（'+to.phone+'）':''}</div>`}
        <button class="btn" style="padding:2px 8px;font-size:11px;margin-top:4px"${rdy?'':' title="S4 未结清，先别约客户"'}
          onclick="delivNotifyOpen('${p.code}')">${d.contacted?'再发通知':'发交付预约'}</button></td>
      <td>${d.sched?`<span class="pill p-cyan">已排</span><div class="hint mono">${d.sched}</div>
          <div class="hint">${(d.schedWho||[]).join('、')}</div>`:'<span class="pill p-grey">未排期</span>'}
        <button class="btn" style="padding:2px 8px;font-size:11px;margin-top:4px" onclick="delivSchedOpen('${p.code}')">${d.sched?'改排班':'排交付班'}</button></td>
      <td>${h.actual
        ? `<b class="mono"${over?' style="color:var(--breach)"':''}>${h.actual} h</b> / 标准 ${h.std} h
           <div class="hint"${over?' style="color:var(--breach)"':''}>${over?`超标 ${Math.round((h.actual-h.std)*10)/10} h（${h.pct}%）`:`占标准 ${h.pct}%`}</div>
           <div class="hint">当天人工已进项目成本</div>`
        : `<span class="hint">标准 ${h.std} h${h.planned?` · 已排 ${h.planned} h`:''}</span>
           <div class="hint">实际工时等当天 App 打卡</div>`}</td>
      <td>${d.mtSigned

        : `<span class="pill p-amber">未签署</span>
           <div><button class="btn" style="padding:2px 8px;font-size:11px;margin-top:4px" onclick="delivMtSign('${p.code}')">确认已签署</button></div>`}</td>
      <td><button class="btn btn-primary"${(d.mtSigned&&d.actual)?'':' title="运维条款未签 或 当天实际工时未回 —— 先补齐"'}
        onclick="delivDone('${p.code}')">确认交付</button></td>
     </tr>`;}).join('')||`<tr><td colspan="9" class="muted" style="padding:var(--sp-4)">此刻没有待交付项目</td></tr>`}</tbody></table></div>
  <div class="panel-body hint">灰行＝前置条件没齐（施工没完或 S4 没结清）——可以先联系客户探口风，但不建议排期；
   「确认交付」是人肉判断，系统只保证：条款签了、工时回来了、点的人和时间留痕了</div>
 </div>`;
},

'eng/出货单':()=>{

  <span class="muted">· 提的入口在「派工排班」浮窗里</span></div>
${ops([
 ['问采购要交期','只有缺货的单能填 · 必填 ≥4 字','库管和现场同时看得到 —— 不填，工地天天来问'],

${helpNote(`<b>三种提料</b>：<br>

  ③<b>运维出库</b> —— 排维护任务时填「这次要带什么」。换件成本按<b>维护单</b>归集。`)}
${helpNote(`<b>缺货了怎么办</b>：库管核对完发现库里不够，<b>采购和工程会同时收到提醒</b>。

/* ───────── 售前 · 项目状态表（十一轮定：比例扇形 + 立项去向柱 + 状态过滤同款大表） ───────── */
'presales/项目状态表':()=>{
 /* 状态过滤出的行 —— 表格与「项目列表」完全同款（preBigTable），勾/修改/注释全可操作 */
 const idx=STAGES.indexOf(stFilter);
 const stRows=BIGPD.filter(p=> stFilter==='全部'?true
   : stFilter==='已流失'?p.lost
   : stFilter==='已签约'?(!p.lost&&p.step>=6)
   : (!p.lost&&!(p.step>=6)&&p.step===idx+1));
 /* 扇形：在途项目（非签约非流标）按状态占比 · 有序阶段=同蓝系浅→深 + 逐片直标 + 旁表兜底 */
 const active=BIGPD.filter(p=>!p.lost&&p.step<6);
 const PIE=['#7fb0f6','#5b93f2','#3a76e8','#2a5cc4','#1f4497'];
 const counts=[1,2,3,4,5].map(s=>active.filter(p=>p.step===s).length);
 const total=counts.reduce((a,b)=>a+b,0);
 let acc=0;
 const slices=total?counts.map((n,i)=>{
   if(!n) return '';
   const a0=acc/total*2*Math.PI-Math.PI/2; acc+=n;
   const a1=acc/total*2*Math.PI-Math.PI/2;
   const r=70,cx=92,cy=92,large=(a1-a0)>Math.PI?1:0;
   if(n===total) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE[i]}" stroke="#fff" stroke-width="2"><title>${STAGES[i]} ${n} 个 · 100%</title></circle>`;
   const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   const mid=(a0+a1)/2,lx=cx+(r+13)*Math.cos(mid),ly=cy+(r+13)*Math.sin(mid);
   return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
      fill="${PIE[i]}" stroke="#fff" stroke-width="2"><title>${STAGES[i]} ${n} 个 · ${Math.round(n/total*100)}%</title></path>
    <text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="10" fill="#1f2933"
      text-anchor="${Math.cos(mid)>=0?'start':'end'}">${STAGES[i]} ${Math.round(n/total*100)}%</text>`;
 }).join(''):'';
 /* 柱状：所选时段内「立项」的项目按当前状态拆三段 —— 按立项日期取窗口，现算不落库 */
 const cohort=cohortAll();
 const PRE_STATS={week:{label:'周',full:'过去一周',days:7},
   month:{label:'月',full:'过去 1 个月',days:30},
   quarter:{label:'季',full:'过去 1 季度',days:91},
   year:{label:'年',full:'过去 1 年',days:365}};
 const st0=PRE_STATS[statPeriod];
 const _now=new Date(), since=new Date(_now.getTime()-st0.days*86400000);
 since.setHours(0,0,0,0);
 const win=cohort.filter(c=>c.opened&&new Date(c.opened)>=since);
 const st={label:st0.label,full:st0.full,opened:win.length,
   signed:win.filter(c=>c.out==='s').length,lost:win.filter(c=>c.out==='l').length};
 const pend=Math.max(0,st.opened-st.signed-st.lost);
 const H=170,W=64,bx=58,base=196,hOf=n=>st.opened?Math.round(n/st.opened*H):0;
 const hS=hOf(st.signed),hL=hOf(st.lost),hP=H-hS-hL;
 const seg=(y,h,c,label,n)=>h<=0?'':`<rect x="${bx}" y="${y}" width="${W}" height="${Math.max(h-2,1)}" fill="${c}" rx="3"><title>${label} ${n} 个</title></rect>
   <text x="${bx+W+10}" y="${y+h/2+4}" font-size="11" fill="#1f2933">${label} ${n}</text>`;
 const bar=seg(base-hS,hS,'#047857','已签约',st.signed)
   +seg(base-hS-hL,hL,'#dc2626','已流标',st.lost)
   +seg(base-H,hP,'#2563eb','待签约(在途)',pend);
 /* 近 12 个月（含当月）：逐月由 opened + 当前状态现算 —— 改勾/新立项即时回填到对应月柱 */
 const M12=[...Array(12)].map((_,i)=>{const d=new Date(_now.getFullYear(),_now.getMonth()-11+i,1);
   return String(d.getFullYear()).slice(2)+'-'+String(d.getMonth()+1).padStart(2,'0');});
 const MONTHS=M12.map(m=>{const rows=cohort.filter(c=>ymOf(c.opened)===m);
   return {m,o:rows.length,s:rows.filter(c=>c.out==='s').length,
     l:rows.filter(c=>c.out==='l').length};});
 const mMax=Math.max(1,...MONTHS.map(x=>x.o)), mH=150, mBase=180, mW=24, mPitch=45, mX0=34;
 const mh=n=>n?Math.max(Math.round(n/mMax*mH),3):0;
 const mbars=MONTHS.map((x,i)=>{
   const p=x.o-x.s-x.l, bx2=mX0+i*mPitch;
   let y=mBase, out='';
   const one=(n,c,label)=>{ if(!n) return; const h=mh(n); y-=h;
     out+=`<rect x="${bx2}" y="${y}" width="${mW}" height="${Math.max(h-2,1)}" fill="${c}" rx="2"><title>${x.m} ${label} ${n} 个</title></rect>`; };
   one(x.s,'#047857','已签约'); one(x.l,'#dc2626','已流标'); one(p,'#2563eb','待签约(在途)');
   out+=`<text x="${bx2+mW/2}" y="${y-5}" font-size="10" text-anchor="middle" fill="#1f2933">${x.o}</text>`;
   out+=`<text x="${bx2+mW/2}" y="${mBase+14}" font-size="9" text-anchor="middle"
     fill="${i===MONTHS.length-1?'#1f2933':'#8b98a5'}"${i===MONTHS.length-1?' font-weight="700"':''}>${x.m}</text>`;
   return out;
 }).join('');
 return `<h2>项目状态表</h2>
 <div class="page-sub">上半看全局：比例与立项去向 · 下半按状态过滤，表格与「项目列表」同款可操作 · 说明看左下「帮助」</div>
 ${ops([
  ['按状态过滤（全部 + 6+1）','—','下表与「项目列表」完全同款：勾可点选/反选、修改抽屉、注释大框都能用'],
  ['切换时间范围（周/月/季/年 方块）','—','按立项日期取窗口，去向柱立即重算'],
 ])}
 ${helpNote(`扇形图 = <b>在途</b>项目（不含已签约/已流失）里每个状态的占比 —— 有序阶段用同一蓝色由浅到深，
   每片直接标注名称与百分比，右侧表格给出数量兜底。`)}
 ${helpNote(`柱状图 = 所选时段内<b>立项项目的去向</b>：一根柱子分三段 ——
   <span style="color:#047857"><b>绿=已签约</b></span> ·
   <span style="color:#dc2626"><b>红=已流标</b></span> ·
   <span style="color:#2563eb"><b>蓝=还在途（待签约）</b></span>；时间范围点「周/月/季/年」方块切换。`)}
 ${helpNote(`<b>「每月立项项目成交图」</b>（三段柱）= 这个月立的项目后来签了/流了/还在途几个：
   <b>柱顶数字 = 当月新立项总数</b>（没有就是 0）→ 看增长；三段颜色 → 看转化。
   去向永远回填到<b>立项月份</b>的柱上：26-05 立的项哪怕 9 月才流失，红段也记在 26-05 那根柱 ——
   不是积累量、不重复计数。`)}
 ${helpNote(`图表联动：本页所有图都由项目数据<b>现算</b>（立项日期 + 当前状态，跟正式系统同口径）——
   改 6+1 的勾，成交图在该项目<b>立项月份</b>的柱上换色，不动别的月；
   立项引导建新档，成交图<b>当月</b>柱 +1；扇形与上方去向柱一并同步。`)}
 <div class="split">
  <div class="panel"><div class="panel-head">在途项目 · 状态比例
     <span class="muted" style="font-weight:400">不含已签约/已流失 · 共 ${total} 个</span></div>
   <div class="panel-body" style="display:flex;gap:var(--sp-4);align-items:center">
    <svg width="300" height="186" viewBox="-56 0 300 186" role="img" aria-label="在途项目状态比例扇形图">
      ${slices||'<text x="70" y="96" font-size="12" fill="#5f6b76">暂无在途项目</text>'}</svg>
    <table style="flex:1">${STAGES.slice(0,5).map((s,i)=>`
      <tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${PIE[i]};margin-right:6px;vertical-align:-1px"></span>${s}</td>
      <td class="num">${counts[i]} 个</td>
      <td class="num muted">${total?Math.round(counts[i]/total*100):0}%</td></tr>`).join('')}</table>
   </div></div>
  <div class="panel"><div class="panel-head">立项与去向
     <span style="margin-left:auto;display:flex;gap:6px">${Object.entries(PRE_STATS).map(([k,v])=>
       `<button class="btn${statPeriod===k?' btn-primary':''}" onclick="statPeriod='${k}';renderAll()">${v.label}</button>`).join('')}</span></div>
   <div class="panel-body" style="display:flex;gap:var(--sp-4)">
    <svg width="250" height="226" viewBox="0 0 250 226" role="img" aria-label="立项去向堆叠柱状图">
      <line x1="40" y1="196" x2="240" y2="196" stroke="#d8e0e8"/>
      ${bar}
      <text x="${bx+W/2}" y="214" font-size="11" text-anchor="middle" fill="#5f6b76">${st.full} · 立项 ${st.opened} 个</text>
    </svg>
    <div class="hint" style="align-self:center;line-height:2">一根柱子看去向：<br>
      <b style="color:#047857">绿 = 已签约</b><br><b style="color:#dc2626">红 = 已流标</b><br>
      <b style="color:#2563eb">蓝 = 还在途（待签约）</b><br>时间范围点上面的方块</div>
   </div></div>
 </div>
 <div class="panel">
  <div class="panel-head">近 12 个月 · <b>每月立项项目成交图</b>
    <span class="muted" style="font-weight:400">柱顶数字 = 当月新立项数 · 去向回填到立项月份的柱上，不重复计数</span>
    <span style="margin-left:auto;font-size:var(--fs-xs);display:flex;gap:12px">
      <span><i style="display:inline-block;width:9px;height:9px;background:#047857;border-radius:2px;margin-right:4px"></i>已签约</span>
      <span><i style="display:inline-block;width:9px;height:9px;background:#dc2626;border-radius:2px;margin-right:4px"></i>已流标</span>
      <span><i style="display:inline-block;width:9px;height:9px;background:#2563eb;border-radius:2px;margin-right:4px"></i>待签约(在途)</span>
    </span></div>
  <div class="panel-body" style="overflow-x:auto">
   <svg width="600" height="204" viewBox="0 0 600 204" role="img" aria-label="近12个月每月立项项目成交堆叠柱状图">
     <line x1="20" y1="180" x2="590" y2="180" stroke="#d8e0e8"/>
     <line x1="20" y1="105" x2="590" y2="105" stroke="#eef2f6"/>
     <line x1="20" y1="30" x2="590" y2="30" stroke="#eef2f6"/>
     ${mbars}
   </svg>
  </div>
 </div>
 <div style="display:flex;gap:var(--sp-2);margin:var(--sp-3) 0;flex-wrap:wrap">
   ${['全部',...STAGES].map(s=>`<button class="btn${stFilter===s?' btn-primary':''}"
      onclick="stFilter='${s}';${s==='全部'?"bigQ='';":''}renderAll()">${s}</button>`).join('')}
   <span class="muted" style="font-size:var(--fs-xs);align-self:center">显示 ${stRows.length} / ${BIGPD.length}</span>
 </div>
 ${preBigTable(stRows)}`;
},

/* ───────── 售前 · 设置（用户定：提醒阈值由售前自行定义） ───────── */

${ops([
 ['修改提醒阈值（天）','只有售前（和管理员）能改 —— 与加班倍数归财务同一套按键权限机制','改完即刻生效：大表「停留」列的橙色线、每天提醒的起点都跟着变'],
 ['维护下拉选项（角色/工种）','只有售前能改 · 删除选项不影响已填过它的历史数据','大表与立项引导的下拉立即启用新列表'],

</div>

'eng/项目列表':()=>{
 const q=engPjQ.trim().toLowerCase();
 const all=engScope();
 const rows=all.filter(p=>{const st=engStage(p);
   return (engPjF==='全部'||st.k===engPjF)
     &&(!q||`${p.code} ${p.nick} ${p.street} ${p.suburb} ${p.state}`.toLowerCase().includes(q));});
 const cnt=k=>k==='全部'?all.length:all.filter(p=>engStage(p).k===k).length;
 return `<h2>项目列表 <span class="pill p-cyan">工程视角 · 只看进了工程线的项目</span></h2>
 <div class="page-sub">按<b>工程阶段</b>分类（不是收款阶段）· 金额一律不显示（工程不看钱）· 说明看左下「帮助」</div>
 ${ops([
  ['按阶段筛选','六态：全部 / Site Meeting 阶段 / 施工中 / 项目交付 / 项目维护 / 已停服','—'],
  ['指定负责人（业主 / Builder / 电工）','候选＝售前采集的联系人与参建方 · 工程负责人拍板','保存即定为项目标注（全公司可见）· 通知财务（付款人候选）与库管（提货人）· 留痕'],
  ['进入 →','带着项目上下文跳到 Site Meeting','—'],
 ])}
 ${helpNote(`<b>这页怎么用</b>：这张表只收<b>进了工程线</b>的项目——售前还在接洽、或已流失的根本不进来。
   「工程进度」列直接写明当前处于哪个阶段：<b>Site Meeting 阶段</b>（SM 还没走完，带下一场是第几场、排没排期）·
   <b>施工中</b>（SM1~4 已过，安装调试）· <b>项目交付</b> · <b>项目维护</b> · <b>已停服</b>。`)}
 ${helpNote(`<b>已停服</b>取代了原来的「已流失 / 已烂尾」：项目做到一半款项不到位，<b>由财务端确认后触发停服</b>
   （财务「催账和停服」页标记拒付）——工程这边看到的就是「已停服」，该项目任何新任务派不出。
   售前的「已流失」是没签约的结论，跟工程无关，不进这张表。`)}
 ${helpNote(`<b>金额在这页一律不显示</b>（合同额、已收、利润率都不出现）——工程看的是进度和人，钱在财务页。
   「业主 / Builder / 电工」由<b>工程负责人指定</b>：候选来自售前采集，点「指定」下拉选定保存，
   之后作为📌标注固定在项目列表并同步下游（财务的付款人候选、库管的提货人都用它）。`)}
 <div class="panel">
  <div class="panel-head" style="gap:var(--sp-2);flex-wrap:wrap">
   ${ENG_PJ_STATUSES.map(s=>`<button class="btn${engPjF===s?' btn-primary':''}"
     onclick="engPjF='${s}';engPjQ='';renderAll()">${s}<span class="muted" style="font-weight:400"> ${cnt(s)}</span></button>`).join('')}
   <span class="muted" style="font-weight:400">显示 ${rows.length} / ${all.length}</span>
   <input id="epq" class="search" placeholder="🔍 搜编号 / 昵称 / 地址…" value="${engPjQ}"
     style="width:190px;margin-left:auto;padding:5px var(--sp-2)" oninput="engPjQ=this.value;keepFocus('epq')"></div>
  <table id="engpj">
   <thead><tr><th>编号</th><th>立项时间</th><th>项目 · 地址</th><th>工程进度（当前阶段）</th>
     <th style="text-align:right">停留</th><th>业主 / Builder / 电工</th><th></th></tr></thead>
   <tbody>${rows.map(p=>{
     const i=PROJECTS.indexOf(p); const st=engStage(p); const L=engLead(p.code);
     const since=ENG_SINCE[p.code]||p.opened; const days=daysSince(since);
     const lim=p.status==='项目维护中'?engSet.maintStallDays:(p.status==='施工中'?engSet.buildStallDays:null);
     const over=lim!=null&&days>lim;
     const pool=ENG_PARTY_POOL[p.code]||{owners:[],builders:[],elecs:[]};
     const sel=(id,opts,cur)=>`<select id="${id}" style="width:100%;font-size:11px;padding:2px 4px">
       ${[...new Set([cur,...opts])].filter(Boolean).map(o=>`<option${o===cur?' selected':''}>${o}</option>`).join('')}</select>`;
     return `<tr>
      <td class="mono">${p.code}</td><td class="mono" style="font-size:11px">${p.opened}</td>
      <td><b>${p.nick}</b><div class="hint">📍 ${p.street}, ${p.suburb} ${p.state}</div></td>
      <td><span class="pill ${st.cls}">${st.k}</span><div class="hint">${st.d}</div></td>
      <td class="num">${over?`<b style="color:var(--breach)">${days} 天 · 超 ${days-lim}</b>`:days+' 天'}</td>
      <td>${L.fixed?'📌 ':''}${L.owner}<div class="hint">B: ${L.builder}<br>E: ${L.elec}</div>
        ${L.fixed?`<div class="hint">工程指定 · ${L.by} ${L.at}</div>`:'<div class="hint" style="color:var(--warning)">未指定（用售前采集值）</div>'}
        <button class="btn" style="padding:2px 8px;font-size:11px;margin-top:4px" onclick="engLeadToggle('${p.code}')">${engLeadOpen===p.code?'收起':'指定'}</button></td>
      <td><button class="btn" onclick="pickPj(${i});go('eng','Site Meeting')">进入 →</button></td></tr>
     ${engLeadOpen===p.code?`<tr><td colspan="7" style="background:var(--bg-elevated);padding:10px 14px">
       <div style="font-weight:600;margin-bottom:6px">指定项目负责人 · ${p.nick}
         <span class="muted" style="font-weight:400">候选＝售前采集的联系人与参建方（同财务付款人机制）</span></div>
       <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:820px">
         <div><div class="hint">业主（决策人）</div>${sel('el-o-'+p.code,pool.owners,L.owner)}</div>
         <div><div class="hint">Builder</div>${sel('el-b-'+p.code,pool.builders,L.builder)}</div>
         <div><div class="hint">电工</div>${sel('el-e-'+p.code,pool.elecs,L.elec)}</div>
       </div>
       <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
         <button class="btn btn-primary" onclick="engLeadSave('${p.code}')">保存并定为标注</button>
         <span class="hint">保存后固定显示在本表并同步下游（财务付款人候选 · 库管提货人）· 改动留痕</span></div>
       </td></tr>`:''}`;}).join('')||`<tr><td colspan="7" class="muted" style="padding:var(--sp-4)">「${engPjF}」阶段下暂无项目</td></tr>`}</tbody></table>
 </div>`;
},

 <div class="panel-body hint">状态<b>只能往前推</b>，每一步都要填凭据 —— 口头的"对方说收到了"三个月后翻不出来。

 <div class="panel-body hint">换回来的件入库之后，这次维护用掉的那件就<b>不用公司再自己掏钱补</b> ——

'proc/设置':()=>`
<h2>采购设置</h2>
<div class="page-sub">阈值与下拉都可改 · 改完立即生效 · 每次改动进操作日志</div>
${ops([
 ['改阈值','只能填正整数（填 0 等于把提醒关掉）','总览卡点立即按新阈值现算'],
 ['增删采购原因','重复拦 · 已被采购单用过的删不掉 · 「其他」不可删','生成采购单时的下拉立即跟着变'],
])}
${helpNote(`<b>这页怎么用</b>：三个阈值——<b>到货预警</b>（还有几天到就提醒你盯着）·
  <b>汇率过期</b>（多少天没更新就提醒，拿旧汇率算成本没人敢信）· <b>需求 SLA</b>（需求提出多久没下单算超时）。
  <b>退换催确认</b>（退换单一个状态停多久没动静就提醒去催——货在海上飘着不催，最后成糊涂账）。
  再加一个「采购原因」下拉——写死的选项永远不够用，但也不能乱加，同一件事永远选同一个原因，统计才对得上。`)}
<div class="split">

  <div class="panel-body">
   <div class="field"><label>到货预警（还剩几天到就提醒）</label>
     <input class="mono" style="width:90px" value="${pcSet.etaWarnDays}" onchange="pcSetVal('etaWarnDays','到货预警天数',this.value)"></div>
   <div class="field"><label>汇率过期提醒（天）</label>
     <input class="mono" style="width:90px" value="${pcSet.fxStaleDays}" onchange="pcSetVal('fxStaleDays','汇率过期天数',this.value)">
     <div class="hint">当前汇率已 ${fxStaleDays()} 天没更新${fxStaleDays()>pcSet.fxStaleDays?'（<b style="color:var(--warning)">已超</b>）':''}</div></div>
   <div class="field"><label>需求 SLA（小时 —— 需求提出多久没下单算超时）</label>
     <input class="mono" style="width:90px" value="${pcSet.reqSlaH}" onchange="pcSetVal('reqSlaH','需求 SLA 小时',this.value)">
     <div class="hint">当前 ${pcReqAll().length} 条待下单</div></div>
   <div class="field"><label>退换催确认（天 —— 一个状态停多久没动静就提醒去催）</label>
     <input class="mono" style="width:90px" value="${pcSet.rmaChaseDays}" onchange="pcSetVal('rmaChaseDays','退换催确认天数',this.value)">
     <div class="hint">当前 ${rmaOpen().filter(rmaDue).length} 单该催了（共 ${rmaOpen().length} 单在跟踪中）</div></div>
  </div></div>
 <div class="panel" style="max-width:520px"><div class="panel-head">采购原因
   <span class="muted" style="font-weight:400">生成采购单时的下拉</span></div>
  <div class="panel-body">
   <table><tbody>${PC_REASON.map((c,i)=>`<tr><td>${c}</td>
     <td style="text-align:right;width:90px">${c==='其他'?'<span class="hint">兜底 · 不可删</span>'
       :`<span class="delx" onclick="pcReasonDel(${i})">✕</span>`}</td></tr>`).join('')}</tbody></table>
   <div style="display:flex;gap:6px;margin-top:var(--sp-3)">
     <input id="pc-reason-new" placeholder="新增原因，如：客户指定品牌 / 替代料测试" style="flex:1">
     <button class="btn btn-primary" onclick="pcReasonAdd()">新增</button></div>
   <div class="hint">三个月后你得说得清当初<b>为什么买</b> —— 原因是采购单的必填项</div>
  </div></div>
</div>
<div class="panel" style="max-width:560px"><div class="panel-head">改动留痕</div>
 <div class="panel-body"><div class="hint">本页所有改动自动写入左栏「操作日志」· 只读不可删。</div>
  <button class="btn" onclick="go('proc','操作日志')">打开操作日志 →</button></div></div>`,
/* 五十七轮用户定：库管这边不是「项目列表」而是「项目出库状态」——
   采购的项目采购状态一到货就是办理入库；项目真正需要的是<b>出库</b>：
   把物料交到<b>指定提货人</b>手里。★物料既跟着项目走，也跟着提货人走。 */
'wh/项目出库状态':()=>{
 /* ★六十七轮重做（用户 2026-08-10）：原来六块表从头堆到尾，同一个项目在好几块里重复出现，
    看起来很乱。改成【点哪个状态就只看哪一类】—— 一次只出一张表，不重复。 */
 const live=PROJECTS.filter(p=>p.status==='施工中');
 const rows=live.map(p=>({p,...whPjOut(p.code)}));
 const tail=PROJECTS.filter(p=>p.status!=='施工中')
   .map(p=>({p,...whPjOut(p.code)})).filter(r=>r.unret>0||r.wait.length);
 const bomOf=p=>bomRows(p.code);
 const T=(rs,k)=>rs.reduce((x,r)=>x+r[k],0);
 const rq=MATREQ.filter(r=>['待库管核对','可出货','缺货待采购'].includes(r.st));
 const pend=callPend();
 const miss=[]; live.forEach(p=>takerList(p.code).forEach(t=>{
   if(t.type==='third'&&!phoneOk(t.phone)) miss.push({p,t}); }));
 const rsvRows=live.map(p=>({p,rs:bomOf(p)})).filter(x=>x.rs.length&&(T(x.rs,'gap')>0||T(x.rs,'rsv')>0));
 const G={
  s2:   rows.filter(r=>r.s2!==true),
  out:  rows.filter(r=>r.s2===true),
  rsv:  rsvRows,
  req:  rq,
  call: pend,
  ack:  rows.concat(tail).filter(r=>r.late.length),
  miss: miss,
  tail: tail,
 };
 const TABS=[
  {k:'s2',  t:'等 S2 物料款',   n:G.s2.length,   bad:G.s2.length>0,       foot:'卡在财务，不在库管'},
  {k:'out', t:'可以出库',       n:G.out.length,  good:true,               foot:'S2 已结清，随时能开单'},
  {k:'rsv', t:'待备料',         n:G.rsv.length,  warn:G.rsv.some(x=>T(x.rs,'gap')>0), foot:'先看现货，别让采购白买'},
  {k:'req', t:'工程提的出货单', n:G.req.length,  warn:G.req.some(r=>r.st==='待库管核对'),
    bad:G.req.some(r=>r.st==='缺货待采购'), foot:'排班时提的 —— 先核对库存'},
  {k:'call',t:'叫了没来提',     n:G.call.length, bad:G.call.some(callLate),foot:'货占着仓位，工地还在等'},
  {k:'ack', t:'提货没回执',     n:G.ack.reduce((x,r)=>x+r.late.length,0), bad:G.ack.length>0,
    foot:'超 '+whSet.ackH+' 小时没回 YES'},
  {k:'miss',t:'提货人缺号码',   n:G.miss.length, bad:G.miss.length>0,     foot:'没号码通知不了也不能出库'},
  {k:'tail',t:'货还没回来',     n:G.tail.length, bad:G.tail.length>0,     foot:'施工期已过，料还在外面'},
 ];
 if(!TABS.some(x=>x.k===whTab)) whTab='s2';
 const cur=TABS.find(x=>x.k===whTab);
 const step=r=>r.s2!==true?['等财务 S2 物料款结清','var(--breach)']
   :(!r.pos.length&&!r.os.length?['等采购下单到货','var(--warning)']
   :(r.late.length?['催提货确认（超 '+whSet.ackH+' 小时没回 YES）','var(--breach)']
   :(!r.os.length?['货已到 · 可以出库','var(--healthy)']
   :(r.unret?['施工中 · 有 '+r.unret+' 件在提货人手里','var(--text-muted)']
   :['出库已完成 · 无未退料','var(--healthy)']))));
 const pjCell=p=>`<td><b class="mono" style="color:var(--accent)">${p.code}</b></td>
   <td><b>${p.nick||p.name}</b><div class="hint">📍 ${p.street}, ${p.suburb} ${p.state}</div></td>`;
 const HEAD=`<tr><th style="width:118px">项目编号</th><th style="width:165px">项目 · 地址</th>`;

 /* ── 每个状态一张表，只出一张 ── */
 const T_s2=()=>`<table><thead>${HEAD}<th style="width:150px">S2 物料款</th>
   <th style="width:130px">采购到货</th><th>为什么出不了库</th><th style="width:96px"></th></tr></thead>
  <tbody>${G.s2.map(r=>`<tr>${pjCell(r.p)}
   <td>${r.s2===false?'<span class="pill p-red">未结清 · 不能出库</span>'
     :'<span class="pill p-grey">财务还没建收款计划</span>'}</td>
   <td class="hint">${r.pos.length?`采购单 ${r.pos.length} 张 · 已到 <b>${r.arrived.length}</b> 张`:'<span class="muted">还没下单</span>'}</td>
   <td class="hint">S2 物料款到账才放货 —— <b>这一步卡在财务，不在库管</b>，别去催工地。
     ${sm2Can(r.p.code)?'<br>★这个项目 SM2 已排期：现场要带线材的话，走<b>出库页的「SM2 预提」</b>':''}</td>
   <td style="text-align:right"><button class="btn" disabled title="S2 物料款没结清，出库门禁不放行">去出库</button></td>
  </tr>`).join('')||`<tr><td colspan="6" class="muted" style="padding:var(--sp-4)">没有卡在 S2 的项目 ✓</td></tr>`}</tbody></table>`;

 const T_out=()=>`<table><thead>${HEAD}<th style="width:120px">S2 物料款</th>
   <th style="width:200px">已出库 · 提货确认</th><th style="width:160px">未退料（在谁手里）</th>
   <th>下一步</th><th style="width:96px"></th></tr></thead>
  <tbody>${G.out.map(r=>{const i=PROJECTS.indexOf(r.p); const st=step(r);
   return `<tr>${pjCell(r.p)}
   <td><span class="pill p-green">已结清</span><div class="hint mono">${r.s2At||''}</div></td>
   <td>${r.os.length?r.os.map(o=>`<div style="margin-bottom:4px"><span class="mono" style="font-size:11px">${o.id}</span>
       ${o.kind==='sm2'?'<span class="pill p-amber">SM2 预提</span>':''}${o.kind==='mt'?'<span class="pill p-amber">运维</span>':''}
       ${o.ack?'<span class="pill p-green">已回 YES</span>'
         :`<span class="pill ${outLate(o)?'p-red':'p-amber'}">待确认 ${outAckH(o)}h</span>`}
       <div class="hint">${o.taker} · ${outQty(o)} 件 · ${o.at}</div></div>`).join('')
       :'<span class="muted">还没出过库</span>'}</td>
   <td>${r.unret?`<b style="color:var(--warning)">${r.unret} 件</b>
       <div class="hint">${can('stock')?A$2(r.unretAmt):'— —'} · 在 <b>${r.holders.join('、')}</b> 手里</div>`
       :(r.os.length?'<span class="pill p-green">已退清</span>':'<span class="muted">—</span>')}</td>
   <td class="hint" style="color:${st[1]}">${st[0]}</td>
   <td style="text-align:right"><button class="btn" onclick="whGoOut(${i})">去出库</button></td>
  </tr>`;}).join('')||`<tr><td colspan="7" class="muted" style="padding:var(--sp-4)">现在没有可以出库的项目</td></tr>`}</tbody></table>
  <div class="panel-body hint">出库单价在<b>出库那一刻定格</b>，之后采购再涨价也不动它 ——
    未退料要按这个价结进 S4，重新询价就成了两笔账。</div>`;

 const T_rsv=()=>`<table><thead>${HEAD}<th style="width:90px;text-align:right">应采</th>
   <th style="width:90px;text-align:right">已下单</th><th style="width:90px;text-align:right">我已备</th>
   <th style="width:90px;text-align:right">还要买</th><th>仓库能顶哪些</th><th style="width:100px"></th></tr></thead>
  <tbody>${G.rsv.map(x=>{const cov=x.rs.filter(r=>r.canCover>0); const nc=callsOf(x.p.code).length;
   return `<tr>${pjCell(x.p)}
   <td class="num">${T(x.rs,'need')}</td><td class="num">${T(x.rs,'ord')}</td>
   <td class="num"${T(x.rs,'rsv')?' style="color:var(--healthy)"':''}>${T(x.rs,'rsv')||'<span class="muted">0</span>'}</td>
   <td class="num"${T(x.rs,'gap')?' style="color:var(--warning);font-weight:600"':''}>${
     T(x.rs,'gap')||'<span class="pill p-green">齐了</span>'}</td>
   <td class="hint">${cov.length?cov.map(r=>`${matOf(r.mat).name} <b style="color:var(--healthy)">可顶 ${r.canCover}</b>
     <span class="muted">（还要 ${r.gap}、库存 ${r.stock}）</span>`).join('<br>')
     :(T(x.rs,'gap')?'<span style="color:var(--warning)">仓库一件都顶不上 —— 全都得买</span>':'—')}</td>
   <td style="text-align:right">${cov.length
     ?`<button class="btn btn-primary" onclick="whRsvOpen('${x.p.code}')">备料</button>`
     :`<button class="btn" disabled title="仓库没有可顶的现货 —— 只能等采购买回来">备料</button>`}
     ${T(x.rs,'rsv')||x.rs.some(r=>r.stock>0)
     ?`<button class="btn" style="margin-top:4px" onclick="whCallOpen('${x.p.code}')">通知提货</button>

'fin/财务节点':()=>{
 const sent=FINPAY.flatMap(f=>f.ms.filter(m=>m.inv&&!m.settled).map(m=>({f,m})));
 const owing=sent.reduce((a,x)=>a+msDue(x.f,x.m)-msPaid(x.m),0);
 const overdue=sent.filter(x=>daysSince(x.m.inv)>finSet.overdueDays)
   .reduce((a,x)=>a+msDue(x.f,x.m)-msPaid(x.m),0);
 const recent=FINPAY.flatMap(f=>f.ms.flatMap(m=>m.recv)).filter(r=>daysSince(r.at)<=30);
 const bank=recent.filter(r=>r.how==='走账').reduce((a,r)=>a+r.amt,0);
 const cash=recent.filter(r=>r.how==='现金').reduce((a,r)=>a+r.amt,0);
 const cats={};
 FINPAY.forEach(f=>{const st=finStage(f);
   const k=!st.m?(f.ms[3].inv?'S4 收款中':'S4 待开票'):st.gate?(st.gate.includes('SM3')?'等 SM3':'等 SM4')
     :st.m.s+(st.m.inv?' 请款中':' 待请款');
   (cats[k]=cats[k]||[]).push({f,label:k});});
 const nodeRows=(nodeF==='全部'?Object.values(cats).flat()
   :(cats[nodeF]||[])).slice();
 const stuck=STUCK['fin']||[];
 return `<h2>财务节点</h2>
 <div class="page-sub">财务整体数据一览 + 此刻卡点与异常 · 真正的账在外部财务系统，这里管流程与信息 · 待办去右上角 🔔</div>
 ${helpNote(`<b>这页怎么用</b>：财务每天的起点——上面的节点分布框是全公司收款走到哪了（点框＝过滤，「全部」还原）；
   下面的卡点表是此刻被门禁卡住的事，每行「去处理 →」直达对应页面并自动只显示该项目，处理完回来数字自己变。`)}
 ${helpNote(`四张卡都是<b>现算</b>：应收未收=所有已请款未结清的差额；超期=最后一版 Invoice 发出超 ${finSet.overdueDays} 天仍未结清；
   近 30 天已收按走账/现金拆开（GST 单列在收款流水里）。节点分布行显示每个在途项目此刻停在哪一步。`)}
 <div class="cards">
  <div class="card"><div class="card-label">应收未收（已请款）</div>
    <div class="card-value">${can('customer')?A$(owing):'— —'}</div>
    <div class="card-foot">其中超期 ${can('customer')?A$(overdue):'— —'}</div></div>
  <div class="card"><div class="card-label">近 30 天已收</div>
    <div class="card-value">${can('customer')?A$(bank+cash):'— —'}</div>
    <div class="card-foot">走账 ${can('customer')?A$(bank):'—'} · 现金 ${can('customer')?A$(cash):'—'}</div></div>
  <div class="card"><div class="card-label">在途收款项目</div>
    <div class="card-value">${FINPAY.filter(f=>finStage(f).m).length} 个</div>
    <div class="card-foot">S1-S3 已清待 S4：${FINPAY.filter(f=>!finStage(f).m).length} 个</div></div>
  <div class="card"><div class="card-label">工资月度封账</div>
    <div class="card-value">21 日</div>
    <div class="card-foot">周期 上月21 → 本月20 · 挂起 ${worklog().filter(w=>w.hang).length} 天工程补录中（不卡封账）</div></div>
 </div>
 <div class="panel"><div class="panel-head">S1~S4 节点分布 <span class="muted" style="font-weight:400">点框框过滤下表 · 每个在途项目此刻停在哪</span>
   <span style="margin-left:auto"><button class="btn" onclick="go('fin','项目收款S1-S3')">收款 S1-S3 →</button>
   <button class="btn" onclick="go('fin','尾款结算S4与Var')">S4 与 Var →</button></span></div>
  <div class="panel-body">
   <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
    <button class="btn${nodeF==='全部'?' btn-primary':''}" style="font-size:var(--fs-sm);padding:6px 12px"
      onclick="nodeF='全部';renderAll()">全部 · <b>${FINPAY.length}</b></button>
    ${Object.entries(cats).map(([k,arr])=>`<button class="btn${nodeF===k?' btn-primary':''}"
      style="font-size:var(--fs-sm);padding:6px 12px${k.includes('等')?';border-color:#f0c36d':''}"
      onclick="nodeF='${k}';renderAll()">${k} · <b>${arr.length}</b></button>`).join('')}
   </div>
   <table id="nodetbl" style="margin-top:var(--sp-3)"><thead><tr><th>项目编号</th><th>立项时间</th><th>项目</th>
     <th>付款人</th><th>当前节点</th><th style="text-align:right">该节点应收</th>
     <th style="text-align:right">已收</th><th></th></tr></thead>
   <tbody>${nodeRows.map(({f,label})=>{const pj=PROJECTS.find(p=>p.code===f.code)||{};
     const st=finStage(f); const m=st.m||f.ms[3];
     const goP=label.includes('S4')?'尾款结算S4与Var':'项目收款S1-S3';
     return `<tr>
      <td><b class="mono">${f.code}</b></td>
      <td class="mono" style="font-size:11px">${OPENED[f.code]||'—'}</td>
      <td><b>${pj.nick||pj.name||''}</b><div class="hint">📍 ${pj.street||''}, ${pj.suburb||''} ${pj.state||''}</div></td>
      <td>${f.payer}<div class="hint mono">${f.payerPh||''}</div></td>
      <td><span class="pill ${label.includes('等')?'p-amber':label.includes('S4')?'p-cyan':label.includes('请款中')?'p-grey':'p-grey'}">${label}</span></td>
      <td class="num">${can('customer')?A$(msDue(f,m)):'— —'}</td>
      <td class="num">${can('customer')?A$(msPaid(m)):'— —'}</td>
      <td><button class="btn" title="跳过去并只显示这个项目" onclick="goPj('fin','${goP}','${f.code}')">去处理 →</button></td></tr>`;}).join('')
     ||`<tr><td colspan="8" class="muted" style="padding:var(--sp-4)">该阶段没有项目</td></tr>`}</tbody></table>
  </div></div>
 <div class="panel">
  <div class="panel-head">卡点与异常 <span class="muted" style="font-weight:400">每条写明卡在哪 · 影响什么 · 去哪处理</span>
    <button class="btn" style="margin-left:auto" onclick="toggleDrawer()">🔔 待办中心 →</button></div>
  <table><thead><tr><th>项目编号</th><th>立项时间</th><th>项目 · 地址</th><th>卡点</th><th>卡在哪 / 影响什么</th>
    <th style="text-align:right">卡了</th><th></th></tr></thead>
  <tbody>${stuck.map(s=>`<tr>
    <td>${s.pj==='?'?'<span class="pill p-red">★ 无从追溯</span>':s.pj?`<b class="mono">${s.pj}</b>`:'<span class="pill p-grey">公司级</span>'}</td>
    <td class="mono" style="font-size:11px">${s.pj&&s.pj!=='?'?(OPENED[s.pj]||'—'):'—'}</td>
    <td>${s.pj&&s.pj!=='?'?`<b>${pjNick(s.pj)}</b><div class="hint">📍 ${pjAddr(s.pj)}</div>`:`<span class="hint">${s.pj==='?'?'需人工确认':'不属于单个项目'}</span>`}</td>
    <td><b>${s.what}</b></td><td class="hint">${s.why}</td>
    <td class="num">${s.h?s.h+'h':'—'}</td>
    <td><button class="btn" title="跳过去并只显示这个项目" onclick="goPj('${s.t||tab}','${s.p}','${s.pj}')">去处理 →</button></td></tr>`).join('')}
  </tbody></table></div>`;
},

'fin/运维财务支持':()=>{
 const inc=MCASES.filter(c=>c.amt>0).reduce((a,c)=>a+(c.amt||0),0);
 const free=MCASES.filter(c=>c.free).length;
 const costT=Math.round(MCASES.reduce((a,c)=>a+mtCost(c),0)*100)/100;
 return `<h2>运维财务支持 <span class="pill p-cyan">只服务已进入维护阶段的项目</span></h2>
 <div class="page-sub">跟着维护团队的信息走：现场归因+时长 → 财务定价 → 外部系统开 Invoice → 这里记收款 · 说明看左下「帮助」</div>
 ${ops([
  ['定价开票','人没去过不许开票 —— 定价依据=工程人员报回的归因+时长；免责期内按归因判免不免','付款人收短信 · 运维收「已开票」'],
  ['登记收款 → 结案','—','单据状态 open → in_progress → invoiced → paid_closed'],
  ['看成本核算','只读现算 —— 人工与物料都不是手填','定价时旁边给成本参考，心里有底不亏着开票'],
 ])}
 ${helpNote(`<b>这页怎么用</b>：运维完成上门后到这页定价——先看现场归因（人为损坏＝计费；缺陷/老化在免责期＝免单）
   和系统算好的成本参考（人工＝工时×成本时薪 · 物料＝维护出库自动归集），填金额「定价开票」；收到钱点「收款结案」；
   免单也照记成本，维保到底贴了多少看得见。`)}
 ${helpNote(`免责维保口径：免责期内 <b>产品缺陷/自然老化 → 全免</b>（成本计入维保成本，产品在保返供应商退换）；

'fin/项目报销':()=>{
 const ok=EXP.filter(e=>e.st==='已批准');
 const byPj={}; ok.filter(e=>e.pj&&e.pj!=='?').forEach(e=>{byPj[e.pj]=(byPj[e.pj]||0)+e.amt;});
 const byCat={}; ok.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amt;});
 const cats=Object.keys(byCat), CPIE=['#7fb0f6','#3a76e8','#2a5cc4','#1f4497'];
 const catT=Object.values(byCat).reduce((a,b)=>a+b,0); let acc=0;
 const slices=cats.map((k,i)=>{const n=byCat[k];
   const a0=acc/catT*2*Math.PI-Math.PI/2; acc+=n; const a1=acc/catT*2*Math.PI-Math.PI/2;
   const r=54,cx=70,cy=70,large=(a1-a0)>Math.PI?1:0;
   if(n===catT) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${CPIE[i%4]}" stroke="#fff" stroke-width="2"><title>${k} ${A$(n)}</title></circle>`;
   const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${CPIE[i%4]}" stroke="#fff" stroke-width="2"><title>${k} ${A$(n)}</title></path>`;}).join('');
 const pjs=Object.keys(byPj), pMax=Math.max(1,...Object.values(byPj));
 const pbars=pjs.map((k,i)=>{const v=byPj[k], H=110, base=126, h=Math.max(Math.round(v/pMax*H),3), x=36+i*112;
   const pct=EXPCOST[k]?(v/EXPCOST[k]*100).toFixed(2):null;
   return `<rect x="${x}" y="${base-h}" width="46" height="${h}" fill="#2563eb" rx="2"><title>${k} 已批报销 ${A$(v)}</title></rect>
     <text x="${x+23}" y="${base-h-16}" font-size="10" text-anchor="middle" fill="#1f2933">${A$(v)}</text>
     <text x="${x+23}" y="${base-h-5}" font-size="9" text-anchor="middle" fill="${pct>1?'#b45309':'#5f6b76'}">${pct?'占成本 '+pct+'%':''}</text>
     <text x="${x+23}" y="${base+13}" font-size="9" text-anchor="middle" fill="#5f6b76">${k.slice(-4)}</text>`;}).join('');
 return `<h2>项目报销 <span class="pill p-cyan">只做上报与审批 · 类别仅：材料补购 · 交通递送 · 工具采购</span></h2>
 <div class="page-sub">记录采购信息与项目的关系 · 已批准自动计入项目成本（利润率联动）·
   <b>付款不走本系统</b>（无「已付」状态，怎么付钱线下自行安排）· 说明看左下「帮助」</div>
 ${ops([
  ['查看收据（图片链接）','点「📷 查看」弹层看图 —— 审核就在图旁边：待审批的可直接批准/驳回','—'],
  ['批准','必须有收据照片 · 不能自己审批自己 · 无从追溯必须先人工确认归属','计入项目成本（利润率立即联动）· 提交人收通知'],
  ['驳回','必须填原因（留痕）','提交人收通知'],
  ['下载收据到本地','弹层「⬇ 下载到本地」随时可下 · 已批准行多一个「⬇ 收据」快捷链接','存档 / 交外部会计'],
 ])}
 ${helpNote(`<b>这页怎么用</b>：待审批的行点「📷 查看」弹出收据大图——<b>批准 / 驳回就在图旁边</b>，对着图核金额一步审完；
   批准自动计入项目成本并通知提交人，行上多出「⬇ 收据」可下载存档；驳回必填原因。
   无照片 / 无从追溯 / 自己批自己，都会被门禁拦下。`)}
 ${helpNote(`本系统只负责<b>项目管理相关</b>的报销，类别只有三种：<b>材料补购 · 交通递送 · 工具采购</b> ——
   餐费、办公等其他费用不进这里，走外部财务流程。本页只做<b>上报与审批</b>：
   <b>付款不走本系统</b>（没有「已付」状态，付钱线下自行安排——真账在外部财务系统）。`)}
 ${helpNote(`提交端两个入口：<b>施工端 App「报销」屏</b>（拍收据<b>必填</b>，没照片提交不进来；

   超过 1% 变橙提醒。`)}
 <div class="split">

   <td>${e.st==='待审批'?'<span class="pill p-amber">待审批</span>':e.st==='已批准'?`<span class="pill p-green">已批准</span><div class="hint">${e.by}</div>`:`<span class="pill p-red">已驳回</span><div class="hint">${e.by}</div>`}</td>
   <td class="hint" style="max-width:180px">${e.note||'—'}</td>

     <button class="btn" onclick="expNo('${e.id}')">驳回</button>`:'—'}</td>

'fin/项目收款S1-S3':()=>{
 /* 状态推导：每项目当前节点 + 门禁 + 超期 */
 const rows=FINPAY.filter(f=>{const q=finQ.trim().toLowerCase();
   const pj=PROJECTS.find(p=>p.code===f.code)||{};
   if(q&&!(f.code+' '+(pj.name||'')+' '+f.payer).toLowerCase().includes(q)) return false;
   const st=finStage(f);
   if(finF==='全部') return true;
   if(finF==='已清') return !st.m;
   if(finF==='等工程') return !!st.gate;
   return st.m&&st.m.s===finF&&!st.gate; });
 const act=FINPAY.filter(f=>finStage(f).m);
 /* 饼：在途项目按当前节点 */
 const cats={}; act.forEach(f=>{const st=finStage(f);
   const k=st.gate?(st.gate.includes('SM3')?'等 SM3':'等 SM4'):st.m.s+(st.m.inv?' 请款中':' 待请款');
   (cats[k]=cats[k]||[]).push(f);});
 const ORDER=['S1 待请款','S1 请款中','等 SM3','S2 待请款','S2 请款中','等 SM4','S3 待请款','S3 请款中'];
 const keys=ORDER.filter(k=>cats[k]);
 const PIEF=['#7fb0f6','#5b93f2','#3a76e8','#2d63d0','#2a5cc4','#234ea8','#1f4497','#193a7e'];
 let acc=0,tot=act.length;
 const slices=keys.map((k,i)=>{const n=cats[k].length;
   const a0=acc/tot*2*Math.PI-Math.PI/2; acc+=n; const a1=acc/tot*2*Math.PI-Math.PI/2;
   const r=62,cx=84,cy=84;
   if(n===tot) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIEF[i]}" stroke="#fff" stroke-width="2"><title>${k} ${n} 个</title></circle>`;
   const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   const large=(a1-a0)>Math.PI?1:0;
   return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${PIEF[i]}" stroke="#fff" stroke-width="2"><title>${k} ${n} 个</title></path>`;}).join('');
 /* 柱：每在途项目一根（S1~S3 应收=签约价90%；绿已收/蓝未收，超期未收=红） */
 const bMax=Math.max(1,...act.map(f=>f.price*.9));
 const bars=act.map((f,i)=>{const dueT=f.price*.9;
   const paidT=f.ms.slice(0,3).reduce((a,m)=>a+msPaid(m),0);
   const over=f.ms.slice(0,3).some(m=>m.inv&&!m.settled&&daysSince(m.inv)>finSet.overdueDays);
   const H=140,base=160,W=34,x=30+i*76;
   const hP=Math.round(paidT/bMax*H), hU=Math.round((dueT-paidT)/bMax*H);
   const pj=PROJECTS.find(p=>p.code===f.code)||{};
   return `<rect x="${x}" y="${base-hP}" width="${W}" height="${Math.max(hP-1,1)}" fill="#047857" rx="2"><title>${f.code} 已收 ${A$(paidT)}</title></rect>
     <rect x="${x}" y="${base-hP-hU}" width="${W}" height="${Math.max(hU-1,1)}" fill="${over?'#dc2626':'#2563eb'}" rx="2"><title>${f.code} 未收 ${A$(dueT-paidT)}${over?' · 已超期':''}</title></rect>
     <text x="${x+W/2}" y="${base+13}" font-size="9" text-anchor="middle" fill="#5f6b76">${f.code.slice(-4)} ${pj.nick||''}</text>`;}).join('');
 const chips=['全部','S1','S2','S3','等工程','已清'];
 const msCell=(f,m)=>{ const due=msDue(f,m),paid=msPaid(m);
   const over=m.inv&&!m.settled&&daysSince(m.inv)>finSet.overdueDays;
   const pill=m.settled?`<span class="pill p-green">已结清 ✓</span>`
     :m.inv?(paid>0?`<span class="pill p-amber">部分到账</span>`:over?`<span class="pill p-red">已请款·超期</span>`:`<span class="pill p-cyan">已请款</span>`)
     :`<span class="pill p-grey">未请款</span>`;
   const lastRecv=m.recv.length?m.recv[m.recv.length-1].at:'—';
   const lastRem=m.remind.length?`${m.remind.length} 次 · ${m.remind[m.remind.length-1].at}`:'—';
   return `<td class="gs num">${can('customer')?A$(due):'— —'}
       ${m.inv?`<div class="hint" title="应收发出即定格 —— 要改金额须 invoice_ver+1 重开新版">🔒 ${m.inv} · v${m.ver}</div>`:''}</td>
     <td>${pill}${m.settled?`<div class="hint">${m.settledAt}${m.gap?` · 差 ${A$(m.gap)} 已批`:''}</div>`:''}</td>

'mt/维护单跟踪':()=>{

 const rows=MCASES.filter(c=>(mtF==='全部'||mtStage(c).k===mtF)
   &&(!q||`${c.id} ${c.code} ${pjNick(c.code)} ${pjAddr(c.code)}`.toLowerCase().includes(q)));
 return `<h2>维护单跟踪</h2>

  ['按状态过滤 / 搜索','—','只影响显示'],

 ${helpNote(`成本一栏是<b>现算</b>：人工＝（在场+路上）× 该员工成本时薪（工时来自 App 打卡）；
   物料＝维护出库的更换件，<b>从库管出库台账自动归集</b>（出库那刻单价已定格）。
   两样都不用手填 —— 手填的数字迟早跟台账对不上。`)}

     style="width:220px;padding:6px var(--sp-2)" oninput="mtQ=this.value;keepFocus('mtq2')">
   <span class="muted" style="font-size:var(--fs-xs);margin-left:auto">${rows.length} / ${MCASES.length} 张</span>
 </div>

    <th style="width:100px">成本（现算）</th><th style="width:60px"></th></tr></thead>
  <tbody>${rows.map(c=>{const g=mtStage(c);const t=mtThree(c);const open=mtSel===c.id;
    const cost=(c.site||c.travel)?mtCost(c):null;
    const main=`<tr${c.st==='已作废'?' style="opacity:.5"':''}>
     <td><b class="mono">${c.id}</b></td>
     <td><b>${pjNick(c.code)}</b><div class="hint">📍 ${pjAddr(c.code)}</div></td>
     <td><span class="pill ${g.cls}">${g.k}</span></td>
     <td class="hint">${c.st==='已作废'?('作废原因：'+(c.voidWhy||'—')):g.next}</td>
     <td>${mtSite(c).cause?causeCn(mtSite(c).cause):'<span class="muted">现场还没确认</span>'}</td>
     <td>${c.free==null?'<span class="muted">—</span>'
       :c.free?'<span class="pill p-green">全免</span>':'<span class="pill p-amber">计费</span>'}</td>
     <td class="num">${cost==null?'—':(can('salary')&&can('stock')?A$2(cost):'— —')}</td>
     <td><a style="color:var(--accent);cursor:pointer" onclick="mtSel=${open?'null':`'${c.id}'`};renderAll()">${open?'收起 ▴':'明细 ▸'}</a></td></tr>`;

    return main+`<tr><td colspan="8" style="background:var(--bg-elevated);padding:var(--sp-3)">

        <div class="hint" style="line-height:1.9;margin-top:5px">
         报修时间：${rp.at?`<b class="mono">${rp.at}</b>`:'<b>【未知】</b>（客户说不清，留空不猜 · 不参与响应统计）'}<br>
         渠道：${rp.ch||'—'} ｜ 接单：${rp.by||'—'} ｜ 现象：${rp.sym||'—'}<br>
         客户原话：${rp.note||'—'}${c.est?`<br>口头预估：${A$(c.est)} <span class="muted">（仅参考，不参与计费）</span>`:''}</div>
        <b style="font-size:var(--fs-sm);display:block;margin-top:10px">② 上门</b>
        <div class="hint" style="line-height:1.9;margin-top:5px">
         ${c.job?`${c.job.who} · ${c.job.d} ${c.job.st}–${c.job.et}`:'还没派工'}<br>
         三样齐：${['归因','服务内容','客户签字'].map((lb,i)=>{const okk=[t.cause,t.sum,t.sign][i];
           return `<span class="pill ${okk?'p-green':'p-red'}">${okk?'✓':'✗'} ${lb}</span>`;}).join(' ')}<br>
         ${sr.summary?`服务内容：${sr.summary}<br>`:''}
         ${sr.signBy?`客户签字：<b>${sr.signBy}</b> · ${sr.signAt}${sr.photos?` · 现场照片 ${sr.photos} 张`:''}`:''}</div>
       </div>
       <div><b style="font-size:var(--fs-sm)">③ 免责判定（结案时定格）</b>
        <div class="hint" style="line-height:1.9;margin-top:5px">${j.why}</div>
        <b style="font-size:var(--fs-sm);display:block;margin-top:10px">④ 成本构成（现算 · 不手填）</b>
        ${(can('salary')&&can('stock'))?`<table style="margin-top:5px"><tbody>
          <tr><td>人工</td><td class="hint">（在场 ${c.site||0}h + 路上 ${c.travel||0}h）× A$${c.costHr||0}/h</td>
            <td class="num">${A$2(mtLabor(c))}</td></tr>
          ${(c.parts||[]).map(p=>`<tr><td>物料</td><td class="hint">${p.name} ×${p.qty}<br><span class="muted">${p.src}</span></td>
            <td class="num">${A$2(p.cost)}</td></tr>`).join('')}
          <tr><td><b>合计</b></td><td></td><td class="num"><b>${A$2(mtCost(c))}</b></td></tr>
        </tbody></table>`:'<div class="hint">成本对你隐藏（薪酬与库存成本权限）</div>'}
        <b style="font-size:var(--fs-sm);display:block;margin-top:10px">⑤ 钱（财务在推 · 这里只读）</b>
        <div class="hint" style="line-height:1.9;margin-top:5px">
         状态：${c.st} ｜ 金额：${can('customer')?(c.amt==null?'未定价':A$(c.amt)):'— —'}
         ${c.inv?`<br>Invoice：${c.inv}`:''}</div>
       </div>
      </div></td></tr>`;}).join('')
    ||'<tr><td colspan="8" class="muted" style="padding:var(--sp-4)">这个筛选下没有维护单</td></tr>'}</tbody></table>
 </div>`;
},

 ])}

   <b>免责维保</b>：从<b>交付那天</b>起算，长度是售前签约时定的（3~12 个月）。
