<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KONNEXT 办公管理平台 · 原型</title>
<style>
:root{
  /* 浅色主题 · 经典办公蓝（用户 2026-07-30 定） */
  --bg:#f5f7fa; --bg-panel:#ffffff; --bg-elevated:#eef2f6; --border:#d8e0e8;
  --text:#1f2933; --text-muted:#5f6b76;
  --healthy:#047857; --warning:#b45309; --breach:#dc2626; --loss:#991b1b;
  --accent:#2563eb; --danger:#dc2626;
  --font:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:22px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --radius:6px; --row-h:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:var(--fs-md)/1.5 var(--font);
  -webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
.muted{color:var(--text-muted)}
button{font:inherit;cursor:pointer}

/* ══ 登录 ══ */
#login{min-height:100vh;display:grid;place-items:center;padding:var(--sp-4)}
.login-card{width:100%;max-width:380px;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:10px;padding:var(--sp-5)}
.logo{font-size:var(--fs-xl);font-weight:600;letter-spacing:.06em;margin-bottom:var(--sp-1)}
.logo span{color:var(--accent)}
.login-sub{color:var(--text-muted);font-size:var(--fs-sm);margin-bottom:var(--sp-5)}
label{display:block;font-size:var(--fs-xs);color:var(--text-muted);
  margin-bottom:var(--sp-1);letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);padding:10px var(--sp-3);border-radius:var(--radius);
  font:var(--fs-md) var(--font)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);
  padding:7px var(--sp-3);border-radius:var(--radius);font-size:var(--fs-sm)}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#ffffff;font-weight:600}
.btn-primary:hover{filter:brightness(1.1)}
.btn-block{width:100%;padding:10px;margin-top:var(--sp-4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{margin-bottom:var(--sp-4)}
.note{background:var(--bg-elevated);border-left:2px solid var(--accent);
  padding:var(--sp-2) var(--sp-3);font-size:var(--fs-xs);color:var(--text-muted);
  margin-top:var(--sp-4);border-radius:0 var(--radius) var(--radius) 0}
.demo-pick{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
.demo-pick button{font-size:var(--fs-xs);padding:5px 9px}

/* ══ 主框架 ══ */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;gap:var(--sp-4);height:48px;padding:0 var(--sp-4);
  background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-size:var(--fs-lg);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tab{background:none;border:none;color:var(--text-muted);padding:6px var(--sp-3);
  border-radius:var(--radius);font-size:var(--fs-md);white-space:nowrap;position:relative}
.tab:hover{color:var(--text);background:var(--bg-elevated)}
.tab.on{color:var(--accent);background:var(--bg-elevated)}
.tab.decision{margin-left:auto;border:1px dashed var(--border)}
.badge{background:var(--breach);color:#fff;font-size:9px;padding:1px 5px;border-radius:9px;
  margin-left:5px;vertical-align:1px;font-family:var(--mono)}
.who{display:flex;align-items:center;gap:var(--sp-2);flex-shrink:0}
.who select{width:auto;padding:5px var(--sp-2);font-size:var(--fs-sm)}
.bell{background:none;border:1px solid var(--border);border-radius:var(--radius);
  padding:5px 9px;color:var(--text);font-size:var(--fs-sm)}
.bell:hover{border-color:var(--accent)}

.body{display:flex;flex:1;min-height:0}
.side{width:190px;background:var(--bg-panel);border-right:1px solid var(--border);
  padding:var(--sp-3) 0;flex-shrink:0;overflow-y:auto}
.side-item{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text-muted);padding:8px var(--sp-4);font-size:var(--fs-md);
  border-left:2px solid transparent}
.side-item:hover{color:var(--text);background:var(--bg-elevated)}
.side-item.on{color:var(--accent);border-left-color:var(--accent);background:var(--bg-elevated)}
.side-sep{height:1px;background:var(--border);margin:var(--sp-3) var(--sp-4)}
.main{flex:1;overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.main-inner{padding:var(--sp-4) var(--sp-5);flex:1}
/* ★项目上下文条：所有流程都跟项目走，随时看得见是哪个项目、在哪儿 */
.pjbar{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);
  background:var(--bg-elevated);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.pjbar select{width:auto;max-width:340px;font-size:var(--fs-md);padding:5px var(--sp-2)}
.pjbar .addr{color:var(--text-muted);font-size:var(--fs-sm);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pjbar .sep{width:1px;height:20px;background:var(--border)}
.pjbar .grow{flex:1}
.coybar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-5);
  background:rgba(139,148,158,.07);border-bottom:1px solid var(--border);
  font-size:var(--fs-xs);color:var(--text-muted);position:sticky;top:0;z-index:10}

/* ══ 通用件 ══ */
h2{font-size:var(--fs-lg);font-weight:600;margin-bottom:var(--sp-1)}
.page-sub{color:var(--text-muted);font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:var(--sp-4);overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.panel-head{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);
  font-size:var(--fs-sm);font-weight:600;display:flex;align-items:center;gap:var(--sp-2)}
.panel-body{padding:var(--sp-4)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th{text-align:left;color:var(--text-muted);font-weight:500;font-size:var(--fs-xs);
  letter-spacing:.04em;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);
  white-space:nowrap}
td{padding:var(--sp-3);border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-elevated)}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.masked{color:var(--text-muted);font-family:var(--mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-4)}
.card-label{font-size:var(--fs-xs);color:var(--text-muted);letter-spacing:.04em;
  margin-bottom:var(--sp-2)}
.card-value{font-size:var(--fs-xl);font-family:var(--mono);font-weight:600}
.card-foot{font-size:var(--fs-xs);color:var(--text-muted);margin-top:var(--sp-1)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:var(--fs-xs);
  font-weight:500;white-space:nowrap}
.p-green{background:rgba(16,185,129,.16);color:var(--healthy)}
.p-amber{background:rgba(245,158,11,.16);color:var(--warning)}
.p-red{background:rgba(239,68,68,.16);color:var(--breach)}
.p-grey{background:rgba(139,148,158,.16);color:var(--text-muted)}
.p-loss{background:rgba(153,27,27,.12);color:#991b1b}
.p-cyan{background:rgba(37,99,235,.10);color:var(--accent)}
.warn-bar{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);
  border-radius:var(--radius);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);
  display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-sm)}
.warn-bar.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35)}
.warn-bar.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}
.warn-bar .grow{flex:1}
.gate{background:rgba(239,68,68,.08);border-left:2px solid var(--breach);
  padding:var(--sp-2) var(--sp-3);font-size:var(--fs-xs);color:#b91c1c;
  border-radius:0 var(--radius) var(--radius) 0;margin-top:var(--sp-2)}
.strike{text-decoration:line-through;color:var(--text-muted)}
.hint{font-size:var(--fs-xs);color:var(--text-muted);margin-top:var(--sp-1)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:900px){.split{grid-template-columns:1fr}.side{width:150px}}

/* 排班 */
.sched{overflow-x:auto}
.sched table{min-width:640px}
.blk{border-radius:4px;padding:5px 7px;font-size:var(--fs-xs);margin-bottom:3px;
  border-left:3px solid}
.b-sm{background:rgba(37,99,235,.10);border-color:var(--accent)}
.b-in{background:rgba(16,185,129,.12);border-color:var(--healthy)}
.b-ho{background:rgba(245,158,11,.12);border-color:var(--warning)}
.b-mt{background:rgba(124,58,237,.10);border-color:#7c3aed}

/* 待办抽屉 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);
  background:var(--bg-panel);border-left:1px solid var(--border);z-index:50;
  transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:var(--sp-4);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--sp-3)}
.drawer-body{flex:1;overflow-y:auto;padding:var(--sp-3)}
.todo{background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--sp-3);margin-bottom:var(--sp-2)}
.todo.over{border-color:rgba(239,68,68,.5)}
.todo-top{display:flex;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-1);flex-wrap:wrap}
.todo-act{font-size:var(--fs-sm);color:var(--text)}
.todo-meta{font-size:var(--fs-xs);color:var(--text-muted);margin-top:var(--sp-2)}
.todo-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:var(--sp-2)}
.todo-btns .btn{padding:4px 10px;font-size:var(--fs-xs)}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none}
.backdrop.open{display:block}

/* 进度条 */
.steps{display:flex;gap:2px;margin:var(--sp-3) 0}
.step{flex:1;text-align:center;font-size:var(--fs-xs);padding:var(--sp-2) 2px;
  background:var(--bg-elevated);color:var(--text-muted);border-top:2px solid var(--border)}
.step.done{color:var(--healthy);border-top-color:var(--healthy)}
.step.now{color:var(--accent);border-top-color:var(--accent);background:rgba(37,99,235,.08)}
.step.bad{color:var(--breach);border-top-color:var(--breach)}

/* 售前大表：一页长表 · 冻结前两列 · 分组表头 */
.bigwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-panel);box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:var(--sp-4)}
.bigtable{border-collapse:separate;border-spacing:0;min-width:2080px;font-size:var(--fs-sm);width:max-content}
.bigtable th,.bigtable td{border-bottom:1px solid var(--border);border-right:1px solid #eef2f6;
  padding:var(--sp-2);vertical-align:middle;background:var(--bg-panel);white-space:nowrap}
.bigtable thead .grp th{background:#e8eef7;color:#33507a;font-weight:600;font-size:var(--fs-xs);
  letter-spacing:.05em;text-align:center;padding:9px 12px;border-bottom:2px solid #c3d2e4}
.bigtable thead .leaf th{background:#f3f6fa;color:var(--text-muted);font-weight:500;
  font-size:var(--fs-xs);padding:8px 12px;letter-spacing:.03em}
.bigtable tbody tr:hover td{background:var(--bg-elevated)}
.bigtable .c1{position:sticky;left:0;z-index:3;min-width:110px}
.bigtable .c1b{position:sticky;left:110px;z-index:3;min-width:90px}
.bigtable .c2{position:sticky;left:200px;z-index:3;min-width:170px;border-right:2px solid var(--border)}
.bigtable thead .c1,.bigtable thead .c1b,.bigtable thead .c2{z-index:4}
.bigtable input,.bigtable select{width:auto;padding:4px 6px;font-size:var(--fs-sm)}
.bigtable input.w80{width:84px}.bigtable input.w60{width:60px}
.mini7{display:flex;gap:5px;align-items:flex-start;height:58px}
.m7{display:flex;flex-direction:column;align-items:center;width:21px}
.m7 .bx{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;
  font-size:10px;background:var(--bg-elevated);color:var(--text-muted);cursor:pointer;flex-shrink:0}
.m7.on .bx{background:rgba(4,120,87,.14);color:var(--healthy)}
.m7.now .bx{background:rgba(37,99,235,.16);color:var(--accent);font-weight:700}
.m7:last-child .bx{border:1px dashed rgba(220,38,38,.45)}   /* 第⑦格常显红框：流失/流标 */
.m7.lost .bx{background:rgba(220,38,38,.16);color:var(--breach);font-weight:700;border-style:solid}
/* 勾下 45° 斜排状态文字（用户定） */
.m7 .lb{margin-top:3px;font-size:9px;color:var(--text-muted);font-style:normal;
  transform:rotate(45deg);transform-origin:top left;white-space:nowrap;
  width:10px;letter-spacing:.02em}
.m7.now .lb{color:var(--accent);font-weight:600}
.m7.lost .lb{color:var(--breach);font-weight:600}
/* 列组分隔线（用户定：分组线清晰） */
.bigtable .gs{border-left:2px solid #c3d2e4}
/* 注释大框（用户定）：多行小字 textarea + 悬浮弹出全文 */
.notewrap{position:relative;min-width:176px}
.notewrap textarea{width:176px;min-height:46px;font-size:11px;line-height:1.55;
  padding:5px 7px;resize:vertical;display:block}
.notepop{display:none;position:absolute;bottom:calc(100% + 6px);left:0;z-index:30;
  width:300px;background:#243447;color:#f5f8fa;font-size:11.5px;line-height:1.8;
  padding:9px 11px;border-radius:6px;white-space:pre-wrap;
  box-shadow:0 8px 24px rgba(16,24,40,.28)}
.notewrap:hover .notepop{display:block}
/* 财务侧只读注释框（二十三轮）：大框小字固定两行，文字截断绝不破格；悬停弹全文；标已读固定在框下右侧 */
.fnote{background:#fff8e6;border:1px solid #f0dfae;border-radius:4px;padding:4px 7px;
  font-size:11px;line-height:1.5;width:216px;height:38px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:default}
.fnote-foot{width:216px;display:flex;justify-content:flex-end;margin-top:2px;font-size:11px}
/* 列表行删除按钮（修改抽屉） */
.delx{cursor:pointer;color:var(--breach);font-size:13px;padding:0 5px;font-weight:600}
.delx:hover{background:rgba(220,38,38,.10);border-radius:4px}

/* 立项引导弹层 */
.wizback{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:60;display:none}
.wizback.open{display:block}
.wizbox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(580px,94vw);
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;z-index:61;
  display:none;box-shadow:0 12px 40px rgba(16,24,40,.18)}
.wizbox.open{display:block}
.wizhead{padding:var(--sp-4);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-3)}
.wizdots{display:flex;gap:6px;margin-left:auto}
.wizdots i{width:26px;height:6px;border-radius:3px;background:var(--bg-elevated)}
.wizdots i.on{background:var(--accent)}
.wizbody{padding:var(--sp-4);max-height:62vh;overflow-y:auto}
.wizfoot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);
  display:flex;justify-content:space-between;gap:var(--sp-2)}
</style>
</head>
<body>

<!-- ═══════════════ 登录 ═══════════════ -->
<div id="login">
  <div class="login-card">
    <div class="logo">KON<span>NEXT</span></div>
    <div class="login-sub">办公管理平台 · 原型演示</div>

    <div id="step-phone">
      <div class="field">
        <label>手机号</label>
        <input id="phone" placeholder="+61 4xx xxx xxx" value="+61 411 000 004">
      </div>
      <button class="btn btn-primary btn-block" onclick="sendCode()">获取验证码</button>
      <div class="note">
        全系统<b>无密码</b>——只用短信验证码登录。管理员另需邮箱二次验证。<br>
        账号找回：仅管理员可自助，其余一律由管理员重置。
      </div>
    </div>

    <div id="step-code" style="display:none">
      <div class="field">
        <label>验证码（已发送至 <span id="sent-to" class="mono"></span>）</label>
        <input id="code" placeholder="6 位数字" value="284917" class="mono">
        <div class="hint">10 分钟内有效，用过即失效</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
      <div class="note">
        <b>原型演示：直接选一个身份进入</b>，看同一套界面在不同权限下的差别
        <div class="demo-pick">
          <button class="btn" onclick="loginAs('admin')">陈总 · 核心管理员</button>
          <button class="btn" onclick="loginAs('presales')">小林 · 售前</button>
          <button class="btn" onclick="loginAs('finance')">王姐 · 财务</button>
          <button class="btn" onclick="loginAs('warehouse')">老张 · 采购＋库管</button>
          <button class="btn" onclick="loginAs('maintenance')">小周 · 运维</button>
          <button class="btn" onclick="loginAs('eng')">陈工 · 工程管理</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ 主界面 ═══════════════ -->
<div id="app">
  <header class="topbar">
    <div class="brand">KON<span>NEXT</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <button class="bell" onclick="toggleDrawer()">🔔 待办 <span id="todo-n" class="mono"></span></button>
      <select id="who-sel" onchange="switchWho(this.value)"></select>
    </div>
  </header>

  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="toggleDrawer()"></div>
<div id="toasts" style="position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:420px"></div>
<div id="uiback" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:90"></div>
<div id="uibox" style="display:none;position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:91;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(16,24,40,.25);
  width:min(460px,92vw);padding:18px 20px">
  <div id="uimsg" style="font-size:var(--fs-sm);line-height:1.8;white-space:pre-wrap"></div>
  <input id="uiinput" style="display:none;width:100%;margin-top:10px">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
    <button class="btn" onclick="uiCancel()">取消</button>
    <button class="btn btn-primary" id="uiokbtn" onclick="uiOk()">确定</button>
  </div>
</div>

function tplRender(str,f,m,lang){
  const due=msDue(f,m),paid=msPaid(m);
  const over=m.inv?Math.max(daysSince(m.inv)-finSet.overdueDays,0):0;
  const map={'付款人':f.payer,'项目昵称':pjNick(f.code),'项目地址':pjAddr(f.code),'项目编号':f.code,
    '节点':m.s,'节点名':(lang==='en'?STAGE_NAME_EN:STAGE_NAME)[m.s]||'','应收金额':A$(due),'已收金额':A$(paid),
    '还差金额':A$(Math.round((due-paid)*100)/100),'Invoice号':'INV-'+f.code.slice(-4)+'-'+m.s,
    'Invoice日期':m.inv||'—','版本':'v'+(m.ver||1),'超期天数':String(over),
    '催款次数':String(m.remind.length+1),'公司名':'KONNEXT','联系电话':'02 8000 0000'};
  return str.replace(/\{([^}]+)\}/g,(_,k)=>map[k]!==undefined?map[k]:'{'+k+'}'); }

  if(path.length===2){ old=finSet[path[0]][path[1]]; finSet[path[0]][path[1]]=nv; }
  else{ old=finSet[k]; finSet[k]=nv; }

  renderAll(); }

/* ── 状态勾点选与反选（用户定：支持人为点错回退；改后停留清零重新计时提醒） ── */
function preTick(code,i){
  const p=BIGPD.find(x=>x.code===code); if(!p) return;
  const s0=p.step;
  if(p.lost){ uiAlert('该项目已勾「已流失」（终态）——先点第⑦勾取消流失，才能改前六步'); return; }
  const target=i+1;
  if(target===p.step){                       // 点当前勾 = 反选回退一步
    if(p.step===1){ uiAlert('「接洽中」是立项后的起始状态，不能取消'); return; }
    if(p.step===6) uiAlert('已撤回「已签约」（演示）——正式系统会通知财务并留痕');
    p.step=p.step-1;
  }else{
    p.step=target;                            // 前进，或直接点回更早的勾
    if(target===6) uiAlert('已勾「已签约」→ 自动通知财务开 S1 定金 Invoice（演示）');
  }
  p.d=(p.d||[]).slice(0,p.step);
  for(let k=0;k<p.step;k++) if(!p.d[k]||p.d[k]==='··') p.d[k]='今天';
  p.d[p.step-1]=p.d[p.step-1]||'今天';
  p.stay=(p.step>=6)?'':0;                    // 终态不计停留；其余从 0 重新计时→提醒重算
  todoWake(code);                             // 状态改变：该项目「已知悉/搁置」失效，通知重新启动
  if(p.step!==s0) opLog(code, p.step>s0?'勾状态推进':'勾状态回退',
    STAGES[s0-1]+' → '+STAGES[p.step-1], p.step>=6?['presales','fin']:['presales']);
  renderAll();
}
function preLost(code){
  const p=BIGPD.find(x=>x.code===code); if(!p) return;
  if(!p.lost&&p.step>=6){ uiAlert('已签约项目不走「流失」——如需作废走财务撤销流程（后续版本）'); return; }
  p.lost=!p.lost;
  if(p.lost){ (p.d=p.d||[])[6]='今天'; p.stay='';
    opLog(code,'勾已流失',STAGES[p.step-1]+' → 已流失（终态归档，整行变灰）',['presales']);
    uiAlert('已勾「已流失」（=流标，终态归档）。点错的话再点一次第⑦勾即可取消'); }
  else{ if(p.d) p.d[6]=undefined; p.stay=0;
    opLog(code,'取消已流失','回到第 '+p.step+' 步「'+STAGES[p.step-1]+'」· 停留从今天重新计时',['presales']);
    uiAlert('已取消「已流失」——项目回到第 '+p.step+' 步，停留从今天重新计时'); }
  todoWake(code);                             // 状态改变：该项目「已知悉/搁置」失效，通知重新启动
  renderAll();
}

/* ───────── 售前 · 项目状态表（十一轮定：比例扇形 + 立项去向柱 + 状态过滤同款大表） ───────── */
'presales/项目状态表':()=>{
 /* 状态过滤出的行 —— 表格与「项目列表」完全同款（preBigTable），勾/修改/注释全可操作 */
 const idx=STAGES.indexOf(stFilter);
 const stRows=BIGPD.filter(p=> stFilter==='全部'?true
   : stFilter==='已流失'?p.lost
   : stFilter==='已签约'?(!p.lost&&p.step>=6)
   : (!p.lost&&!(p.step>=6)&&p.step===idx+1));
 /* 扇形：在途项目（非签约非流标）按状态占比 · 有序阶段=同蓝系浅→深 + 逐片直标 + 旁表兜底 */
 const active=BIGPD.filter(p=>!p.lost&&p.step<6);
 const PIE=['#7fb0f6','#5b93f2','#3a76e8','#2a5cc4','#1f4497'];
 const counts=[1,2,3,4,5].map(s=>active.filter(p=>p.step===s).length);
 const total=counts.reduce((a,b)=>a+b,0);
 let acc=0;
 const slices=total?counts.map((n,i)=>{
   if(!n) return '';
   const a0=acc/total*2*Math.PI-Math.PI/2; acc+=n;
   const a1=acc/total*2*Math.PI-Math.PI/2;
   const r=70,cx=92,cy=92,large=(a1-a0)>Math.PI?1:0;
   if(n===total) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE[i]}" stroke="#fff" stroke-width="2"><title>${STAGES[i]} ${n} 个 · 100%</title></circle>`;
   const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   const mid=(a0+a1)/2,lx=cx+(r+13)*Math.cos(mid),ly=cy+(r+13)*Math.sin(mid);
   return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
      fill="${PIE[i]}" stroke="#fff" stroke-width="2"><title>${STAGES[i]} ${n} 个 · ${Math.round(n/total*100)}%</title></path>
    <text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="10" fill="#1f2933"
      text-anchor="${Math.cos(mid)>=0?'start':'end'}">${STAGES[i]} ${Math.round(n/total*100)}%</text>`;
 }).join(''):'';
 /* 柱状：所选时段内「立项」的项目按当前状态拆三段 —— 按立项日期取窗口，现算不落库 */
 const cohort=cohortAll();
 const PRE_STATS={week:{label:'周',full:'过去一周',days:7},
   month:{label:'月',full:'过去 1 个月',days:30},
   quarter:{label:'季',full:'过去 1 季度',days:91},
   year:{label:'年',full:'过去 1 年',days:365}};
 const st0=PRE_STATS[statPeriod];
 const _now=new Date(), since=new Date(_now.getTime()-st0.days*86400000);
 since.setHours(0,0,0,0);
 const win=cohort.filter(c=>c.opened&&new Date(c.opened)>=since);
 const st={label:st0.label,full:st0.full,opened:win.length,
   signed:win.filter(c=>c.out==='s').length,lost:win.filter(c=>c.out==='l').length};
 const pend=Math.max(0,st.opened-st.signed-st.lost);
 const H=170,W=64,bx=58,base=196,hOf=n=>st.opened?Math.round(n/st.opened*H):0;
 const hS=hOf(st.signed),hL=hOf(st.lost),hP=H-hS-hL;
 const seg=(y,h,c,label,n)=>h<=0?'':`<rect x="${bx}" y="${y}" width="${W}" height="${Math.max(h-2,1)}" fill="${c}" rx="3"><title>${label} ${n} 个</title></rect>
   <text x="${bx+W+10}" y="${y+h/2+4}" font-size="11" fill="#1f2933">${label} ${n}</text>`;
 const bar=seg(base-hS,hS,'#047857','已签约',st.signed)
   +seg(base-hS-hL,hL,'#dc2626','已流标',st.lost)
   +seg(base-H,hP,'#2563eb','待签约(在途)',pend);
 /* 近 12 个月（含当月）：逐月由 opened + 当前状态现算 —— 改勾/新立项即时回填到对应月柱 */
 const M12=[...Array(12)].map((_,i)=>{const d=new Date(_now.getFullYear(),_now.getMonth()-11+i,1);
   return String(d.getFullYear()).slice(2)+'-'+String(d.getMonth()+1).padStart(2,'0');});
 const MONTHS=M12.map(m=>{const rows=cohort.filter(c=>ymOf(c.opened)===m);
   return {m,o:rows.length,s:rows.filter(c=>c.out==='s').length,
     l:rows.filter(c=>c.out==='l').length};});
 const mMax=Math.max(1,...MONTHS.map(x=>x.o)), mH=150, mBase=180, mW=24, mPitch=45, mX0=34;
 const mh=n=>n?Math.max(Math.round(n/mMax*mH),3):0;
 const mbars=MONTHS.map((x,i)=>{
   const p=x.o-x.s-x.l, bx2=mX0+i*mPitch;
   let y=mBase, out='';
   const one=(n,c,label)=>{ if(!n) return; const h=mh(n); y-=h;
     out+=`<rect x="${bx2}" y="${y}" width="${mW}" height="${Math.max(h-2,1)}" fill="${c}" rx="2"><title>${x.m} ${label} ${n} 个</title></rect>`; };
   one(x.s,'#047857','已签约'); one(x.l,'#dc2626','已流标'); one(p,'#2563eb','待签约(在途)');
   out+=`<text x="${bx2+mW/2}" y="${y-5}" font-size="10" text-anchor="middle" fill="#1f2933">${x.o}</text>`;
   out+=`<text x="${bx2+mW/2}" y="${mBase+14}" font-size="9" text-anchor="middle"
     fill="${i===MONTHS.length-1?'#1f2933':'#8b98a5'}"${i===MONTHS.length-1?' font-weight="700"':''}>${x.m}</text>`;
   return out;
 }).join('');
 return `<h2>项目状态表</h2>
 <div class="page-sub">上半看全局：比例与立项去向 · 下半按状态过滤，表格与「项目列表」同款可操作 · 说明看左下「？ 帮助」</div>
 ${ops([
  ['按状态过滤（全部 + 6+1）','—','下表与「项目列表」完全同款：勾可点选/反选、修改抽屉、注释大框都能用'],
  ['切换时间范围（周/月/季/年 方块）','—','按立项日期取窗口，去向柱立即重算'],
 ])}
 ${helpNote(`扇形图 = <b>在途</b>项目（不含已签约/已流失）里每个状态的占比 —— 有序阶段用同一蓝色由浅到深，
   每片直接标注名称与百分比，右侧表格给出数量兜底。`)}
 ${helpNote(`柱状图 = 所选时段内<b>立项项目的去向</b>：一根柱子分三段 ——
   <span style="color:#047857"><b>绿=已签约</b></span> ·
   <span style="color:#dc2626"><b>红=已流标</b></span> ·
   <span style="color:#2563eb"><b>蓝=还在途（待签约）</b></span>；时间范围点「周/月/季/年」方块切换。`)}
 ${helpNote(`<b>「每月立项项目成交图」</b>（三段柱）= 这个月立的项目后来签了/流了/还在途几个：
   <b>柱顶数字 = 当月新立项总数</b>（没有就是 0）→ 看增长；三段颜色 → 看转化。
   去向永远回填到<b>立项月份</b>的柱上：26-05 立的项哪怕 9 月才流失，红段也记在 26-05 那根柱 ——
   不是积累量、不重复计数。`)}
 ${helpNote(`图表联动：本页所有图都由项目数据<b>现算</b>（立项日期 + 当前状态，跟正式系统同口径）——
   改 6+1 的勾，成交图在该项目<b>立项月份</b>的柱上换色，不动别的月；
   立项引导建新档，成交图<b>当月</b>柱 +1；扇形与上方去向柱一并同步。`)}
 <div class="split">
  <div class="panel"><div class="panel-head">在途项目 · 状态比例
     <span class="muted" style="font-weight:400">不含已签约/已流失 · 共 ${total} 个</span></div>
   <div class="panel-body" style="display:flex;gap:var(--sp-4);align-items:center">
    <svg width="300" height="186" viewBox="-56 0 300 186" role="img" aria-label="在途项目状态比例扇形图">
      ${slices||'<text x="70" y="96" font-size="12" fill="#5f6b76">暂无在途项目</text>'}</svg>
    <table style="flex:1">${STAGES.slice(0,5).map((s,i)=>`
      <tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${PIE[i]};margin-right:6px;vertical-align:-1px"></span>${s}</td>
      <td class="num">${counts[i]} 个</td>
      <td class="num muted">${total?Math.round(counts[i]/total*100):0}%</td></tr>`).join('')}</table>

'fin/财务节点':()=>{
 const sent=FINPAY.flatMap(f=>f.ms.filter(m=>m.inv&&!m.settled).map(m=>({f,m})));
 const owing=sent.reduce((a,x)=>a+msDue(x.f,x.m)-msPaid(x.m),0);
 const overdue=sent.filter(x=>daysSince(x.m.inv)>finSet.overdueDays)
   .reduce((a,x)=>a+msDue(x.f,x.m)-msPaid(x.m),0);
 const recent=FINPAY.flatMap(f=>f.ms.flatMap(m=>m.recv)).filter(r=>daysSince(r.at)<=30);
 const bank=recent.filter(r=>r.how==='走账').reduce((a,r)=>a+r.amt,0);
 const cash=recent.filter(r=>r.how==='现金').reduce((a,r)=>a+r.amt,0);
 const cats={};
 FINPAY.forEach(f=>{const st=finStage(f);
   const k=!st.m?(f.ms[3].inv?'S4 收款中':'S4 待开票'):st.gate?(st.gate.includes('SM3')?'等 SM3':'等 SM4')
     :st.m.s+(st.m.inv?' 请款中':' 待请款');
   (cats[k]=cats[k]||[]).push({f,label:k});});
 const nodeRows=(nodeF==='全部'?Object.values(cats).flat()
   :(cats[nodeF]||[])).slice();
 const stuck=STUCK['fin']||[];
 return `<h2>财务节点</h2>
 <div class="page-sub">财务整体数据一览 + 此刻卡点与异常 · 真正的账在外部财务系统，这里管流程与信息 · 待办去右上角 🔔</div>
 ${helpNote(`四张卡都是<b>现算</b>：应收未收=所有已请款未结清的差额；超期=最后一版 Invoice 发出超 ${finSet.overdueDays} 天仍未结清；

'fin/运维财务支持':()=>{
 const inc=MCASES.filter(c=>c.amt>0).reduce((a,c)=>a+(c.amt||0),0);
 const free=MCASES.filter(c=>c.free).length;
 const costT=Math.round(MCASES.reduce((a,c)=>a+mtCost(c),0)*100)/100;
 return `<h2>运维财务支持 <span class="pill p-cyan">只服务已进入维护阶段的项目</span></h2>
 <div class="page-sub">跟着维护团队的信息走：现场归因+时长 → 财务定价 → 外部系统开 Invoice → 这里记收款 · 说明看左下「？ 帮助」</div>
 ${ops([
  ['定价开票','人没去过不许开票 —— 定价依据=工程人员报回的归因+时长；免责期内按归因判免不免','付款人收短信 · 运维收「已开票」'],
  ['登记收款 → 结案','—','单据状态 open → in_progress → invoiced → paid_closed'],
  ['看成本核算','只读现算 —— 人工与物料都不是手填','定价时旁边给成本参考，心里有底不亏着开票'],
 ])}
 ${helpNote(`免责维保口径：免责期内 <b>产品缺陷/自然老化 → 全免</b>（成本计入维保成本，产品在保返供应商索赔）；
   <b>人为损坏 → 不免</b>，正常计费。口头预估只做参考，实际以发票为准。`)}
 ${helpNote(`成本核算（二十五轮）：<b>人工</b>=（在场+路上）× 该员工成本时薪，工时来自打卡系统现算；
   <b>物料</b>=维护出库的更换件，从<b>库管出库台账自动归集</b>（出库那一刻单价已定格，关联本维护单）——
   两样都不用财务手查手填。免单的单成本照记（计入维保成本）；在保物料走 RMA 索赔，赔回后冲减。`)}
 <div class="cards">
  <div class="card"><div class="card-label">本月维护开票</div><div class="card-value">${can('customer')?A$(inc):'— —'}</div><div class="card-foot">免单 ${free} 单（免责期内）</div></div>
  <div class="card"><div class="card-label">待定价</div><div class="card-value">${MCASES.filter(c=>c.st==='待定价').length} 单</div><div class="card-foot">修完等财务定价</div></div>
  <div class="card"><div class="card-label">已开票未收</div><div class="card-value">${MCASES.filter(c=>c.st==='已开票').length} 单</div><div class="card-foot">收款后点结案</div></div>
  <div class="card"><div class="card-label">本月维护成本（现算）</div>
    <div class="card-value">${can('salary')&&can('stock')?A$2(costT):'— —'}</div>
    <div class="card-foot">人工（打卡工时）+ 物料（出库台账）</div></div>
 </div>
 <table><thead><tr><th>单号</th><th>项目编号</th><th>立项时间</th><th>项目 · 地址</th><th>内容（客户签的就是这段）</th><th>归因</th>
   <th>成本核算（现算 · 只读）</th>
   <th style="text-align:right">口头预估</th><th style="text-align:right">定价/开票</th><th>状态</th><th>操作</th></tr></thead>
 <tbody>${MCASES.map(c=>{
   const lab=mtLabor(c), pts=mtParts(c), tot=mtCost(c);
   const costCell=`<div style="font-size:11px;line-height:1.7">
     <div title="工时来自打卡系统 · 成本时薪按人">👷 人工 ${can('salary')?`<b>${A$2(lab)}</b> <span class="hint">=（在场${c.site}h+路上${c.travel}h）× ${c.tech} A$${c.costHr}/h</span>`:'<span class="masked">— —</span>'}</div>
     <div title="维护出库自动归集，出库单价已定格">🔩 物料 ${can('stock')?`<b>${A$2(pts)}</b> <span class="hint">${c.parts.map(p=>`${p.name}（${p.src}）`).join(' · ')}</span>`:'<span class="masked">— —</span>'}</div>
     <div>Σ 成本 ${can('salary')&&can('stock')?`<b>${A$2(tot)}</b>`:'<span class="masked">— —</span>'}${c.amt>0&&can('salary')&&can('stock')&&can('customer')?` <span class="hint">· 开票 ${A$(c.amt)} → 毛利 ${A$2(Math.round((c.amt-tot)*100)/100)}</span>`:''}${c.free?' <span class="pill p-grey">免单 · 成本计入维保成本</span>':''}</div>
   </div>`;
   return `<tr${c.free?' style="opacity:.8"':''}>
   <td class="mono">${c.id}</td><td><b class="mono">${c.code}</b></td>
   <td class="mono" style="font-size:11px">${OPENED[c.code]||'—'}</td>
   <td><b>${pjNick(c.code)}</b><div class="hint">📍 ${pjAddr(c.code)}</div></td>
   <td style="max-width:200px">${c.content}<div class="hint">${c.dur} · ${c.tech}</div></td>
   <td style="font-size:var(--fs-xs)">${c.free?'<span class="pill p-green">'+c.causeCn+'</span>':c.causeCn}</td>
   <td style="max-width:300px">${costCell}</td>
   <td class="num">${c.est?A$(c.est):'—'}</td>
   <td class="num">${c.st==='待定价'
     ?`<input id="mt-amt-${c.id}" class="mono" style="width:90px" placeholder="定价" value="${c.est||''}">
       <div class="hint" style="white-space:nowrap" title="人工+物料现算合计，定价参考">成本参考 ${can('salary')&&can('stock')?A$2(tot):'— —'}</div>`
     :`${can('customer')?A$(c.amt):'— —'}${c.inv?`<div class="hint">🔒 ${c.inv} 开出</div>`:''}`}</td>
   <td>${c.st==='待定价'?'<span class="pill p-amber">待定价</span>':c.st==='已开票'?'<span class="pill p-cyan">已开票</span>':'<span class="pill p-green">已结案</span>'}</td>
   <td>${c.st==='待定价'?`<button class="btn btn-primary" onclick="mtPrice('${c.id}')">定价开票</button>`
      :c.st==='已开票'?`<button class="btn" onclick="mtRecv('${c.id}')">登记收款结案</button>`:'—'}</td>
 </tr>`;}).join('')}</tbody></table>`;
},

'fin/催账和停服':()=>{
 const _fq=finQ.trim().toLowerCase();
 const _hit=code=>{ if(!_fq) return true; const pj=PROJECTS.find(p=>p.code===code)||{};
   return (code+' '+(pj.nick||'')+' '+(pj.name||'')).toLowerCase().includes(_fq); };
 const rowsC=FINPAY.flatMap(f=>f.ms.filter(m=>m.inv&&!m.settled).map(m=>({kind:'合同款',f,m})))
   .filter(x=>_hit(x.f.code));
 const rowsM=MCASES.filter(c=>c.st==='已开票').map(c=>({kind:'维护单',c})).filter(x=>_hit(x.c.code));
 const total=rowsC.reduce((a,x)=>a+msDue(x.f,x.m)-msPaid(x.m),0)+rowsM.reduce((a,x)=>a+x.c.amt,0);
 return `<h2>催账和停服</h2>
 <div class="page-sub">所有正在收款过程中的项目与维护单一屏盯住 · 超期即入待办每天提醒（同一条更新不累积）·
   为恶性拒付停服做足数据支持 · 说明看左下「？ 帮助」</div>
 ${ops([
  ['最终催款（本页专属）','已标注烂尾的项目不再催款','按「最终催款」模版发出（含 7 日停服警告）· 次数与时间留痕'],
  ['编辑催款模版（页尾）','—','常规/最终两级 × 短信/邮件标题/邮件正文 · 保存即全财务生效并留痕'],
  ['标记拒付 → 项目级停服','停整个项目不是停单张单 · 需确认','全部门收通知：任何新任务派不出 · '+finSet.suspendDays+' 天后提醒停用服务器（声明由市场发）'],
 ])}
 ${helpNote(`催款分两级（用户定）：<b>常规催款</b>在「项目收款S1-S3」和「尾款结算S4与Var」页内发，语气是提醒；
   <b>最终催款</b>只在本页发，语气升级并带「7 日内付清否则停服」警告 —— 是停服前的最后一步。
   <b>已标注烂尾的项目不再关联催款</b>：催也没有意义，直接走拒付停服与法务路径。`)}
 ${helpNote(`两个超期数各管一件事：<b>本期超期</b>从最后一版 Invoice 发出起算 ${finSet.overdueDays} 天 —— 催账用；
   <b>账龄</b>从第一版发出起算，<b>改版重发抹不掉</b> —— 给管理层看，堵住「改金额重发把超期归零」的口子。`)}
 <div class="cards">
  <div class="card"><div class="card-label">在收总额</div><div class="card-value">${can('customer')?A$(total):'— —'}</div><div class="card-foot">合同款 ${rowsC.length} 笔 · 维护 ${rowsM.length} 笔</div></div>
  <div class="card"><div class="card-label">超期笔数</div><div class="card-value">${rowsC.filter(x=>daysSince(x.m.inv)>finSet.overdueDays).length}</div><div class="card-foot">超 ${finSet.overdueDays} 天（设置里改）</div></div>
  <div class="card"><div class="card-label">停服项目</div><div class="card-value">${FINPAY.filter(f=>f.susp).length}</div><div class="card-foot">拒付 · 项目级全面停服</div></div>
 </div>
 <div style="display:flex;gap:var(--sp-2);margin:var(--sp-3) 0;align-items:center">
   <input id="finq5" placeholder="🔍 搜编号 / 昵称…" style="width:220px" value="${finQ}"
     oninput="finQ=this.value;keepFocus('finq5')">
   <span class="muted" style="font-size:var(--fs-xs)">${finQ?'已过滤 · 清空搜索看全部':'全部在收单据'}</span>
 </div>
 <table><thead><tr><th>类型</th><th>项目编号</th><th>立项时间</th><th>项目 · 地址</th><th>单据</th><th style="text-align:right">应收</th>
  <th style="text-align:right">还差</th><th style="text-align:right">本期超期</th><th style="text-align:right">账龄</th>
  <th>最后催款</th><th>操作</th></tr></thead>
 <tbody>${rowsC.map(x=>{const {f,m}=x; const over=daysSince(m.inv)-finSet.overdueDays;
   const age=daysSince(m.firstInv||m.inv); const si=f.ms.indexOf(m);
   return `<tr${f.susp?' style="opacity:.55"':over>0?' class="over"':''}>
   <td>合同款</td><td><b class="mono">${f.code}</b>${f.susp?' <span class="pill p-red">已停服</span>':f.stalled?' <span class="pill p-red">烂尾</span>':''}</td>
   <td class="mono" style="font-size:11px">${OPENED[f.code]||'—'}</td>
   <td><b>${pjNick(f.code)}</b><div class="hint">📍 ${pjAddr(f.code)}</div></td>
   <td class="mono">${m.s} · v${m.ver}${m.ver>1?`<div class="hint" title="账龄从第一版算起，改版抹不掉">首版 ${m.firstInv}</div>`:''}</td>
   <td class="num">${can('customer')?A$(msDue(f,m)):'— —'}</td>
   <td class="num">${can('customer')?A$(msDue(f,m)-msPaid(m)):'— —'}</td>
   <td class="num">${over>0?`<b style="color:var(--breach)">${over} 天</b>`:'—'}</td>
   <td class="num" title="从第一版 Invoice 起算，改版重发抹不掉">${age} 天</td>
   <td style="font-size:11px">${m.remind.length?`${m.remind.length} 次 · ${m.remind[m.remind.length-1].at}<div class="hint">${m.remind[m.remind.length-1].how} · ${m.remind[m.remind.length-1].by}</div>`:'—'}</td>
   <td style="white-space:nowrap">${f.stalled?'<span class="pill p-red" title="已标注烂尾 —— 不再关联催款">烂尾 · 不催款</span> '
     :`<button class="btn" style="border-color:var(--breach);color:var(--breach)" title="按「最终催款」模版弹窗发出（含停服警告）——本页催款即最终催款" onclick="finRemindOpen('${f.code}',${si},'final')">最终催款</button> `}
     ${f.susp?'':`<button class="btn" style="color:var(--breach)" onclick="finSuspend('${f.code}')">拒付停服</button>`}</td>
  </tr>`;}).join('')}
  ${rowsM.map(x=>{const c=x.c;
   return `<tr><td>维护单</td><td><b class="mono">${c.code}</b></td>
   <td class="mono" style="font-size:11px">${OPENED[c.code]||'—'}</td>
   <td><b>${pjNick(c.code)}</b><div class="hint">📍 ${pjAddr(c.code)}</div></td>
   <td class="mono">${c.id}</td>
   <td class="num">${can('customer')?A$(c.amt):'— —'}</td><td class="num">${can('customer')?A$(c.amt):'— —'}</td>
   <td class="num">${daysSince(c.inv)>finSet.overdueDays?`<b style="color:var(--breach)">${daysSince(c.inv)-finSet.overdueDays} 天</b>`:'—'}</td>
   <td class="num">${daysSince(c.inv)} 天</td><td>—</td>
   <td><button class="btn" onclick="mtRecv('${c.id}')">登记收款结案</button></td></tr>`;}).join('')}
 </tbody></table>
 <div class="hint" style="margin-top:var(--sp-3)">催款模版（常规/最终 × 中/英 × 短信/邮件）在
   <a style="color:var(--accent);cursor:pointer" onclick="go('fin','设置')"><b>「设置」</b></a> 里维护 ——
   点催款按钮会弹窗给出按模版渲染好的内容，本次可改、可选渠道与语言、确认后发出
 </div>`;
},

'fin/项目报销':()=>{
 const ok=EXP.filter(e=>e.st==='已批准');
 const byPj={}; ok.filter(e=>e.pj&&e.pj!=='?').forEach(e=>{byPj[e.pj]=(byPj[e.pj]||0)+e.amt;});
 const byCat={}; ok.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amt;});
 const cats=Object.keys(byCat), CPIE=['#7fb0f6','#3a76e8','#2a5cc4','#1f4497'];
 const catT=Object.values(byCat).reduce((a,b)=>a+b,0); let acc=0;
 const slices=cats.map((k,i)=>{const n=byCat[k];
   const a0=acc/catT*2*Math.PI-Math.PI/2; acc+=n; const a1=acc/catT*2*Math.PI-Math.PI/2;
   const r=54,cx=70,cy=70,large=(a1-a0)>Math.PI?1:0;
   if(n===catT) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${CPIE[i%4]}" stroke="#fff" stroke-width="2"><title>${k} ${A$(n)}</title></circle>`;
   const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${CPIE[i%4]}" stroke="#fff" stroke-width="2"><title>${k} ${A$(n)}</title></path>`;}).join('');
 const pjs=Object.keys(byPj), pMax=Math.max(1,...Object.values(byPj));
 const pbars=pjs.map((k,i)=>{const v=byPj[k], H=110, base=126, h=Math.max(Math.round(v/pMax*H),3), x=36+i*112;
   const pct=EXPCOST[k]?(v/EXPCOST[k]*100).toFixed(2):null;
   return `<rect x="${x}" y="${base-h}" width="46" height="${h}" fill="#2563eb" rx="2"><title>${k} 已批报销 ${A$(v)}</title></rect>
     <text x="${x+23}" y="${base-h-16}" font-size="10" text-anchor="middle" fill="#1f2933">${A$(v)}</text>
     <text x="${x+23}" y="${base-h-5}" font-size="9" text-anchor="middle" fill="${pct>1?'#b45309':'#5f6b76'}">${pct?'占成本 '+pct+'%':''}</text>
     <text x="${x+23}" y="${base+13}" font-size="9" text-anchor="middle" fill="#5f6b76">${k.slice(-4)}</text>`;}).join('');
 return `<h2>项目报销 <span class="pill p-cyan">只管项目管理报销 · 类别仅：材料 / 工具 / 交通递送</span></h2>
 <div class="page-sub">记录采购信息与项目的关系 · 已批准的自动计入项目成本、直接影响利润率 ·
   餐费等其他费用不走本系统（外部财务处理）· 说明看左下「？ 帮助」</div>
 ${ops([
  ['批准','必须有收据照片 · 不能自己审批自己 · 无从追溯必须先人工确认归属','计入项目成本（利润率立即联动）· 提交人收通知'],
  ['驳回','必须填原因（留痕）','提交人收通知'],
 ])}
 ${helpNote(`本系统只负责<b>项目管理相关</b>的报销，类别只有三种：<b>材料（补购）· 工具 · 交通递送</b> ——
   餐费、办公等其他费用不进这里，走外部财务流程。`)}
 ${helpNote(`三态归属：每笔报销要么落到<b>具体项目</b>（进项目成本），要么明确标<b>公司级</b>（单列不进项目），
   要么<b>★无从追溯</b>（红牌，人工确认前不能批）。柱状图上的「占成本 %」就是报销对该项目成本的侵蚀 ——
   超过 1% 变橙提醒。`)}
 <div class="split">
  <div class="panel"><div class="panel-head">各项目已批报销 · 占项目成本 %</div>
   <div class="panel-body" style="overflow-x:auto"><svg width="${60+pjs.length*112}" height="150"><line x1="20" y1="126" x2="${40+pjs.length*112}" y2="126" stroke="#d8e0e8"/>${pbars}</svg></div></div>
  <div class="panel"><div class="panel-head">类别分布（已批准）</div>
   <div class="panel-body" style="display:flex;gap:var(--sp-4);align-items:center">
    <svg width="140" height="140" viewBox="0 0 140 140">${slices}</svg>
    <table style="flex:1">${cats.map((k,i)=>`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${CPIE[i%4]};margin-right:6px;vertical-align:-1px"></span>${k}</td><td class="num">${A$(byCat[k])}</td></tr>`).join('')}</table>
   </div></div>
 </div>
 <table><thead><tr><th>单号</th><th>提交人</th><th>项目编号</th><th>立项时间</th><th>项目 · 地址</th><th>类别</th>
   <th style="text-align:right">金额</th><th>收据</th><th>状态</th><th>说明</th><th>操作</th></tr></thead>
 <tbody>${EXP.map(e=>`<tr${e.st==='已驳回'?' style="opacity:.55"':''}>
   <td class="mono">${e.id}</td><td>${e.who}<div class="hint">${e.dept}</div></td>
   <td>${e.pj==='?'?'<span class="pill p-red">★ 无从追溯</span>':e.pj?`<b class="mono">${e.pj}</b>`:'<span class="pill p-grey">公司级</span>'}</td>
   <td class="mono" style="font-size:11px">${e.pj&&e.pj!=='?'?(OPENED[e.pj]||'—'):'—'}</td>
   <td>${(()=>{if(e.pj==='?') return '<span class="hint">需人工确认归属</span>';
     if(!e.pj) return '<span class="hint">不属于单个项目</span>';
     const pj=PROJECTS.find(p=>p.code===e.pj)||{};
     return `<b>${pj.nick||''}</b><div class="hint">📍 ${pj.street||''}, ${pj.suburb||''} ${pj.state||''}</div>`;})()}</td>
   <td>${e.cat}</td><td class="num">${A$(e.amt)}</td>
   <td>${e.rc?'📎 ✓':'<span style="color:var(--breach)">✗ 无</span>'}</td>
   <td>${e.st==='待审批'?'<span class="pill p-amber">待审批</span>':e.st==='已批准'?`<span class="pill p-green">已批准</span><div class="hint">${e.by}</div>`:`<span class="pill p-red">已驳回</span><div class="hint">${e.by}</div>`}</td>
   <td class="hint" style="max-width:180px">${e.note||'—'}</td>
   <td style="white-space:nowrap">${e.st==='待审批'?`<button class="btn btn-primary"${e.self?' title="不能自己审批自己的报销"':''} onclick="expOk('${e.id}')">批准</button>
     <button class="btn" onclick="expNo('${e.id}')">驳回</button>`:'—'}</td>
 </tr>`).join('')}</tbody></table>`;
},
